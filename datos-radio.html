        // =====================================================
        // AUDIO
        // =====================================================

        const audioRadio =
            new Audio();

        audioRadio.preload =
            "auto";


        let audioActivo =
            false;

        let idAudioActual =
            null;

        let cargandoAudio =
            false;


        // Este número sirve para invalidar cargas

        let numeroCargaAudio =
            0;


        // =====================================================
        // DATOS
        // =====================================================

        let radio =
            {};

        let canciones =
            {};

        let radioCargado =
            false;

        let cancionesCargadas =
            false;


        // =====================================================
        // LIMPIAR PANTALLA
        // =====================================================

        function limpiarPantalla() {

            radioInfo.style.backgroundImage =
                "none";

            titulo.textContent =
                "";

            compositor.textContent =
                "";

            interpreta.textContent =
                "";

            enEmision.style.display =
                "none";

            botonEscuchar.style.display =
                "none";

            botonEscuchar.textContent =
                "🎧 Escuchar radio";

            botonEscuchar.disabled =
                false;

            cargando.style.display =
                "none";
        }


        // =====================================================
        // ACTUALIZAR PANTALLA
        // =====================================================

        function actualizarPantalla() {

            if (
                !radioCargado ||
                !cancionesCargadas
            ) {

                radioInfo.style.display =
                    "flex";

                cargando.style.display =
                    "block";

                return;
            }


            const estado =
                String(
                    radio.estado || ""
                ).trim();


            console.log(
                "Estado recibido:",
                estado
            );


            // =================================================
            // STOPPED
            // =================================================

            if (
                estado === "stopped"
            ) {

                detenerAudioCompleto();

                limpiarPantalla();

                radioInfo.style.display =
                    "none";

                return;
            }


            // =================================================
            // OTROS ESTADOS
            // =================================================

            if (
                estado !== "playing" &&
                estado !== "En emisión"
            ) {

                detenerAudioCompleto();

                limpiarPantalla();

                radioInfo.style.display =
                    "none";

                return;
            }


            // =================================================
            // RADIO EN EMISIÓN
            // =================================================

            radioInfo.style.display =
                "flex";

            enEmision.style.display =
                "block";

            botonEscuchar.style.display =
                "inline-block";


            const id =
                radio.cancionActual;


            if (!id) {

                titulo.textContent =
                    "";

                compositor.textContent =
                    "";

                interpreta.textContent =
                    "";

                radioInfo.style.backgroundImage =
                    "none";

                cargando.style.display =
                    "none";

                return;
            }


            const cancion =
                canciones[id];


            if (!cancion) {

                titulo.textContent =
                    "";

                compositor.textContent =
                    "";

                interpreta.textContent =
                    "";

                radioInfo.style.backgroundImage =
                    "none";

                cargando.style.display =
                    "none";

                return;
            }


            // =================================================
            // TÍTULO
            // =================================================

            titulo.textContent =
                cancion.titulo || "";


            // =================================================
            // COMPOSITOR
            // =================================================

            compositor.textContent =
                cancion.compositor
                    ? "Compositor: " +
                      cancion.compositor
                    : "";


            // =================================================
            // INTÉRPRETE
            // =================================================

            interpreta.textContent =
                cancion.interpreta
                    ? "Interpreta: " +
                      cancion.interpreta
                    : "";


            // =================================================
            // IMAGEN
            // =================================================

            if (cancion.imagen) {

                radioInfo.style.backgroundImage =
                    `url("${cancion.imagen}")`;

            } else {

                radioInfo.style.backgroundImage =
                    "none";
            }


            // =================================================
            // POSICIÓN DE IMAGEN
            // =================================================

            const x =
                cancion.posicionX !== undefined
                    ? Number(cancion.posicionX)
                    : 50;

            const y =
                cancion.posicionY !== undefined
                    ? Number(cancion.posicionY)
                    : 50;


            radioInfo.style.backgroundPosition =
                `${x}% ${y}%`;


            cargando.style.display =
                "none";
        }


        // =====================================================
        // DETENER AUDIO COMPLETAMENTE
        // =====================================================

        function detenerAudioCompleto() {

            numeroCargaAudio++;

            audioRadio.pause();

            audioRadio.removeAttribute("src");

            audioRadio.load();

            audioActivo =
                false;

            idAudioActual =
                null;

            cargandoAudio =
                false;

            botonEscuchar.disabled =
                false;

            botonEscuchar.textContent =
                "🎧 Escuchar radio";
        }


        // =====================================================
        // REPRODUCIR SINCRONIZADO
        // =====================================================

        function reproducirSincronizado(
            reproduccionAutomatica = false
        ) {

            const id =
                radio.cancionActual;


            if (!id) {

                if (!reproduccionAutomatica) {

                    alert(
                        "No hay ninguna marcha en emisión."
                    );
                }

                return;
            }


            const cancion =
                canciones[id];


            if (!cancion) {

                if (!reproduccionAutomatica) {

                    alert(
                        "No se encontró la marcha."
                    );
                }

                return;
            }


            if (!cancion.audio) {

                if (!reproduccionAutomatica) {

                    alert(
                        "Esta marcha no tiene audio."
                    );
                }

                return;
            }


            const inicio =
                Number(
                    radio.inicioEmision
                );


            if (
                !Number.isFinite(inicio) ||
                inicio <= 0
            ) {

                console.error(
                    "inicioEmision no es válido:",
                    radio.inicioEmision
                );

                if (!reproduccionAutomatica) {

                    alert(
                        "La emisión todavía no tiene una hora de inicio válida."
                    );
                }

                return;
            }


            // Invalidamos cualquier carga anterior.

            const numeroActual =
                ++numeroCargaAudio;


            cargandoAudio =
                true;


            idAudioActual =
                id;


            botonEscuchar.disabled =
                true;


            botonEscuchar.textContent =
                "⏳ Cargando radio...";


            console.log(
                "Preparando audio:",
                cancion.titulo
            );


            // =================================================
            // DETENER AUDIO ANTERIOR
            // =================================================

            audioRadio.pause();

            audioRadio.src =
                cancion.audio;

            audioRadio.load();


            // =================================================
            // ESPERAR METADATA
            // =================================================

            const cuandoCargue =
                function () {

                    audioRadio.removeEventListener(
                        "loadedmetadata",
                        cuandoCargue
                    );


                    // -----------------------------------------
                    // COMPROBAR QUE ESTA CARGA SIGUE VIGENTE
                    // -----------------------------------------

                    if (
                        numeroActual !==
                        numeroCargaAudio
                    ) {

                        return;
                    }


                    cargandoAudio =
                        false;

                    botonEscuchar.disabled =
                        false;


                    // -----------------------------------------
                    // COMPROBAR CANCIÓN
                    // -----------------------------------------

                    if (
                        radio.cancionActual !== id
                    ) {

                        botonEscuchar.textContent =
                            "🎧 Escuchar radio";

                        return;
                    }


                    // -----------------------------------------
                    // CALCULAR TIEMPO
                    // -----------------------------------------

                    const ahora =
                        Date.now();


                    const tiempoTranscurrido =
                        (
                            ahora -
                            inicio
                        ) / 1000;


                    console.log(
                        "Nueva marcha:",
                        cancion.titulo
                    );


                    console.log(
                        "Tiempo transcurrido:",
                        tiempoTranscurrido
                    );


                    console.log(
                        "Duración:",
                        audioRadio.duration
                    );


                    // -----------------------------------------
                    // SI YA TERMINÓ
                    // -----------------------------------------

                    if (
                        !Number.isFinite(
                            audioRadio.duration
                        )
                    ) {

                        console.error(
                            "Duración del audio inválida."
                        );

                        botonEscuchar.textContent =
                            "🎧 Escuchar radio";

                        return;
                    }


                    if (
                        tiempoTranscurrido >=
                        audioRadio.duration
                    ) {

                        console.log(
                            "La marcha ya terminó."
                        );

                        botonEscuchar.textContent =
                            "🎧 Escuchar radio";

                        return;
                    }


                    // -----------------------------------------
                    // TIEMPO NEGATIVO
                    // -----------------------------------------

                    if (
                        tiempoTranscurrido < 0
                    ) {

                        botonEscuchar.textContent =
                            "🎧 Escuchar radio";

                        return;
                    }


                    // -----------------------------------------
                    // POSICIONAR
                    // -----------------------------------------

                    try {

                        audioRadio.currentTime =
                            tiempoTranscurrido;

                    }

                    catch (error) {

                        console.error(
                            "Error al cambiar currentTime:",
                            error
                        );

                        botonEscuchar.textContent =
                            "🎧 Escuchar radio";

                        return;
                    }


                    // -----------------------------------------
                    // REPRODUCIR
                    // -----------------------------------------

                    audioRadio.play()

                        .then(function () {


                            // Comprobar nuevamente
                            // que no haya cambiado.

                            if (
                                numeroActual !==
                                numeroCargaAudio
                            ) {

                                audioRadio.pause();

                                return;
                            }


                            if (
                                radio.cancionActual !== id
                            ) {

                                audioRadio.pause();

                                audioActivo =
                                    false;

                                idAudioActual =
                                    null;

                                botonEscuchar.textContent =
                                    "🎧 Escuchar radio";

                                return;
                            }


                            audioActivo =
                                true;


                            idAudioActual =
                                id;


                            botonEscuchar.textContent =
                                "⏸️ Pausar radio";


                            console.log(
                                "▶️ Reproduciendo:",
                                cancion.titulo
                            );

                        })

                        .catch(function(error) {

                            console.error(
                                "Error al reproducir:",
                                error
                            );


                            audioActivo =
                                false;


                            idAudioActual =
                                null;


                            botonEscuchar.textContent =
                                "🎧 Escuchar radio";
                        });

                };


            audioRadio.addEventListener(
                "loadedmetadata",
                cuandoCargue
            );
        }


        // =====================================================
        // CAMBIO AUTOMÁTICO A LA SIGUIENTE MARCHA
        // =====================================================

        function cambiarAutomaticamenteDeMarcha() {

            console.log(
                "🔄 Cambiando automáticamente de marcha..."
            );


            audioActivo =
                false;


            idAudioActual =
                null;


            botonEscuchar.textContent =
                "⏳ Cargando radio...";


            /*
             * IMPORTANTE:
             *
             * Firebase ya debe haber cambiado
             * radio.cancionActual y radio.inicioEmision.
             *
             * Por eso esperamos un instante muy pequeño
             * para asegurarnos de que los datos nuevos
             * estén disponibles.
             */

            setTimeout(function() {

                const estado =
                    String(
                        radio.estado || ""
                    ).trim();


                if (
                    estado !== "playing" &&
                    estado !== "En emisión"
                ) {

                    return;
                }


                const id =
                    radio.cancionActual;


                if (!id) {

                    return;
                }


                console.log(
                    "▶️ Iniciando nueva marcha:",
                    id
                );


                reproducirSincronizado(true);

            }, 100);

        }


        // =====================================================
        // ESCUCHAR CAMBIOS DE RADIO
        // =====================================================

        onValue(

            radioRef,

            function(snapshot) {


                const radioAnterior =
                    radio;


                const audioEstabaActivo =
                    audioActivo;


                const idAnterior =
                    radioAnterior.cancionActual;


                radio =
                    snapshot.val() || {};


                radioCargado =
                    true;


                console.log(
                    "Datos de radio:",
                    radio
                );


                actualizarPantalla();


                const marchaCambio =
                    idAnterior !==
                    radio.cancionActual;


                const estado =
                    String(
                        radio.estado || ""
                    ).trim();


                // =============================================
                // RADIO DETENIDA
                // =============================================

                if (
                    estado === "stopped"
                ) {

                    detenerAudioCompleto();

                    return;
                }


                // =============================================
                // OTRO ESTADO
                // =============================================

                if (
                    estado !== "playing" &&
                    estado !== "En emisión"
                ) {

                    detenerAudioCompleto();

                    return;
                }


                // =============================================
                // CAMBIÓ LA MARCHA
                // =============================================

                if (
                    marchaCambio
                ) {

                    console.log(
                        "🔄 Cambio detectado:",
                        idAnterior,
                        "→",
                        radio.cancionActual
                    );


                    /*
                     * Si el usuario estaba escuchando,
                     * reproducimos automáticamente
                     * la nueva marcha.
                     */

                    if (
                        audioEstabaActivo ||
                        idAudioActual === idAnterior
                    ) {

                        cambiarAutomaticamenteDeMarcha();
                    }

                }

            }

        );


        // =====================================================
        // ESCUCHAR CAMBIOS DE CANCIONES
        // =====================================================

        onValue(

            cancionesRef,

            function(snapshot) {

                canciones =
                    snapshot.val() || {};

                cancionesCargadas =
                    true;

                actualizarPantalla();

            }

        );


        // =====================================================
        // BOTÓN ESCUCHAR RADIO
        // =====================================================

        botonEscuchar.addEventListener(

            "click",

            function() {


                // =============================================
                // PAUSAR
                // =============================================

                if (audioActivo) {

                    audioRadio.pause();

                    audioActivo =
                        false;

                    botonEscuchar.textContent =
                        "🎧 Escuchar radio";

                    return;
                }


                // =============================================
                // REPRODUCIR
                // =============================================

                reproducirSincronizado(false);

            }

        );


        // =====================================================
        // AUDIO TERMINADO
        // =====================================================

        audioRadio.addEventListener(

            "ended",

            function() {

                console.log(
                    "⏹️ Terminó el audio."
                );


                audioActivo =
                    false;


                idAudioActual =
                    null;


                botonEscuchar.textContent =
                    "🎧 Escuchar radio";


                /*
                 * IMPORTANTE:
                 *
                 * NO avanzamos la canción desde aquí.
                 *
                 * El administrador de Radio Marchas
                 * es quien cambia radio.cancionActual.
                 *
                 * Cuando Firebase detecte ese cambio,
                 * el código de arriba iniciará
                 * automáticamente la nueva marcha.
                 */

            }

        );


        // =====================================================
        // ERROR DE AUDIO
        // =====================================================

        audioRadio.addEventListener(

            "error",

            function() {

                console.error(
                    "Error del elemento de audio:",
                    audioRadio.error
                );


                cargandoAudio =
                    false;


                audioActivo =
                    false;


                idAudioActual =
                    null;


                botonEscuchar.disabled =
                    false;


                botonEscuchar.textContent =
                    "🎧 Escuchar radio";

            }

        );

    </script>

</body>

</html>
