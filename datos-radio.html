</head>


<body>

            </button>

        </div>

    </div>


    <script type="module">


        // =========================
        // FIREBASE
        // =========================

        import {
            initializeApp
        }
        from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


        import {
            getDatabase,
            ref,
            onValue
        }
        from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


        // =========================
        // CONFIGURACIÓN
        // =========================

        const firebaseConfig = {

            apiKey:
                "AIzaSyBCKrD4b9-LyokCtvxm1j18_J35O6w9AQ",

            authDomain:
                "radio-marchas.firebaseapp.com",

            databaseURL:
                "https://radio-marchas-default-rtdb.firebaseio.com",

            projectId:
                "radio-marchas",

            storageBucket:
                "radio-marchas.firebasestorage.app",

            messagingSenderId:
                "190263587385",

            appId:
                "1:190263587385:web:1c6a77e370c0103da913e8"

        };


        const app =
            initializeApp(firebaseConfig);


        const db =
            getDatabase(app);


        // =========================
        // REFERENCIAS
        // =========================

        const radioRef =
            ref(db, "radio");


        const cancionesRef =
            ref(db, "canciones");


        // =========================
        // ELEMENTOS
        // =========================

        const radioInfo =
            document.getElementById("radioInfo");


        const titulo =
            document.getElementById("titulo");


        const compositor =
            document.getElementById("compositor");


        const interpreta =
            document.getElementById("interpreta");


        const cargando =
            document.getElementById("cargando");


        const enEmision =
            document.getElementById("enEmision");


        const botonEscuchar =
            document.getElementById("escucharRadio");


        // =========================
        // AUDIO
        // =========================

        const audioRadio =
            new Audio();


        let audioActivo = false;

        let idAudioActual = null;

        let cargandoAudio = false;


        // =========================
        // DATOS
        // =========================

        let radio = {};

        let canciones = {};

        let radioCargado = false;

        let cancionesCargadas = false;


        // =========================
        // ACTUALIZAR PANTALLA
        // =========================

        function actualizarPantalla() {

            // =========================
            // ESPERAR FIREBASE
            // =========================

            if (
                !radioCargado ||
                !cancionesCargadas
            ) {

                radioInfo.style.display =
                    "flex";

                cargando.style.display =
                    "block";

                return;
            }


            // =========================
            // ESTADO
            // =========================

            const estado =
                String(
                    radio.estado || ""
                ).trim();


            console.log(
                "Estado recibido:",
                estado
            );


            // =========================
            // SOLO MOSTRAR EN EMISIÓN
            // =========================

            if (
                estado !== "playing" &&
                estado !== "En emisión"
            ) {

                radioInfo.style.display =
                    "none";

                return;
            }


            // =========================
            // MOSTRAR
            // =========================

            radioInfo.style.display =
                "flex";


            enEmision.style.display =
                "block";


            // =========================
            // CANCIÓN ACTUAL
            // =========================

            const id =
                radio.cancionActual;


            if (!id) {

                cargando.style.display =
                    "block";

                return;
            }


            const cancion =
                canciones[id];


            if (!cancion) {

                cargando.style.display =
                    "block";

                return;
            }


            // =========================
            // TITULO
            // =========================

            titulo.textContent =
                cancion.titulo || "";


            // =========================
            // COMPOSITOR
            // =========================

            compositor.textContent =
                cancion.compositor
                    ? "Compositor: " +
                      cancion.compositor
                    : "";


            // =========================
            // INTERPRETA
            // =========================

            interpreta.textContent =
                cancion.interpreta
                    ? "Interpreta: " +
                      cancion.interpreta
                    : "";


            // =========================
            // IMAGEN
            // =========================

            if (cancion.imagen) {

                radioInfo.style.backgroundImage =
                    `url("${cancion.imagen}")`;

            } else {

                radioInfo.style.backgroundImage =
                    "none";
            }


            // =========================
            // POSICIÓN X
            // =========================

            const x =
                cancion.posicionX !== undefined
                    ? Number(cancion.posicionX)
                    : 50;


            // =========================
            // POSICIÓN Y
            // =========================

            const y =
                cancion.posicionY !== undefined
                    ? Number(cancion.posicionY)
                    : 50;


            // =========================
            // POSICIÓN DE IMAGEN
            // =========================

            radioInfo.style.backgroundPosition =
                `${x}% ${y}%`;


            // =========================
            // TERMINÓ CARGA
            // =========================

            cargando.style.display =
                "none";
        }


        // =========================
        // REPRODUCIR SINCRONIZADO
        // =========================

        function reproducirSincronizado() {

            const id =
                radio.cancionActual;


            if (!id) {
                return;
            }


            const cancion =
                canciones[id];


            if (!cancion) {
                return;
            }


            if (!cancion.audio) {
                return;
            }


            const inicio =
                Number(
                    radio.inicioEmision
                );


            // =========================
            // COMPROBAR INICIO
            // =========================

            if (
                !Number.isFinite(inicio) ||
                inicio <= 0
            ) {

                console.log(
                    "La emisión no tiene un inicioEmision válido."
                );

                return;
            }


            // =========================
            // EVITAR CARGAS DUPLICADAS
            // =========================

            if (cargandoAudio) {
                return;
            }


            cargandoAudio =
                true;


            idAudioActual =
                id;


            // =========================
            // EVENTO DE METADATA
            // =========================

            const cuandoCargue =
                function () {

                    audioRadio.removeEventListener(
                        "loadedmetadata",
                        cuandoCargue
                    );


                    cargandoAudio =
                        false;


                    // =========================
                    // COMPROBAR QUE SIGUE
                    // SIENDO LA MISMA MARCHA
                    // =========================

                    if (
                        radio.cancionActual !== id
                    ) {

                        console.log(
                            "La marcha cambió mientras se cargaba el audio."
                        );

                        return;
                    }


                    // =========================
                    // CALCULAR TIEMPO
                    // =========================

                    const ahora =
                        Date.now();


                    const tiempoTranscurrido =
                        (
                            ahora -
                            inicio
                        ) / 1000;


                    console.log(
                        "=============================="
                    );


                    console.log(
                        "🎵 Marcha:",
                        cancion.titulo
                    );


                    console.log(
                        "⏱️ inicioEmision:",
                        inicio
                    );


                    console.log(
                        "🕐 Ahora:",
                        ahora
                    );


                    console.log(
                        "▶️ Segundos transcurridos:",
                        tiempoTranscurrido
                    );


                    console.log(
                        "⏳ Duración:",
                        audioRadio.duration
                    );


                    // =========================
                    // COMPROBAR TIEMPO
                    // =========================

                    if (
                        !Number.isFinite(
                            tiempoTranscurrido
                        )
                    ) {

                        console.error(
                            "El tiempo de sincronización no es válido."
                        );

                        botonEscuchar.textContent =
                            "🎧 Escuchar radio";

                        return;
                    }


                    // =========================
                    // SI LA MARCHA YA TERMINÓ
                    // =========================

                    if (
                        tiempoTranscurrido >=
                        audioRadio.duration
                    ) {

                        console.log(
                            "La marcha ya terminó."
                        );

                        botonEscuchar.textContent =
                            "🎧 Escuchar radio";

                        return;
                    }


                    if (
                        tiempoTranscurrido < 0
                    ) {

                        console.log(
                            "El tiempo calculado es negativo."
                        );

                        botonEscuchar.textContent =
                            "🎧 Escuchar radio";

                        return;
                    }


                    // =========================
                    // COLOCAR AUDIO EN EL PUNTO
                    // EXACTO
                    // =========================

                    console.log(
                        "⏩ Saltando al segundo:",
                        tiempoTranscurrido
                    );


                    try {

                        audioRadio.currentTime =
                            tiempoTranscurrido;

                    } catch (error) {

                        console.error(
                            "Error al cambiar currentTime:",
                            error
                        );

                        botonEscuchar.textContent =
                            "🎧 Escuchar radio";

                        return;
                    }


                    console.log(
                        "📍 currentTime:",
                        audioRadio.currentTime
                    );


                    // =========================
                    // REPRODUCIR
                    // =========================

                    audioRadio.play()
                        .then(function () {

                            // =========================
                            // COMPROBAR OTRA VEZ
                            // =========================

                            if (
                                radio.cancionActual !== id
                            ) {

                                audioRadio.pause();

                                return;
                            }


                            audioActivo =
                                true;


                            idAudioActual =
                                id;


                            botonEscuchar.textContent =
                                "⏸️ Pausar radio";


                            console.log(
                                "✅ Radio sincronizada."
                            );


                            console.log(
                                "🎧 Reproduciendo desde:",
                                audioRadio.currentTime
                            );

                        })
                        .catch(function(error) {

                            console.error(
                                "❌ No se pudo reproducir:",
                                error
                            );


                            audioActivo =
                                false;


                            botonEscuchar.textContent =
                                "🎧 Escuchar radio";

                        });

                };


            // =========================
            // IMPORTANTE:
            // EL LISTENER SE PONE
            // ANTES DE CARGAR EL AUDIO
            // =========================

            audioRadio.addEventListener(
                "loadedmetadata",
                cuandoCargue
            );


            // =========================
            // CARGAR AUDIO
            // =========================

            audioRadio.src =
                cancion.audio;


            audioRadio.load();

        }


        // =========================
        // RADIO
        // =========================

        onValue(
            radioRef,
            function(snapshot) {

                const radioAnterior =
                    radio;


                radio =
                    snapshot.val() || {};


                radioCargado =
                    true;


                actualizarPantalla();


                // =========================
                // DETECTAR CAMBIO DE MARCHA
                // =========================

                const marchaCambio =
                    radioAnterior.cancionActual !==
                    radio.cancionActual;


                // =========================
                // ESTADO
                // =========================

                const estado =
                    String(
                        radio.estado || ""
                    ).trim();


                // =========================
                // SI TERMINÓ LA EMISIÓN
                // =========================

                if (
                    estado !== "playing" &&
                    estado !== "En emisión"
                ) {

                    if (audioActivo) {

                        audioRadio.pause();


                        audioActivo =
                            false;


                        idAudioActual =
                            null;


                        botonEscuchar.textContent =
                            "🎧 Escuchar radio";
                    }


                    return;
                }


                // =========================
                // SI ESTÁ ESCUCHANDO
                // Y CAMBIÓ LA MARCHA
                // =========================

                if (
                    audioActivo &&
                    marchaCambio
                ) {

                    console.log(
                        "🔄 Cambió la marcha. Sincronizando..."
                    );


                    audioRadio.pause();


                    audioActivo =
                        false;


                    idAudioActual =
                        null;


                    botonEscuchar.textContent =
                        "🎧 Escuchar radio";


                    reproducirSincronizado();
                }

            }
        );


        // =========================
        // CANCIONES
        // =========================

        onValue(
            cancionesRef,
            function(snapshot) {

                canciones =
                    snapshot.val() || {};


                cancionesCargadas =
                    true;


                actualizarPantalla();

            }
        );


        // =========================
        // BOTÓN ESCUCHAR RADIO
        // =========================

        botonEscuchar.addEventListener(
            "click",
            function() {

                const id =
                    radio.cancionActual;


                // =========================
                // COMPROBAR MARCHA
                // =========================

                if (!id) {

                    alert(
                        "No hay ninguna marcha en emisión."
                    );

                    return;
                }


                const cancion =
                    canciones[id];


                // =========================
                // COMPROBAR CANCIÓN
                // =========================

                if (!cancion) {

                    alert(
                        "No se encontró la marcha."
                    );

                    return;
                }


                // =========================
                // COMPROBAR AUDIO
                // =========================

                if (!cancion.audio) {

                    alert(
                        "Esta marcha no tiene audio."
                    );

                    return;
                }


                // =========================
                // PAUSAR
                // =========================

                if (audioActivo) {

                    audioRadio.pause();


                    audioActivo =
                        false;


                    botonEscuchar.textContent =
                        "🎧 Escuchar radio";


                    return;
                }


                // =========================
                // REPRODUCIR SINCRONIZADO
                // =========================

                reproducirSincronizado();

            }
        );


        // =========================
        // CUANDO TERMINA EL AUDIO
        // =========================

        audioRadio.addEventListener(
            "ended",
            function() {

                audioActivo =
                    false;


                idAudioActual =
                    null;


                botonEscuchar.textContent =
                    "🎧 Escuchar radio";

            }
        );


    </script>


</body>
