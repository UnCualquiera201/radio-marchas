<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Datos Radio Marchas</title>

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #radioInfo {

            position: relative;

            width: 100%;

            aspect-ratio: 1908 / 412;

            min-height: 250px;

            overflow: hidden;

            background-size: cover;

            background-position: center center;

            background-repeat: no-repeat;

            display: flex;

            align-items: flex-end;

            box-sizing: border-box;

        }


        /* OSCURECER UN POCO LA IMAGEN */

        #filtro {

            position: absolute;

            inset: 0;

            background: rgba(0, 0, 0, 0.25);

            z-index: 1;

        }


        /* TEXTO */

        #texto {
            
            position: relative;

            z-index: 2;

            width: 100%;

            box-sizing: border-box;

            padding: 30px;

            color: white;

            text-shadow:
                2px 2px 5px black,
                -1px -1px 3px black;

        }


        #titulo {

            margin: 0 0 8px 0;

            font-size: clamp(24px, 3vw, 48px);

            font-weight: bold;

        }


        #compositor,
        #interpreta {

            margin: 4px 0;

            font-size: clamp(15px, 1.5vw, 24px);

            font-weight: 500;

        }


        #cargando {

            position: absolute;

            z-index: 3;

            top: 50%;

            left: 50%;

            transform: translate(-50%, -50%);

            color: white;

            font-size: 20px;

            text-shadow: 2px 2px 4px black;

        }

    </style>

</head>


<body>


    <div id="radioInfo">

        <div id="filtro"></div>


        <div id="cargando">
            Cargando...
        </div>


        <div id="texto">

            
            <div id="enEmision">
            🔴 EN EMISIÓN
            </div>

            <h1 id="titulo">
                Radio Marchas
            </h1>


            <p id="compositor"></p>


            <p id="interpreta"></p>

        </div>

    </div>


    <script type="module">


        // =========================
        // FIREBASE
        // =========================

        import {
            initializeApp
        }
        from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


        import {
            getDatabase,
            ref,
            onValue
        }
        from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


        const firebaseConfig = {

            apiKey:
                "AIzaSyBCKrD4b9-LyokfCtvxm1j18_J35O6w9AQ",

            authDomain:
                "radio-marchas.firebaseapp.com",

            databaseURL:
                "https://radio-marchas-default-rtdb.firebaseio.com",

            projectId:
                "radio-marchas",

            storageBucket:
                "radio-marchas.firebasestorage.app",

            messagingSenderId:
                "190263587385",

            appId:
                "1:190263587385:web:1c6a77e370c0103da913e8"

        };


        const app =
            initializeApp(firebaseConfig);


        const db =
            getDatabase(app);


        // =========================
        // REFERENCIAS
        // =========================

        const radioRef =
            ref(db, "radio");


        const cancionesRef =
            ref(db, "canciones");


        const radioInfo =
            document.getElementById(
                "radioInfo"
            );


        const titulo =
            document.getElementById(
                "titulo"
            );


        const compositor =
            document.getElementById(
                "compositor"
            );


        const interpreta =
            document.getElementById(
                "interpreta"
            );


        const cargando =
            document.getElementById(
                "cargando"
            );


        // =========================
        // DATOS
        // =========================

        let radio = {};

        let canciones = {};


        // =========================
        // ACTUALIZAR PANTALLA
        // =========================

        function actualizarPantalla() {


            const id =
                radio.cancionActual;


            if (!id) {

                cargando.style.display =
                    "block";

                return;

            }


            const cancion =
                canciones[id];


            if (!cancion) {

                return;

            }


            // =========================
            // TITULO
            // =========================

            titulo.textContent =
                cancion.titulo || "";


            // =========================
            // COMPOSITOR
            // =========================

            if (cancion.compositor) {

                compositor.textContent =
                    "Compositor: " +
                    cancion.compositor;

            } else {

                compositor.textContent =
                    "";

            }


            // =========================
            // INTERPRETA
            // =========================

            if (cancion.interpreta) {

                interpreta.textContent =
                    "Interpreta: " +
                    cancion.interpreta;

            } else {

                interpreta.textContent =
                    "";

            }


            // =========================
            // IMAGEN
            // =========================

            if (cancion.imagen) {

                radioInfo.style.backgroundImage =
                    `url("${cancion.imagen}")`;

            } else {

                radioInfo.style.backgroundImage =
                    "none";

            }


            // =========================
            // POSICION X
            // =========================

            const x =
                cancion.posicionX !== undefined
                    ? Number(cancion.posicionX)
                    : 50;


            // =========================
            // POSICION Y
            // =========================

            const y =
                cancion.posicionY !== undefined
                    ? Number(cancion.posicionY)
                    : 50;


            // =========================
            // MISMA POSICION QUE INDEX
            // =========================

            radioInfo.style.backgroundPosition =
                `${x}% ${y}%`;


            // =========================
            // OCULTAR CARGANDO
            // =========================

            cargando.style.display =
                "none";

        }


        // =========================
        // ESCUCHAR RADIO
        // =========================

        onValue(
            radioRef,
            function(snapshot) {

                radio =
                    snapshot.val() || {};

                actualizarPantalla();

            }
        );


        // =========================
        // ESCUCHAR CANCIONES
        // =========================

        onValue(
            cancionesRef,
            function(snapshot) {

                canciones =
                    snapshot.val() || {};

                actualizarPantalla();

            }
        );


    </script>


</body>

</html>
