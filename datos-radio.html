```html

</head>



<body>



    <div id="radioInfo">

        <div id="filtro"></div>

        <div id="cargando">
            Cargando...
        </div>

        <div id="texto">

            <div id="enEmision">
                🔴 EN EMISIÓN
            </div>

            <h1 id="titulo">
                Radio Marchas
            </h1>

            <p id="compositor"></p>

            <p id="interpreta"></p>

            <button id="escucharRadio">
                🎧 Escuchar radio
            </button>

        </div>

    </div>





    <script type="module">



        // =====================================================
        // FIREBASE
        // =====================================================



        import {

            initializeApp

        }

        from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";



        import {

            getDatabase,
            ref,
            onValue

        }

        from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";





        // =====================================================
        // CONFIGURACIÓN
        // =====================================================



        const firebaseConfig = {

            apiKey:
                "AIzaSyBCKrD4b9-LyokCtvxmj1r8_J35O6w9AQ",

            authDomain:
                "radio-marchas.firebaseapp.com",

            databaseURL:
                "https://radio-marchas-default-rtdb.firebaseio.com",

            projectId:
                "radio-marchas",

            storageBucket:
                "radio-marchas.firebasestorage.app",

            messagingSenderId:
                "190263587385",

            appId:
                "1:190263587385:web:1c6a77e370c0103da913e8"

        };



        const app =
            initializeApp(firebaseConfig);



        const db =
            getDatabase(app);





        // =====================================================
        // REFERENCIAS
        // =====================================================



        const radioRef =
            ref(db, "radio");



        const cancionesRef =
            ref(db, "canciones");





        // =====================================================
        // ELEMENTOS
        // =====================================================



        const radioInfo =
            document.getElementById("radioInfo");



        const titulo =
            document.getElementById("titulo");



        const compositor =
            document.getElementById("compositor");



        const interpreta =
            document.getElementById("interpreta");



        const cargando =
            document.getElementById("cargando");



        const enEmision =
            document.getElementById("enEmision");



        const botonEscuchar =
            document.getElementById("escucharRadio");





        // =====================================================
        // AUDIO
        // =====================================================



        const audioRadio =
            new Audio();



        audioRadio.preload =
            "auto";



        let audioActivo =
            false;



        let usuarioEscuchando =
            false;



        let idAudioActual =
            null;



        let numeroOperacionAudio =
            0;



        let transicionEnCurso =
            false;





        // =====================================================
        // DATOS
        // =====================================================



        let radio =
            {};



        let canciones =
            {};



        let radioCargado =
            false;



        let cancionesCargadas =
            false;





        // =====================================================
        // PRECARGA DE IMÁGENES
        // =====================================================
        //
        // Las imágenes se descargan en paralelo apenas
        // Firebase entrega las canciones.
        //
        // Esto NO bloquea el audio ni la interfaz.
        // =====================================================



        const imagenesPrecargadas =
            new Map();



        const imagenesCargando =
            new Map();



        const imagenesFallidas =
            new Map();



        function precargarImagen(
            url,
            intento = 1
        ) {

            if (!url) {
                return;
            }



            if (
                imagenesPrecargadas.has(url)
            ) {

                return;

            }



            if (
                imagenesCargando.has(url)
            ) {

                return;

            }



            const img =
                new Image();



            imagenesCargando.set(
                url,
                img
            );



            img.onload =
                function() {

                    imagenesCargando.delete(
                        url
                    );



                    imagenesFallidas.delete(
                        url
                    );



                    imagenesPrecargadas.set(
                        url,
                        img
                    );



                    console.log(
                        "🖼️ IMAGEN LISTA:",
                        url
                    );



                    /*
                     * Si esta es justamente la imagen
                     * que se está mostrando, la colocamos
                     * inmediatamente.
                     */

                    const id =
                        radio.cancionActual;



                    const cancion =
                        canciones[id];



                    if (
                        cancion &&
                        cancion.imagen === url
                    ) {

                        mostrarImagen(
                            cancion
                        );

                    }

                };



            img.onerror =
                function() {

                    imagenesCargando.delete(
                        url
                    );



                    const ultimoIntento =
                        imagenesFallidas.get(
                            url
                        ) || 0;



                    if (
                        intento < 4
                    ) {

                        imagenesFallidas.set(
                            url,
                            intento
                        );



                        console.warn(
                            "⚠️ REINTENTANDO IMAGEN:",
                            intento,
                            url
                        );



                        setTimeout(
                            function() {

                                precargarImagen(
                                    url,
                                    intento + 1
                                );

                            },
                            2000
                        );

                    } else {

                        console.error(
                            "❌ NO SE PUDO CARGAR LA IMAGEN:",
                            url
                        );

                    }

                };



            /*
             * Empieza la descarga inmediatamente.
             */

            img.src =
                url;

        }





        function precargarTodasLasImagenes() {

            const lista =
                Object.values(canciones);



            console.log(
                "🖼️ PRECARGANDO IMÁGENES:",
                lista.length
            );



            /*
             * Todas empiezan al mismo tiempo.
             */

            lista.forEach(
                function(cancion) {

                    if (
                        cancion &&
                        cancion.imagen
                    ) {

                        precargarImagen(
                            cancion.imagen
                        );

                    }

                }
            );

        }





        function mostrarImagen(
            cancion
        ) {

            if (
                !cancion ||
                !cancion.imagen
            ) {

                radioInfo.style.backgroundImage =
                    "none";

                return;

            }



            /*
             * Si la imagen ya está precargada,
             * el navegador puede mostrarla inmediatamente.
             */

            radioInfo.style.backgroundImage =
                `url("${cancion.imagen}")`;



            const x =
                cancion.posicionX !== undefined
                    ? Number(cancion.posicionX)
                    : 50;



            const y =
                cancion.posicionY !== undefined
                    ? Number(cancion.posicionY)
                    : 50;



            radioInfo.style.backgroundPosition =
                `${x}% ${y}%`;

        }





        // =====================================================
        // LIMPIAR PANTALLA
        // =====================================================



        function limpiarPantalla() {

            radioInfo.style.backgroundImage =
                "none";



            titulo.textContent =
                "";



            compositor.textContent =
                "";



            interpreta.textContent =
                "";



            enEmision.style.display =
                "none";



            botonEscuchar.style.display =
                "none";



            botonEscuchar.textContent =
                "🎧 Escuchar radio";



            botonEscuchar.disabled =
                false;



            cargando.style.display =
                "none";

        }





        // =====================================================
        // DETENER AUDIO COMPLETAMENTE
        // =====================================================



        function detenerAudioCompleto() {

            numeroOperacionAudio++;



            transicionEnCurso =
                false;



            audioRadio.pause();



            audioRadio.removeAttribute("src");



            audioRadio.load();



            audioActivo =
                false;



            idAudioActual =
                null;



            usuarioEscuchando =
                false;



            botonEscuchar.disabled =
                false;



            botonEscuchar.textContent =
                "🎧 Escuchar radio";

        }





        // =====================================================
        // ACTUALIZAR PANTALLA
        // =====================================================



        function actualizarPantalla() {



            if (

                !radioCargado ||

                !cancionesCargadas

            ) {

                radioInfo.style.display =
                    "flex";

                cargando.style.display =
                    "block";

                return;

            }



            const estado =
                String(
                    radio.estado || ""
                ).trim();



            if (
                estado === "stopped"
            ) {

                detenerAudioCompleto();

                limpiarPantalla();

                radioInfo.style.display =
                    "none";

                return;

            }



            if (

                estado !== "playing" &&

                estado !== "En emisión"

            ) {

                detenerAudioCompleto();

                limpiarPantalla();

                radioInfo.style.display =
                    "none";

                return;

            }



            radioInfo.style.display =
                "flex";



            enEmision.style.display =
                "block";



            botonEscuchar.style.display =
                "inline-block";



            const id =
                radio.cancionActual;



            if (!id) {

                titulo.textContent =
                    "";

                compositor.textContent =
                    "";

                interpreta.textContent =
                    "";

                radioInfo.style.backgroundImage =
                    "none";

                cargando.style.display =
                    "none";

                return;

            }



            const cancion =
                canciones[id];



            if (!cancion) {

                titulo.textContent =
                    "";

                compositor.textContent =
                    "";

                interpreta.textContent =
                    "";

                radioInfo.style.backgroundImage =
                    "none";

                cargando.style.display =
                    "none";

                return;

            }



            titulo.textContent =
                cancion.titulo || "";



            compositor.textContent =
                cancion.compositor
                    ? "Compositor: " +
                      cancion.compositor
                    : "";



            interpreta.textContent =
                cancion.interpreta
                    ? "Interpreta: " +
                      cancion.interpreta
                    : "";



            /*
             * Mostramos la imagen.
             * Si ya fue precargada, aparecerá rápidamente.
             */

            mostrarImagen(
                cancion
            );



            cargando.style.display =
                "none";

        }





        // =====================================================
        // ESPERAR A QUE EL AUDIO ESTÉ LISTO
        // =====================================================



        function esperarAudioListo(
            operacion
        ) {

            return new Promise(
                function(resolve, reject) {

                    if (
                        audioRadio.readyState >= 3
                    ) {

                        resolve();

                        return;

                    }



                    let terminado =
                        false;



                    function limpiar() {

                        audioRadio.removeEventListener(
                            "canplay",
                            listo
                        );

                        audioRadio.removeEventListener(
                            "error",
                            error
                        );

                    }



                    function listo() {

                        if (terminado) {
                            return;
                        }



                        terminado =
                            true;



                        limpiar();



                        resolve();

                    }



                    function error() {

                        if (terminado) {
                            return;
                        }



                        terminado =
                            true;



                        limpiar();



                        reject(
                            new Error(
                                "No se pudo cargar el audio."
                            )
                        );

                    }



                    audioRadio.addEventListener(
                        "canplay",
                        listo
                    );



                    audioRadio.addEventListener(
                        "error",
                        error
                    );



                    const comprobar =
                        setInterval(
                            function() {

                                if (terminado) {

                                    clearInterval(
                                        comprobar
                                    );

                                    return;

                                }



                                if (
                                    operacion !==
                                    numeroOperacionAudio
                                ) {

                                    clearInterval(
                                        comprobar
                                    );



                                    terminado =
                                        true;



                                    limpiar();



                                    reject(
                                        new Error(
                                            "Carga cancelada."
                                        )
                                    );

                                }

                            },
                            50
                        );

                }
            );

        }





        // =====================================================
        // REPRODUCIR AUDIO
        // =====================================================



        async function reproducirAudio(
            sincronizar
        ) {

            const operacion =
                ++numeroOperacionAudio;



            const id =
                radio.cancionActual;



            if (!id) {
                return;
            }



            const cancion =
                canciones[id];



            if (
                !cancion ||
                !cancion.audio
            ) {
                return;
            }



            transicionEnCurso =
                true;



            audioActivo =
                false;



            idAudioActual =
                id;



            botonEscuchar.disabled =
                true;



            botonEscuchar.textContent =
                "⏳ Cargando radio...";



            console.log(
                "🎵 CARGANDO:",
                cancion.titulo,
                "| automático:",
                !sincronizar
            );



            try {

                audioRadio.pause();



                await new Promise(
                    function(resolve) {

                        setTimeout(
                            resolve,
                            50
                        );

                    }
                );



                if (
                    operacion !==
                    numeroOperacionAudio
                ) {
                    return;
                }



                if (
                    radio.cancionActual !== id
                ) {
                    return;
                }



                audioRadio.src =
                    cancion.audio;



                audioRadio.load();



                await esperarAudioListo(
                    operacion
                );



                if (
                    operacion !==
                    numeroOperacionAudio
                ) {
                    return;
                }



                if (
                    radio.cancionActual !== id
                ) {
                    return;
                }



                let posicion =
                    0;



                if (sincronizar) {

                    const inicio =
                        Number(
                            radio.inicioEmision
                        );



                    if (

                        Number.isFinite(inicio) &&

                        inicio > 0

                    ) {

                        posicion =
                            (
                                Date.now() -
                                inicio
                            ) / 1000;

                    }

                }



                if (
                    posicion < 0
                ) {

                    posicion =
                        0;

                }



                if (
                    !Number.isFinite(
                        audioRadio.duration
                    )
                ) {

                    throw new Error(
                        "La duración del audio no es válida."
                    );

                }



                if (
                    posicion >=
                    audioRadio.duration
                ) {

                    throw new Error(
                        "La marcha ya terminó."
                    );

                }



                audioRadio.currentTime =
                    posicion;



                if (
                    operacion !==
                    numeroOperacionAudio
                ) {
                    return;
                }



                if (
                    radio.cancionActual !== id
                ) {
                    return;
                }



                await audioRadio.play();



                if (
                    operacion !==
                    numeroOperacionAudio
                ) {

                    audioRadio.pause();

                    return;

                }



                if (
                    radio.cancionActual !== id
                ) {

                    audioRadio.pause();

                    return;

                }



                audioActivo =
                    true;



                idAudioActual =
                    id;



                transicionEnCurso =
                    false;



                botonEscuchar.disabled =
                    false;



                botonEscuchar.textContent =
                    "⏸️ Pausar radio";



                console.log(
                    "🔊 REPRODUCIENDO:",
                    cancion.titulo
                );



                console.log(
                    "⏱️ COMIENZA DESDE:",
                    posicion
                );

            }

            catch (error) {

                if (
                    operacion !==
                    numeroOperacionAudio
                ) {
                    return;
                }



                if (
                    radio.cancionActual !== id
                ) {
                    return;
                }



                console.error(
                    "❌ ERROR DE REPRODUCCIÓN:",
                    error
                );



                audioActivo =
                    false;



                idAudioActual =
                    null;



                transicionEnCurso =
                    false;



                botonEscuchar.disabled =
                    false;



                botonEscuchar.textContent =
                    "🎧 Escuchar radio";

            }

        }





        // =====================================================
        // CAMBIOS DE RADIO EN FIREBASE
        // =====================================================



        onValue(

            radioRef,

            function(snapshot) {

                const radioAnterior =
                    radio;



                const idAnterior =
                    radioAnterior.cancionActual;



                const estabaEscuchando =
                    usuarioEscuchando;



                radio =
                    snapshot.val() || {};



                radioCargado =
                    true;



                const nuevoId =
                    radio.cancionActual;



                const marchaCambio =
                    idAnterior !== nuevoId;



                const estado =
                    String(
                        radio.estado || ""
                    ).trim();



                console.log(
                    "📡 RADIO:",
                    nuevoId,
                    "| estado:",
                    estado
                );



                actualizarPantalla();



                if (
                    estado === "stopped"
                ) {

                    detenerAudioCompleto();

                    return;

                }



                if (

                    estado !== "playing" &&

                    estado !== "En emisión"

                ) {

                    detenerAudioCompleto();

                    return;

                }



                if (

                    marchaCambio &&

                    nuevoId

                ) {

                    console.log(
                        "🔄 CAMBIO DE MARCHA:",
                        idAnterior,
                        "→",
                        nuevoId
                    );



                    if (
                        estabaEscuchando
                    ) {

                        console.log(
                            "▶️ NUEVA MARCHA AUTOMÁTICA:",
                            nuevoId
                        );



                        numeroOperacionAudio++;



                        audioRadio.pause();



                        audioActivo =
                            false;



                        idAudioActual =
                            null;



                        botonEscuchar.disabled =
                            true;



                        botonEscuchar.textContent =
                            "⏳ Cargando radio...";



                        setTimeout(
                            function() {

                                if (
                                    radio.cancionActual !==
                                    nuevoId
                                ) {

                                    return;

                                }



                                const estadoActual =
                                    String(
                                        radio.estado || ""
                                    ).trim();



                                if (

                                    estadoActual !==
                                        "playing" &&

                                    estadoActual !==
                                        "En emisión"

                                ) {

                                    return;

                                }



                                reproducirAudio(
                                    false
                                );

                            },
                            100
                        );

                    }

                }

            }

        );





        // =====================================================
        // CAMBIOS EN CANCIONES
        // =====================================================



        onValue(

            cancionesRef,

            function(snapshot) {

                canciones =
                    snapshot.val() || {};



                cancionesCargadas =
                    true;



                /*
                 * IMPORTANTE:
                 *
                 * Empezamos a precargar todas las imágenes
                 * inmediatamente.
                 *
                 * No esperamos a que el usuario cambie
                 * de marcha.
                 */

                precargarTodasLasImagenes();



                actualizarPantalla();

            }

        );





        // =====================================================
        // BOTÓN ESCUCHAR
        // =====================================================



        botonEscuchar.addEventListener(

            "click",

            async function() {

                if (audioActivo) {

                    numeroOperacionAudio++;



                    audioRadio.pause();



                    audioActivo =
                        false;



                    usuarioEscuchando =
                        false;



                    botonEscuchar.textContent =
                        "🎧 Escuchar radio";



                    console.log(
                        "⏸️ RADIO PAUSADA"
                    );



                    return;

                }



                usuarioEscuchando =
                    true;



                console.log(
                    "🎧 USUARIO INICIÓ LA RADIO"
                );



                reproducirAudio(
                    true
                );

            }

        );





        // =====================================================
        // AUDIO TERMINADO
        // =====================================================



        audioRadio.addEventListener(

            "ended",

            function() {

                console.log(
                    "⏹️ TERMINÓ:",
                    idAudioActual
                );



                audioActivo =
                    false;



                idAudioActual =
                    null;



                if (
                    usuarioEscuchando
                ) {

                    botonEscuchar.textContent =
                        "⏳ Esperando siguiente marcha...";

                } else {

                    botonEscuchar.textContent =
                        "🎧 Escuchar radio";

                }

            }

        );





        // =====================================================
        // ERROR DEL AUDIO
        // =====================================================



        audioRadio.addEventListener(

            "error",

            function() {

                console.error(
                    "❌ ERROR DEL ELEMENTO AUDIO:",
                    audioRadio.error
                );



                audioActivo =
                    false;



                idAudioActual =
                    null;



                transicionEnCurso =
                    false;



                botonEscuchar.disabled =
                    false;



                botonEscuchar.textContent =
                    "🎧 Escuchar radio";

            }

        );



    </script>



</body>

</html>
