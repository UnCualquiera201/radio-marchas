```html
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Datos Radio Marchas</title>

    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;
        }


        #radioInfo {

            position: relative;

            width: 100%;

            aspect-ratio: 1908 / 412;

            min-height: 250px;

            overflow: hidden;

            background-size: cover;

            background-position: center center;

            background-repeat: no-repeat;

            display: flex;

            align-items: flex-end;

            box-sizing: border-box;
        }


        #filtro {

            position: absolute;

            inset: 0;

            background: rgba(0, 0, 0, 0.25);

            z-index: 1;
        }


        #texto {

            position: relative;

            z-index: 2;

            width: 100%;

            box-sizing: border-box;

            padding: 30px;

            color: white;

            text-shadow:
                2px 2px 5px black,
                -1px -1px 3px black;
        }


        #enEmision {

            font-size: 20px;

            font-weight: bold;

            margin-bottom: 10px;
        }


        #titulo {

            margin: 0 0 8px 0;

            font-size: clamp(24px, 3vw, 48px);

            font-weight: bold;
        }


        #compositor,
        #interpreta {

            margin: 4px 0;

            font-size: clamp(15px, 1.5vw, 24px);

            font-weight: 500;
        }


        #escucharRadio {

            margin-top: 15px;

            padding: 12px 20px;

            border: none;

            border-radius: 8px;

            background: white;

            color: black;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }


        #escucharRadio:hover {

            opacity: 0.9;
        }


        #escucharRadio:disabled {

            opacity: 0.6;

            cursor: not-allowed;
        }


        #cargando {

            position: absolute;

            z-index: 3;

            top: 50%;

            left: 50%;

            transform: translate(-50%, -50%);

            color: white;

            font-size: 20px;

            text-shadow:
                2px 2px 4px black;
        }

    </style>

</head>


<body>


    <div id="radioInfo">


        <div id="filtro"></div>


        <div id="cargando">
            Cargando...
        </div>


        <div id="texto">


            <div id="enEmision">
                🔴 EN EMISIÓN
            </div>


            <h1 id="titulo">
                Radio Marchas
            </h1>


            <p id="compositor"></p>


            <p id="interpreta"></p>


            <button id="escucharRadio">
                🎧 Escuchar radio
            </button>


        </div>

    </div>



    <script type="module">


        // =====================================================
        // FIREBASE
        // =====================================================


        import {

            initializeApp

        }

        from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


        import {

            getDatabase,
            ref,
            onValue

        }

        from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";



        // =====================================================
        // CONFIGURACIÓN
        // =====================================================


        const firebaseConfig = {


            apiKey:

                "AIzaSyBCKrD4b9-LyokCtvxmj1r8_J35O6w9AQ",


            authDomain:

                "radio-marchas.firebaseapp.com",


            databaseURL:

                "https://radio-marchas-default-rtdb.firebaseio.com",


            projectId:

                "radio-marchas",


            storageBucket:

                "radio-marchas.firebasestorage.app",


            messagingSenderId:

                "190263587385",


            appId:

                "1:190263587385:web:1c6a77e370c0103da913e8"

        };



        const app =

            initializeApp(firebaseConfig);


        const db =

            getDatabase(app);



        // =====================================================
        // REFERENCIAS
        // =====================================================


        const radioRef =

            ref(db, "radio");


        const cancionesRef =

            ref(db, "canciones");



        // =====================================================
        // ELEMENTOS
        // =====================================================


        const radioInfo =

            document.getElementById("radioInfo");


        const titulo =

            document.getElementById("titulo");


        const compositor =

            document.getElementById("compositor");


        const interpreta =

            document.getElementById("interpreta");


        const cargando =

            document.getElementById("cargando");


        const enEmision =

            document.getElementById("enEmision");


        const botonEscuchar =

            document.getElementById("escucharRadio");



        // =====================================================
        // AUDIO
        // =====================================================


        const audioRadio =

            new Audio();


        audioRadio.preload =

            "auto";


        let audioActivo =

            false;


        let idAudioActual =

            null;


        let cargandoAudio =

            false;


        // Sirve para cancelar cargas anteriores

        let numeroCargaAudio =

            0;



        // =====================================================
        // DATOS
        // =====================================================


        let radio =

            {};


        let canciones =

            {};


        let radioCargado =

            false;


        let cancionesCargadas =

            false;



        // =====================================================
        // LIMPIAR PANTALLA
        // =====================================================


        function limpiarPantalla() {


            radioInfo.style.backgroundImage =

                "none";


            titulo.textContent =

                "";


            compositor.textContent =

                "";


            interpreta.textContent =

                "";


            enEmision.style.display =

                "none";


            botonEscuchar.style.display =

                "none";


            botonEscuchar.textContent =

                "🎧 Escuchar radio";


            botonEscuchar.disabled =

                false;


            cargando.style.display =

                "none";

        }



        // =====================================================
        // DETENER AUDIO COMPLETAMENTE
        // =====================================================


        function detenerAudioCompleto() {


            numeroCargaAudio++;


            audioRadio.pause();


            audioRadio.removeAttribute("src");


            audioRadio.load();


            audioActivo =

                false;


            idAudioActual =

                null;


            cargandoAudio =

                false;


            botonEscuchar.disabled =

                false;


            botonEscuchar.textContent =

                "🎧 Escuchar radio";

        }



        // =====================================================
        // ACTUALIZAR PANTALLA
        // =====================================================


        function actualizarPantalla() {


            // -----------------------------------------------
            // CARGANDO FIREBASE
            // -----------------------------------------------


            if (

                !radioCargado ||

                !cancionesCargadas

            ) {


                radioInfo.style.display =

                    "flex";


                cargando.style.display =

                    "block";


                return;

            }



            // -----------------------------------------------
            // ESTADO
            // -----------------------------------------------


            const estado =

                String(

                    radio.estado || ""

                ).trim();



            console.log(

                "Estado recibido:",

                estado

            );



            // -----------------------------------------------
            // STOPPED
            // -----------------------------------------------


            if (

                estado === "stopped"

            ) {


                detenerAudioCompleto();


                limpiarPantalla();


                radioInfo.style.display =

                    "none";


                return;

            }



            // -----------------------------------------------
            // OTROS ESTADOS
            // -----------------------------------------------


            if (

                estado !== "playing" &&

                estado !== "En emisión"

            ) {


                detenerAudioCompleto();


                limpiarPantalla();


                radioInfo.style.display =

                    "none";


                return;

            }



            // -----------------------------------------------
            // EN EMISIÓN
            // -----------------------------------------------


            radioInfo.style.display =

                "flex";


            enEmision.style.display =

                "block";


            botonEscuchar.style.display =

                "inline-block";



            const id =

                radio.cancionActual;



            // -----------------------------------------------
            // SIN CANCIÓN
            // -----------------------------------------------


            if (!id) {


                titulo.textContent =

                    "";


                compositor.textContent =

                    "";


                interpreta.textContent =

                    "";


                radioInfo.style.backgroundImage =

                    "none";


                cargando.style.display =

                    "none";


                return;

            }



            // -----------------------------------------------
            // BUSCAR CANCIÓN
            // -----------------------------------------------


            const cancion =

                canciones[id];



            if (!cancion) {


                titulo.textContent =

                    "";


                compositor.textContent =

                    "";


                interpreta.textContent =

                    "";


                radioInfo.style.backgroundImage =

                    "none";


                cargando.style.display =

                    "none";


                return;

            }



            // -----------------------------------------------
            // TÍTULO
            // -----------------------------------------------


            titulo.textContent =

                cancion.titulo || "";



            // -----------------------------------------------
            // COMPOSITOR
            // -----------------------------------------------


            compositor.textContent =

                cancion.compositor

                    ? "Compositor: " +

                      cancion.compositor

                    : "";



            // -----------------------------------------------
            // INTÉRPRETE
            // -----------------------------------------------


            interpreta.textContent =

                cancion.interpreta

                    ? "Interpreta: " +

                      cancion.interpreta

                    : "";



            // -----------------------------------------------
            // IMAGEN
            // -----------------------------------------------


            if (cancion.imagen) {


                radioInfo.style.backgroundImage =

                    `url("${cancion.imagen}")`;


            } else {


                radioInfo.style.backgroundImage =

                    "none";

            }



            // -----------------------------------------------
            // POSICIÓN DE IMAGEN
            // -----------------------------------------------


            const x =

                cancion.posicionX !== undefined

                    ? Number(

                        cancion.posicionX

                    )

                    : 50;



            const y =

                cancion.posicionY !== undefined

                    ? Number(

                        cancion.posicionY

                    )

                    : 50;



            radioInfo.style.backgroundPosition =

                `${x}% ${y}%`;



            cargando.style.display =

                "none";

        }



        // =====================================================
        // REPRODUCIR AUDIO
        //
        // sincronizar = true
        //    Usa inicioEmision
        //
        // sincronizar = false
        //    Empieza desde 0:00
        // =====================================================


        function reproducirAudio(

            sincronizar

        ) {


            const id =

                radio.cancionActual;



            if (!id) {


                alert(

                    "No hay ninguna marcha en emisión."

                );


                return;

            }



            const cancion =

                canciones[id];



            if (!cancion) {


                alert(

                    "No se encontró la marcha."

                );


                return;

            }



            if (!cancion.audio) {


                alert(

                    "Esta marcha no tiene audio."

                );


                return;

            }



            // -----------------------------------------------
            // INVALIDAR CARGAS ANTERIORES
            // -----------------------------------------------


            const numeroActual =

                ++numeroCargaAudio;



            cargandoAudio =

                true;


            idAudioActual =

                id;


            botonEscuchar.disabled =

                true;


            botonEscuchar.textContent =

                "⏳ Cargando radio...";



            // -----------------------------------------------
            // PREPARAR AUDIO
            // -----------------------------------------------


            audioRadio.pause();


            audioRadio.src =

                cancion.audio;


            audioRadio.load();



            // -----------------------------------------------
            // CUANDO CARGUE EL AUDIO
            // -----------------------------------------------


            const cuandoCargue =

                function() {


                    audioRadio.removeEventListener(

                        "loadedmetadata",

                        cuandoCargue

                    );



                    // -----------------------------------------
                    // COMPROBAR QUE SIGUE SIENDO LA CARGA ACTUAL
                    // -----------------------------------------


                    if (

                        numeroActual !==

                        numeroCargaAudio

                    ) {


                        return;

                    }



                    cargandoAudio =

                        false;


                    botonEscuchar.disabled =

                        false;



                    // -----------------------------------------
                    // COMPROBAR CANCIÓN
                    // -----------------------------------------


                    if (

                        radio.cancionActual !== id

                    ) {


                        botonEscuchar.textContent =

                            "🎧 Escuchar radio";


                        return;

                    }



                    // -----------------------------------------
                    // DETERMINAR POSICIÓN
                    // -----------------------------------------


                    let posicion =

                        0;



                    /*
                     * SI ES REPRODUCCIÓN MANUAL:
                     *
                     * sincronizar = true
                     *
                     * Entonces usamos inicioEmision.
                     *
                     *
                     * SI ES CAMBIO AUTOMÁTICO:
                     *
                     * sincronizar = false
                     *
                     * Entonces empieza desde 0.
                     */


                    if (sincronizar) {


                        const inicio =

                            Number(

                                radio.inicioEmision

                            );



                        if (

                            Number.isFinite(inicio) &&

                            inicio > 0

                        ) {


                            posicion =

                                (

                                    Date.now() -

                                    inicio

                                ) / 1000;

                        }

                    }



                    console.log(

                        "🎵 Marcha:",

                        cancion.titulo

                    );


                    console.log(

                        "▶️ Posición inicial:",

                        posicion

                    );



                    // -----------------------------------------
                    // VALIDAR POSICIÓN
                    // -----------------------------------------


                    if (

                        posicion < 0

                    ) {


                        posicion =

                            0;

                    }



                    if (

                        posicion >=

                        audioRadio.duration

                    ) {


                        console.warn(

                            "La marcha ya terminó."

                        );


                        botonEscuchar.textContent =

                            "🎧 Escuchar radio";


                        return;

                    }



                    // -----------------------------------------
                    // PONER POSICIÓN
                    // -----------------------------------------


                    try {


                        audioRadio.currentTime =

                            posicion;


                    }

                    catch (error) {


                        console.error(

                            "Error al cambiar currentTime:",

                            error

                        );


                        botonEscuchar.textContent =

                            "🎧 Escuchar radio";


                        return;

                    }



                    // -----------------------------------------
                    // REPRODUCIR
                    // -----------------------------------------


                    audioRadio.play()

                        .then(function() {


                            // ---------------------------------
                            // COMPROBAR CARGA
                            // ---------------------------------


                            if (

                                numeroActual !==

                                numeroCargaAudio

                            ) {


                                audioRadio.pause();

                                return;

                            }



                            // ---------------------------------
                            // COMPROBAR CANCIÓN
                            // ---------------------------------


                            if (

                                radio.cancionActual !== id

                            ) {


                                audioRadio.pause();


                                audioActivo =

                                    false;


                                idAudioActual =

                                    null;


                                botonEscuchar.textContent =

                                    "🎧 Escuchar radio";


                                return;

                            }



                            audioActivo =

                                true;


                            idAudioActual =

                                id;


                            botonEscuchar.textContent =

                                "⏸️ Pausar radio";


                            console.log(

                                "▶️ Reproduciendo desde:",

                                posicion,

                                "segundos"

                            );

                        })


                        .catch(function(error) {


                            console.error(

                                "Error al reproducir:",

                                error

                            );


                            audioActivo =

                                false;


                            idAudioActual =

                                null;


                            botonEscuchar.disabled =

                                false;


                            botonEscuchar.textContent =

                                "🎧 Escuchar radio";

                        });

                };



            audioRadio.addEventListener(

                "loadedmetadata",

                cuandoCargue

            );

        }



        // =====================================================
        // CAMBIO DE MARCHA EN FIREBASE
        // =====================================================


        onValue(

            radioRef,

            function(snapshot) {


                const radioAnterior =

                    radio;



                const audioEstabaActivo =

                    audioActivo;



                const idAnterior =

                    radioAnterior.cancionActual;



                radio =

                    snapshot.val() || {};



                radioCargado =

                    true;



                console.log(

                    "Datos de radio:",

                    radio

                );



                actualizarPantalla();



                const marchaCambio =

                    idAnterior !==

                    radio.cancionActual;



                const estado =

                    String(

                        radio.estado || ""

                    ).trim();



                // -------------------------------------------
                // STOPPED
                // -------------------------------------------


                if (

                    estado === "stopped"

                ) {


                    detenerAudioCompleto();


                    return;

                }



                // -------------------------------------------
                // ESTADO NO ACTIVO
                // -------------------------------------------


                if (

                    estado !== "playing" &&

                    estado !== "En emisión"

                ) {


                    detenerAudioCompleto();


                    return;

                }



                // -------------------------------------------
                // CAMBIÓ LA MARCHA
                // -------------------------------------------


                if (

                    marchaCambio &&

                    radio.cancionActual

                ) {


                    console.log(

                        "🔄 CAMBIO DE MARCHA:",

                        idAnterior,

                        "→",

                        radio.cancionActual

                    );



                    /*
                     * IMPORTANTE:
                     *
                     * Si ya estaba escuchando,
                     * la nueva marcha comienza
                     * SIEMPRE desde 0:00.
                     */


                    if (

                        audioEstabaActivo

                    ) {


                        numeroCargaAudio++;


                        audioRadio.pause();


                        audioRadio.removeAttribute(

                            "src"

                        );


                        audioRadio.load();


                        audioActivo =

                            false;


                        idAudioActual =

                            null;


                        cargandoAudio =

                            false;



                        botonEscuchar.textContent =

                            "⏳ Cargando radio...";



                        /*
                         * Pequeño retraso para asegurar
                         * que el navegador terminó de
                         * descargar el audio anterior.
                         */


                        setTimeout(function() {


                            /*
                             * Comprobar que seguimos
                             * en la misma marcha.
                             */


                            if (

                                radio.cancionActual !==

                                radio.cancionActual

                            ) {

                                return;

                            }



                            const estadoActual =

                                String(

                                    radio.estado || ""

                                ).trim();



                            if (

                                estadoActual !==

                                    "playing" &&

                                estadoActual !==

                                    "En emisión"

                            ) {

                                return;

                            }



                            /*
                             * FALSE = NO sincronizar.
                             *
                             * Empieza desde 0:00.
                             */


                            reproducirAudio(false);


                        }, 100);

                    }

                }

            }

        );



        // =====================================================
        // CAMBIOS EN CANCIONES
        // =====================================================


        onValue(

            cancionesRef,

            function(snapshot) {


                canciones =

                    snapshot.val() || {};


                cancionesCargadas =

                    true;


                actualizarPantalla();

            }

        );



        // =====================================================
        // BOTÓN ESCUCHAR RADIO
        // =====================================================


        botonEscuchar.addEventListener(

            "click",

            function() {


                // -------------------------------------------
                // PAUSAR
                // -------------------------------------------


                if (audioActivo) {


                    audioRadio.pause();


                    audioActivo =

                        false;


                    botonEscuchar.textContent =

                        "🎧 Escuchar radio";


                    return;

                }



                // -------------------------------------------
                // REPRODUCIR MANUALMENTE
                //
                // TRUE = sincronizar con emisión
                // -------------------------------------------


                reproducirAudio(true);

            }

        );



        // =====================================================
        // AUDIO TERMINADO
        // =====================================================


        audioRadio.addEventListener(

            "ended",

            function() {


                console.log(

                    "⏹️ Terminó la marcha."

                );


                audioActivo =

                    false;


                idAudioActual =

                    null;


                botonEscuchar.textContent =

                    "🎧 Escuchar radio";



                /*
                 * NO cambiamos la canción aquí.
                 *
                 * El index.html controla cuál
                 * es la siguiente marcha.
                 */

            }

        );



        // =====================================================
        // ERROR DE AUDIO
        // =====================================================


        audioRadio.addEventListener(

            "error",

            function() {


                console.error(

                    "Error del elemento de audio:",

                    audioRadio.error

                );


                cargandoAudio =

                    false;


                audioActivo =

                    false;


                idAudioActual =

                    null;


                botonEscuchar.disabled =

                    false;


                botonEscuchar.textContent =

                    "🎧 Escuchar radio";

            }

        );


    </script>


</body>

</html>
