<body>

    </div>


    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

        import {
            getDatabase,
            ref,
            onValue
        } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


        // =====================================================
        // FIREBASE
        // =====================================================

        const firebaseConfig = {

                "radio-marchas.firebasestorage.app",

            appId:
                "1:190263587385:web:1c6a77e370c0103da913e8"
        };


        const app = initializeApp(firebaseConfig);

        const db = getDatabase(app);


        // =====================================================
        // REFERENCIAS
        // =====================================================

        const radioRef = ref(db, "radio");

        const cancionesRef = ref(db, "canciones");


        // =====================================================
        // ELEMENTOS
        // =====================================================

        const radioInfo =
            document.getElementById("radioInfo");

        const cargando =
            document.getElementById("cargando");

        const texto =
            document.getElementById("texto");

        const enEmision =
            document.getElementById("enEmision");

        const titulo =
            document.getElementById("titulo");

        const compositor =
            document.getElementById("compositor");

        const interpreta =
            document.getElementById("interpreta");

        const botonEscuchar =
            document.getElementById("escucharRadio");


        // =====================================================
        // AUDIO
        // =====================================================

        const audioRadio =
            new Audio();

        audioRadio.preload = "auto";

        let audioActivo = false;

        let idAudioActual = null;

        let cargandoAudio = false;


        // =====================================================
        // DATOS
        // =====================================================

        let radio = {};

        let canciones = {};

        let radioCargado = false;

        let cancionesCargadas = false;


        // =====================================================
        // ACTUALIZAR PANTALLA
        // =====================================================

        function actualizarPantalla() {

            // Todavía estamos esperando Firebase
            if (!radioCargado || !cancionesCargadas) {

                cargando.style.display = "block";

                texto.style.display = "none";

                return;
            }


            // Firebase ya cargó
            cargando.style.display = "none";

            texto.style.display = "block";


            const id = radio.cancionActual;


            // No hay canción actual
            if (!id || !canciones[id]) {

                titulo.textContent =
                    "Radio Marchas";

                compositor.textContent =
                    "";

                interpreta.textContent =
                    "";

                enEmision.textContent =
                    "🔴 EN ESPERA";

                return;
            }


            const cancion =
                canciones[id];


            // TÍTULO

            titulo.textContent =
                cancion.titulo || "Sin título";


            // COMPOSITOR

            compositor.textContent =
                cancion.compositor
                    ? "Compositor: " + cancion.compositor
                    : "";


            // INTÉRPRETE

            interpreta.textContent =
                cancion.interpreta
                    ? "Interpreta: " + cancion.interpreta
                    : "";


            // ESTADO

            if (
                radio.estado === "playing" ||
                radio.estado === "En emisión"
            ) {

                enEmision.textContent =
                    "🔴 EN EMISIÓN";

            } else {

                enEmision.textContent =
                    "⏸️ EN PAUSA";
            }


            // IMAGEN

            if (cancion.imagen) {

                radioInfo.style.backgroundImage =
                    `url("${cancion.imagen}")`;
            }


            // POSICIÓN X

            if (cancion.posicionX !== undefined) {

                radioInfo.style.backgroundPositionX =
                    cancion.posicionX + "%";
            }


            // POSICIÓN Y

            if (cancion.posicionY !== undefined) {

                radioInfo.style.backgroundPositionY =
                    cancion.posicionY + "%";
            }
        }


        // =====================================================
        // REPRODUCCIÓN SINCRONIZADA
        // =====================================================

        function reproducirSincronizado(id) {

            if (cargandoAudio) {
                return;
            }


            const cancion =
                canciones[id];


            if (!cancion || !cancion.audio) {
                return;
            }


            const inicio =
                Number(radio.inicioEmision);


            if (!Number.isFinite(inicio)) {
                return;
            }


            cargandoAudio = true;


            const cuandoCargue = function () {

                audioRadio.removeEventListener(
                    "loadedmetadata",
                    cuandoCargue
                );


                cargandoAudio = false;


                // Verificar que siga siendo la canción actual

                if (radio.cancionActual !== id) {
                    return;
                }


                const ahora =
                    Date.now();


                const tiempoTranscurrido =
                    (ahora - inicio) / 1000;


                if (!Number.isFinite(tiempoTranscurrido)) {
                    return;
                }


                if (
                    !Number.isFinite(audioRadio.duration)
                ) {
                    return;
                }


                if (
                    tiempoTranscurrido >=
                    audioRadio.duration
                ) {
                    return;
                }


                if (tiempoTranscurrido < 0) {
                    return;
                }


                // Ir directamente al momento correcto

                audioRadio.currentTime =
                    tiempoTranscurrido;


                audioRadio.play()
                    .then(function () {

                        // Verificar nuevamente

                        if (
                            radio.cancionActual !== id
                        ) {

                            audioRadio.pause();

                            return;
                        }


                        audioActivo = true;

                        idAudioActual = id;


                        botonEscuchar.textContent =
                            "⏸️ Pausar radio";
                    })

                    .catch(function (error) {

                        console.log(
                            "No se pudo reproducir automáticamente:",
                            error
                        );

                        audioActivo = false;

                        idAudioActual = null;

                        botonEscuchar.textContent =
                            "🎧 Escuchar radio";
                    });
            };


            audioRadio.addEventListener(
                "loadedmetadata",
                cuandoCargue
            );


            audioRadio.src =
                cancion.audio;


            audioRadio.load();
        }


        // =====================================================
        // FIREBASE: RADIO
        // =====================================================

        onValue(
            radioRef,
            function (snapshot) {

                const datos =
                    snapshot.val();


                if (datos) {

                    radio = datos;

                } else {

                    radio = {};
                }


                radioCargado = true;


                actualizarPantalla();


                // Si la radio está transmitiendo,
                // comprobar la canción actual

                if (
                    radio.estado === "playing" ||
                    radio.estado === "En emisión"
                ) {

                    const id =
                        radio.cancionActual;


                    if (
                        id &&
                        canciones[id] &&
                        id !== idAudioActual
                    ) {

                        audioRadio.pause();

                        audioRadio.currentTime = 0;

                        audioActivo = false;

                        idAudioActual = null;

                        cargandoAudio = false;


                        // Solo sincronizar si
                        // ya tenemos las canciones

                        if (cancionesCargadas) {

                            reproducirSincronizado(id);
                        }
                    }
                }
            }
        );


        // =====================================================
        // FIREBASE: CANCIONES
        // =====================================================

        onValue(
            cancionesRef,
            function (snapshot) {

                const datos =
                    snapshot.val();


                if (datos) {

                    canciones = datos;

                } else {

                    canciones = {};
                }


                cancionesCargadas = true;


                actualizarPantalla();


                // Si radio ya cargó y hay canción
                // actualmente en emisión

                if (radioCargado) {

                    const id =
                        radio.cancionActual;


                    if (
                        id &&
                        canciones[id] &&
                        (
                            radio.estado === "playing" ||
                            radio.estado === "En emisión"
                        )
                    ) {

                        if (
                            idAudioActual !== id &&
                            !audioActivo
                        ) {

                            reproducirSincronizado(id);
                        }
                    }
                }
            }
        );


        // =====================================================
        // BOTÓN ESCUCHAR / PAUSAR
        // =====================================================

        botonEscuchar.addEventListener(
            "click",
            function () {

                const id =
                    radio.cancionActual;


                if (!id || !canciones[id]) {
                    return;
                }


                // Si ya está sonando

                if (
                    audioActivo &&
                    idAudioActual === id
                ) {

                    audioRadio.pause();

                    audioActivo = false;

                    botonEscuchar.textContent =
                        "▶️ Continuar radio";

                    return;
                }


                // Si estaba pausado, continuar

                if (
                    audioRadio.src &&
                    idAudioActual === id &&
                    audioRadio.paused
                ) {

                    audioRadio.play()
                        .then(function () {

                            audioActivo = true;

                            botonEscuchar.textContent =
                                "⏸️ Pausar radio";
                        })

                        .catch(function (error) {

                            console.log(error);
                        });

                    return;
                }


                // Si es una nueva canción,
                // sincronizar desde el tiempo correcto

                reproducirSincronizado(id);
            }
        );


        // =====================================================
        // CUANDO TERMINA UNA CANCIÓN
        // =====================================================

        audioRadio.addEventListener(
            "ended",
            function () {

                audioActivo = false;

                idAudioActual = null;

                botonEscuchar.textContent =
                    "🎧 Escuchar radio";
            }
        );


        // =====================================================
        // INICIO
        // =====================================================

        cargando.style.display =
            "block";

        texto.style.display =
            "none";

    </script>

</body>
