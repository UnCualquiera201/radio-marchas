        };


        const app =
            initializeApp(firebaseConfig);


        const db =
            getDatabase(app);


        // =========================
        // REFERENCIAS
        // =========================

        const radioRef =
            ref(db, "radio");


        const cancionesRef =
            ref(db, "canciones");


        // =========================
        // ELEMENTOS
        // =========================

        const radioInfo =
            document.getElementById("radioInfo");


        const titulo =
            document.getElementById("titulo");


        const compositor =
            document.getElementById("compositor");


        const interpreta =
            document.getElementById("interpreta");


        const cargando =
            document.getElementById("cargando");

        // AUDIO

        const audioRadio =
            new Audio();


        let audioActivo = false;

        // DATOS

        let canciones = {};

        let radioCargado = false;

        function obtenerCancionActual() {

            const id =
                radio.cancionActual;


            if (
                id === undefined ||
                id === null ||
                id === ""
            ) {
                return null;
            }


            // Forma normal

            if (
                canciones[id] !== undefined &&
                canciones[id] !== null
            ) {

                return canciones[id];
            }


            // Por si Firebase tiene la clave
            // convertida a texto

            const idTexto =
                String(id);


            if (
                canciones[idTexto] !== undefined &&
                canciones[idTexto] !== null
            ) {

                return canciones[idTexto];
            }


            return null;
        }


        // =========================
        // ACTUALIZAR PANTALLA
        // =========================

        function actualizarPantalla() {

            if (

            ) {

                    "⏸️ EN PAUSA";

                    "Radio Marchas";

                    "";

                cargando.style.display =
                    "none";

            // =========================
            // CANCIÓN
            // =========================

            const cancion =
                obtenerCancionActual();


            if (!cancion) {

                console.error(
                    "No se encontró la canción:",
                    radio.cancionActual
                );


                titulo.textContent =
                    "Radio Marchas";


                compositor.textContent =
                    "";


                interpreta.textContent =
                    "";


                cargando.style.display =
                    "none";


                return;
            }


            // =========================
            // TÍTULO

            titulo.textContent =
                cancion.titulo || "";

            // COMPOSITOR

            compositor.textContent =

                    ? "Compositor: " +
                      cancion.compositor
                    : "";

            // INTÉRPRETE

            interpreta.textContent =
                cancion.interpreta

                    : "";

            } else {

                radioInfo.style.backgroundImage =

            radioInfo.style.backgroundPosition =
                `${x}% ${y}%`;


            // =========================
            // OCULTAR CARGANDO

            cargando.style.display =
                "none";

        // =========================
        // REPRODUCIR SINCRONIZADO
        // =========================

        function reproducirSincronizado() {

            const id =
                radio.cancionActual;


            if (
                id === undefined ||
                id === null ||
                id === ""
            ) {

                alert(
                    "No hay ninguna marcha en emisión."
                );

                return;
            }


            const cancion =
                obtenerCancionActual();


            if (!cancion) {

                alert(
                    "No se encontró la marcha."
                );

                return;
            }


            if (!cancion.audio) {

                alert(
                    "Esta marcha no tiene audio."
                );

                return;
            }


            const inicio =
                Number(
                    radio.inicioEmision
                );


            if (
                !Number.isFinite(inicio) ||
                inicio <= 0
            ) {

                console.log(
                    "La emisión no tiene un inicioEmision válido."
                );

                return;
            }


            if (cargandoAudio) {
                return;
            }


            cargandoAudio =
                true;


            idAudioActual =
                id;


            const cuandoCargue =
                function () {

                    audioRadio.removeEventListener(
                        "loadedmetadata",
                        cuandoCargue
                    );


                    cargandoAudio =
                        false;


                    if (
                        radio.cancionActual !== id
                    ) {

                        console.log(
                            "La marcha cambió mientras se cargaba el audio."
                        );

                        return;
                    }


                    const ahora =
                        Date.now();


                    const tiempoTranscurrido =
                        (
                            ahora -
                            inicio
                        ) / 1000;


                    console.log(
                        "=============================="
                    );


                    console.log(
                        "🎵 Marcha:",
                        cancion.titulo
                    );


                    console.log(
                        "⏱️ inicioEmision:",
                        inicio
                    );


                    console.log(
                        "🕐 Ahora:",
                        ahora
                    );


                    console.log(
                        "▶️ Segundos transcurridos:",
                        tiempoTranscurrido
                    );


                    console.log(
                        "⏳ Duración:",
                        audioRadio.duration
                    );


                    if (
                        !Number.isFinite(
                            tiempoTranscurrido
                        )
                    ) {

                        console.error(
                            "El tiempo de sincronización no es válido."
                        );

                        botonEscuchar.textContent =
                            "🎧 Escuchar radio";

                        return;
                    }


                    if (
                        !Number.isFinite(
                            audioRadio.duration
                        )
                    ) {

                        console.error(
                            "La duración del audio no es válida."
                        );

                        botonEscuchar.textContent =
                            "🎧 Escuchar radio";

                        return;
                    }


                    if (
                        tiempoTranscurrido >=
                        audioRadio.duration
                    ) {

                        console.log(
                            "La marcha ya terminó."
                        );

                        botonEscuchar.textContent =
                            "🎧 Escuchar radio";

                        return;
                    }


                    if (
                        tiempoTranscurrido < 0
                    ) {

                        console.log(
                            "El tiempo calculado es negativo."
                        );

                        botonEscuchar.textContent =
                            "🎧 Escuchar radio";

                        return;
                    }


                    console.log(
                        "⏩ Saltando al segundo:",
                        tiempoTranscurrido
                    );


                    try {

                        audioRadio.currentTime =
                            tiempoTranscurrido;

                    } catch (error) {

                        console.error(
                            "Error al cambiar currentTime:",
                            error
                        );

                        botonEscuchar.textContent =
                            "🎧 Escuchar radio";

                        return;
                    }


                    audioRadio.play()
                        .then(function () {

                            if (
                                radio.cancionActual !== id
                            ) {

                                audioRadio.pause();

                                return;
                            }


                            audioActivo =
                                true;


                            idAudioActual =
                                id;


                            botonEscuchar.textContent =
                                "⏸️ Pausar radio";


                            console.log(
                                "✅ Radio sincronizada."
                            );

                        })
                        .catch(function(error) {

                            console.error(
                                "❌ No se pudo reproducir:",
                                error
                            );


                            audioActivo =
                                false;


                            botonEscuchar.textContent =
                                "🎧 Escuchar radio";

                        });

                };


            audioRadio.addEventListener(
                "loadedmetadata",
                cuandoCargue
            );


            audioRadio.src =
                cancion.audio;


            audioRadio.load();

        }


        // =========================
        // RADIO
        // =========================

        onValue(
            radioRef,
            function(snapshot) {

                const radioAnterior =
                    radio;


                radio =
                    snapshot.val() || {};


                radioCargado =
                    true;


                actualizarPantalla();


                const marchaCambio =
                    radioAnterior.cancionActual !==
                    radio.cancionActual;


                const estado =
                    String(
                        radio.estado || ""
                    ).trim();


                if (
                    estado !== "playing" &&
                    estado !== "En emisión"
                ) {

                    if (audioActivo) {

                        audioRadio.pause();


                        audioActivo =
                            false;


                        idAudioActual =
                            null;


                        botonEscuchar.textContent =
                            "🎧 Escuchar radio";
                    }


                    return;
                }


                // Si cambia la marcha mientras
                // estaba sonando

                if (
                    audioActivo &&
                    marchaCambio
                ) {

                    console.log(
                        "🔄 Cambió la marcha. Sincronizando..."
                    );


                    audioRadio.pause();


                    audioActivo =
                        false;


                    idAudioActual =
                        null;


                    botonEscuchar.textContent =
                        "🎧 Escuchar radio";


                    reproducirSincronizado();
                }

            }
        );


        // =========================
        // CANCIONES
        // =========================

        onValue(
            cancionesRef,
            function(snapshot) {

                canciones =
                    snapshot.val() || {};


                cancionesCargadas =
                    true;


                console.log(
                    "🎵 Canciones cargadas:",
                    canciones
                );


                actualizarPantalla();

            }
        );

        // BOTÓN ESCUCHAR RADIO
        // =========================

        botonEscuchar.addEventListener(
            "click",
            function() {

                console.log(
                    "🎧 Botón escuchar pulsado"
                );


                const id =
                    radio.cancionActual;


                if (
                    id === undefined ||
                    id === null ||
                    id === ""
                ) {

                    alert(
                        "No hay ninguna marcha en emisión."
                    );

                    return;
                }


                const cancion =
                    obtenerCancionActual();


                if (!cancion) {

                    alert(
                        "No se encontró la marcha."
                    );

                    return;
                }


                if (!cancion.audio) {

                    alert(
                        "Esta marcha no tiene audio."
                    );

                    return;
                }


                if (audioActivo) {

                    audioRadio.pause();


                    audioActivo =
                        false;


                    botonEscuchar.textContent =
                        "🎧 Escuchar radio";


                    return;
                }


                reproducirSincronizado();

            }
        );

        // CUANDO TERMINA EL AUDIO
        // =========================

        audioRadio.addEventListener(
            "ended",
            function() {

                audioActivo =
                    false;


                idAudioActual =
                    null;


                botonEscuchar.textContent =
                    "🎧 Escuchar radio";

            }
        );


    </script>
