            <p id="interpreta"></p>

            </button>

        </div>

    </div>



    <script type="module">


        // =====================================================
        // FIREBASE
        // =====================================================


        import {

            initializeApp

        }

        from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


        import {

            getDatabase,
            ref,
            onValue

        }

        from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";



        // =====================================================
        // CONFIGURACIÓN
        // =====================================================


        const firebaseConfig = {

            apiKey:
                "AIzaSyBCKrD4b9-LyokCtvxmj1r8_J35O6w9AQ",

            authDomain:
                "radio-marchas.firebaseapp.com",

            databaseURL:
                "https://radio-marchas-default-rtdb.firebaseio.com",

            projectId:
                "radio-marchas",

            storageBucket:
                "radio-marchas.firebasestorage.app",

            messagingSenderId:
                "190263587385",

            appId:
                "1:190263587385:web:1c6a77e370c0103da913e8"

        };


        const app =
            initializeApp(firebaseConfig);


        const db =
            getDatabase(app);



        // =====================================================
        // REFERENCIAS
        // =====================================================


        const radioRef =
            ref(db, "radio");


        const cancionesRef =
            ref(db, "canciones");



        // =====================================================
        // ELEMENTOS
        // =====================================================


        const radioInfo =
            document.getElementById("radioInfo");


        const titulo =
            document.getElementById("titulo");


        const compositor =
            document.getElementById("compositor");


        const interpreta =
            document.getElementById("interpreta");


        const cargando =
            document.getElementById("cargando");


        const enEmision =
            document.getElementById("enEmision");


        const botonEscuchar =
            document.getElementById("escucharRadio");



        // =====================================================
        // AUDIO
        // =====================================================


        const audioRadio =
            new Audio();


        audioRadio.preload =
            "auto";


        let audioActivo =
            false;


        let usuarioEscuchando =
            false;


        let idAudioActual =
            null;


        /*
         * Cada vez que comienza una nueva operación
         * de audio aumenta este número.
         *
         * Si una operación vieja termina después,
         * queda invalidada y no puede reproducirse.
         */

        let numeroOperacionAudio =
            0;


        /*
         * Evita que dos transiciones se ejecuten
         * al mismo tiempo.
         */

        let transicionEnCurso =
            false;



        // =====================================================
        // DATOS
        // =====================================================


        let radio =
            {};


        let canciones =
            {};


        let radioCargado =
            false;


        let cancionesCargadas =
            false;



        // =====================================================
        // LIMPIAR PANTALLA
        // =====================================================


        function limpiarPantalla() {

            radioInfo.style.backgroundImage =
                "none";


            titulo.textContent =
                "";


            compositor.textContent =
                "";


            interpreta.textContent =
                "";


            enEmision.style.display =
                "none";


            botonEscuchar.style.display =
                "none";


            botonEscuchar.textContent =
                "🎧 Escuchar radio";


            botonEscuchar.disabled =
                false;


            cargando.style.display =
                "none";

        }



        // =====================================================
        // DETENER AUDIO COMPLETAMENTE
        // =====================================================


        function detenerAudioCompleto() {


            /*
             * Invalidamos cualquier operación anterior.
             */

            numeroOperacionAudio++;


            transicionEnCurso =
                false;


            audioRadio.pause();


            /*
             * NO usamos removeAttribute + load()
             * constantemente durante los cambios normales.
             *
             * Solo aquí, cuando realmente se detiene
             * la radio.
             */

            audioRadio.removeAttribute("src");


            audioRadio.load();


            audioActivo =
                false;


            idAudioActual =
                null;


            usuarioEscuchando =
                false;


            botonEscuchar.disabled =
                false;


            botonEscuchar.textContent =
                "🎧 Escuchar radio";

        }



        // =====================================================
        // ACTUALIZAR PANTALLA
        // =====================================================


        function actualizarPantalla() {


            if (

                !radioCargado ||

                !cancionesCargadas

            ) {

                radioInfo.style.display =
                    "flex";

                cargando.style.display =
                    "block";

                return;

            }


            const estado =
                String(
                    radio.estado || ""
                ).trim();



            // =================================================
            // STOPPED
            // =================================================


            if (
                estado === "stopped"
            ) {

                detenerAudioCompleto();

                limpiarPantalla();

                radioInfo.style.display =
                    "none";

                return;

            }



            // =================================================
            // OTROS ESTADOS
            // =================================================


            if (

                estado !== "playing" &&

                estado !== "En emisión"

            ) {

                detenerAudioCompleto();

                limpiarPantalla();

                radioInfo.style.display =
                    "none";

                return;

            }



            // =================================================
            // EN EMISIÓN
            // =================================================


            radioInfo.style.display =
                "flex";


            enEmision.style.display =
                "block";


            botonEscuchar.style.display =
                "inline-block";



            const id =
                radio.cancionActual;



            if (!id) {

                titulo.textContent =
                    "";

                compositor.textContent =
                    "";

                interpreta.textContent =
                    "";

                radioInfo.style.backgroundImage =
                    "none";

                cargando.style.display =
                    "none";

                return;

            }



            const cancion =
                canciones[id];


            if (!cancion) {

                titulo.textContent =
                    "";

                compositor.textContent =
                    "";

                interpreta.textContent =
                    "";

                radioInfo.style.backgroundImage =
                    "none";

                cargando.style.display =
                    "none";

                return;

            }



            titulo.textContent =
                cancion.titulo || "";


            compositor.textContent =
                cancion.compositor
                    ? "Compositor: " +
                      cancion.compositor
                    : "";


            interpreta.textContent =
                cancion.interpreta
                    ? "Interpreta: " +
                      cancion.interpreta
                    : "";



            if (cancion.imagen) {

                radioInfo.style.backgroundImage =
                    `url("${cancion.imagen}")`;

            } else {

                radioInfo.style.backgroundImage =
                    "none";

            }



            const x =
                cancion.posicionX !== undefined
                    ? Number(cancion.posicionX)
                    : 50;


            const y =
                cancion.posicionY !== undefined
                    ? Number(cancion.posicionY)
                    : 50;


            radioInfo.style.backgroundPosition =
                `${x}% ${y}%`;


            cargando.style.display =
                "none";

        }



        // =====================================================
        // ESPERAR A QUE EL AUDIO ESTÉ LISTO
        // =====================================================


        function esperarAudioListo(
            operacion
        ) {


            return new Promise(
                function(resolve, reject) {


                    /*
                     * Si ya está suficientemente cargado,
                     * no necesitamos esperar.
                     */

                    if (
                        audioRadio.readyState >= 3
                    ) {

                        resolve();

                        return;

                    }



                    let terminado =
                        false;



                    function limpiar() {

                        audioRadio.removeEventListener(
                            "canplay",
                            listo
                        );

                        audioRadio.removeEventListener(
                            "error",
                            error
                        );

                    }



                    function listo() {

                        if (terminado) {
                            return;
                        }


                        terminado =
                            true;


                        limpiar();


                        resolve();

                    }



                    function error() {

                        if (terminado) {
                            return;
                        }


                        terminado =
                            true;


                        limpiar();


                        reject(
                            new Error(
                                "No se pudo cargar el audio."
                            )
                        );

                    }



                    audioRadio.addEventListener(
                        "canplay",
                        listo
                    );


                    audioRadio.addEventListener(
                        "error",
                        error
                    );



                    /*
                     * Comprobamos periódicamente si esta
                     * operación quedó invalidada.
                     */

                    const comprobar =
                        setInterval(
                            function() {


                                if (terminado) {

                                    clearInterval(
                                        comprobar
                                    );

                                    return;

                                }


                                if (
                                    operacion !==
                                    numeroOperacionAudio
                                ) {

                                    clearInterval(
                                        comprobar
                                    );


                                    terminado =
                                        true;


                                    limpiar();


                                    reject(
                                        new Error(
                                            "Carga cancelada."
                                        )
                                    );

                                }

                            },
                            50
                        );

                }
            );

        }



        // =====================================================
        // REPRODUCIR AUDIO
        //
        // sincronizar = true
        //
        //     Usuario pulsa el botón.
        //     Se sincroniza con inicioEmision.
        //
        //
        // sincronizar = false
        //
        //     Cambio automático.
        //     Empieza desde 0:00.
        // =====================================================


        async function reproducirAudio(
            sincronizar
        ) {


            /*
             * Cada reproducción nueva invalida
             * cualquier reproducción anterior.
             */

            const operacion =
                ++numeroOperacionAudio;



            const id =
                radio.cancionActual;


            if (!id) {

                if (sincronizar) {

                    console.error(
                        "No hay marcha actual."
                    );

                }

                return;

            }



            const cancion =
                canciones[id];


            if (!cancion) {

                if (sincronizar) {

                    console.error(
                        "No se encontró la marcha."
                    );

                }

                return;

            }



            if (!cancion.audio) {

                if (sincronizar) {

                    console.error(
                        "La marcha no tiene audio."
                    );

                }

                return;

            }



            /*
             * Si ya existe una transición,
             * la operación anterior queda invalidada.
             */

            transicionEnCurso =
                true;


            audioActivo =
                false;


            idAudioActual =
                id;


            botonEscuchar.disabled =
                true;


            botonEscuchar.textContent =
                "⏳ Cargando radio...";



            console.log(
                "🎵 CARGANDO:",
                cancion.titulo,
                "| automático:",
                !sincronizar
            );



            try {


                // =============================================
                // DETENER LA REPRODUCCIÓN ANTERIOR
                // =============================================


                audioRadio.pause();



                /*
                 * MUY IMPORTANTE:
                 *
                 * Esperamos un ciclo del navegador antes
                 * de cambiar el archivo.
                 *
                 * Esto evita el AbortError provocado por
                 * play() + pause() + load() simultáneos.
                 */

                await new Promise(
                    function(resolve) {

                        setTimeout(
                            resolve,
                            50
                        );

                    }
                );



                // =============================================
                // COMPROBAR OPERACIÓN
                // =============================================


                if (
                    operacion !==
                    numeroOperacionAudio
                ) {

                    return;

                }



                if (
                    radio.cancionActual !== id
                ) {

                    return;

                }



                // =============================================
                // CAMBIAR AL NUEVO AUDIO
                // =============================================


                audioRadio.src =
                    cancion.audio;



                /*
                 * load() solamente se ejecuta aquí,
                 * después de que el audio anterior ya
                 * fue pausado y la operación está controlada.
                 */

                audioRadio.load();



                // =============================================
                // ESPERAR A QUE ESTÉ LISTO
                // =============================================


                await esperarAudioListo(
                    operacion
                );



                // =============================================
                // COMPROBAR OTRA VEZ
                // =============================================


                if (
                    operacion !==
                    numeroOperacionAudio
                ) {

                    return;

                }


                if (
                    radio.cancionActual !== id
                ) {

                    return;

                }



                // =============================================
                // CALCULAR POSICIÓN
                // =============================================


                let posicion =
                    0;



                /*
                 * SOLO cuando el usuario pulsa
                 * Escuchar radio usamos inicioEmision.
                 */

                if (sincronizar) {


                    const inicio =
                        Number(
                            radio.inicioEmision
                        );


                    if (

                        Number.isFinite(inicio) &&

                        inicio > 0

                    ) {

                        posicion =
                            (
                                Date.now() -
                                inicio
                            ) / 1000;

                    }

                }



                /*
                 * En cambio automático:
                 *
                 * posicion = 0
                 */


                if (
                    posicion < 0
                ) {

                    posicion =
                        0;

                }



                // =============================================
                // COMPROBAR DURACIÓN
                // =============================================


                if (
                    !Number.isFinite(
                        audioRadio.duration
                    )
                ) {

                    throw new Error(
                        "La duración del audio no es válida."
                    );

                }



                if (
                    posicion >=
                    audioRadio.duration
                ) {

                    throw new Error(
                        "La marcha ya terminó."
                    );

                }



                // =============================================
                // COLOCAR POSICIÓN
                // =============================================


                audioRadio.currentTime =
                    posicion;



                // =============================================
                // COMPROBAR ANTES DE PLAY
                // =============================================


                if (
                    operacion !==
                    numeroOperacionAudio
                ) {

                    return;

                }


                if (
                    radio.cancionActual !== id
                ) {

                    return;

                }



                // =============================================
                // REPRODUCIR
                // =============================================


                await audioRadio.play();



                // =============================================
                // COMPROBAR DESPUÉS DE PLAY
                // =============================================


                if (
                    operacion !==
                    numeroOperacionAudio
                ) {

                    audioRadio.pause();

                    return;

                }


                if (
                    radio.cancionActual !== id
                ) {

                    audioRadio.pause();

                    return;

                }



                // =============================================
                // TODO CORRECTO
                // =============================================


                audioActivo =
                    true;


                idAudioActual =
                    id;


                transicionEnCurso =
                    false;


                botonEscuchar.disabled =
                    false;


                botonEscuchar.textContent =
                    "⏸️ Pausar radio";


                console.log(
                    "🔊 REPRODUCIENDO:",
                    cancion.titulo
                );


                console.log(
                    "⏱️ COMIENZA DESDE:",
                    posicion
                );

            }


            catch (error) {


                /*
                 * Si la operación fue cancelada porque
                 * llegó otra marcha, NO mostramos un error.
                 */

                if (
                    operacion !==
                    numeroOperacionAudio
                ) {

                    return;

                }



                /*
                 * Si cambió la marcha durante la carga,
                 * tampoco es un error real.
                 */

                if (
                    radio.cancionActual !== id
                ) {

                    return;

                }



                console.error(
                    "❌ ERROR DE REPRODUCCIÓN:",
                    error
                );


                audioActivo =
                    false;


                idAudioActual =
                    null;


                transicionEnCurso =
                    false;


                botonEscuchar.disabled =
                    false;


                botonEscuchar.textContent =
                    "🎧 Escuchar radio";

            }

        }



        // =====================================================
        // CAMBIOS DE RADIO EN FIREBASE
        // =====================================================


        onValue(

            radioRef,

            function(snapshot) {


                const radioAnterior =
                    radio;


                const idAnterior =
                    radioAnterior.cancionActual;


                const estabaEscuchando =
                    usuarioEscuchando;



                radio =
                    snapshot.val() || {};


                radioCargado =
                    true;



                const nuevoId =
                    radio.cancionActual;


                const marchaCambio =
                    idAnterior !== nuevoId;


                const estado =
                    String(
                        radio.estado || ""
                    ).trim();



                console.log(
                    "📡 RADIO:",
                    nuevoId,
                    "| estado:",
                    estado
                );



                actualizarPantalla();



                // =================================================
                // STOPPED
                // =================================================


                if (
                    estado === "stopped"
                ) {

                    detenerAudioCompleto();

                    return;

                }



                // =================================================
                // ESTADO NO ACTIVO
                // =================================================


                if (

                    estado !== "playing" &&

                    estado !== "En emisión"

                ) {

                    detenerAudioCompleto();

                    return;

                }



                // =================================================
                // CAMBIO DE MARCHA
                // =================================================


                if (

                    marchaCambio &&

                    nuevoId

                ) {


                    console.log(
                        "🔄 CAMBIO DE MARCHA:",
                        idAnterior,
                        "→",
                        nuevoId
                    );



                    /*
                     * Si el usuario ya había iniciado
                     * la radio, la nueva marcha debe
                     * comenzar automáticamente.
                     */

                    if (
                        estabaEscuchando
                    ) {


                        console.log(
                            "▶️ NUEVA MARCHA AUTOMÁTICA:",
                            nuevoId
                        );



                        /*
                         * Invalidamos cualquier operación
                         * anterior inmediatamente.
                         */

                        numeroOperacionAudio++;


                        audioRadio.pause();


                        audioActivo =
                            false;


                        idAudioActual =
                            null;


                        botonEscuchar.disabled =
                            true;


                        botonEscuchar.textContent =
                            "⏳ Cargando radio...";



                        /*
                         * Esperamos un poco antes de iniciar
                         * la nueva marcha.
                         */

                        setTimeout(
                            function() {


                                /*
                                 * Comprobar que sigue siendo
                                 * la marcha actual.
                                 */

                                if (
                                    radio.cancionActual !==
                                    nuevoId
                                ) {

                                    return;

                                }



                                const estadoActual =
                                    String(
                                        radio.estado || ""
                                    ).trim();



                                if (

                                    estadoActual !==
                                        "playing" &&

                                    estadoActual !==
                                        "En emisión"

                                ) {

                                    return;

                                }



                                /*
                                 * FALSE = empieza en 0:00.
                                 */

                                reproducirAudio(
                                    false
                                );


                            },
                            100
                        );

                    }

                }

            }

        );



        // =====================================================
        // CAMBIOS EN CANCIONES
        // =====================================================


        onValue(

            cancionesRef,

            function(snapshot) {


                canciones =
                    snapshot.val() || {};


                cancionesCargadas =
                    true;


                actualizarPantalla();

            }

        );



        // =====================================================
        // BOTÓN ESCUCHAR
        // =====================================================


        botonEscuchar.addEventListener(

            "click",

            async function() {


                // =================================================
                // PAUSAR
                // =================================================


                if (audioActivo) {


                    /*
                     * Invalidamos cualquier transición.
                     */

                    numeroOperacionAudio++;


                    audioRadio.pause();


                    audioActivo =
                        false;


                    usuarioEscuchando =
                        false;


                    botonEscuchar.textContent =
                        "🎧 Escuchar radio";


                    console.log(
                        "⏸️ RADIO PAUSADA"
                    );


                    return;

                }



                // =================================================
                // ESCUCHAR
                // =================================================


                usuarioEscuchando =
                    true;


                console.log(
                    "🎧 USUARIO INICIÓ LA RADIO"
                );


                /*
                 * TRUE:
                 *
                 * sincroniza con inicioEmision.
                 */

                reproducirAudio(
                    true
                );

            }

        );



        // =====================================================
        // AUDIO TERMINADO
        // =====================================================


        audioRadio.addEventListener(

            "ended",

            function() {


                console.log(
                    "⏹️ TERMINÓ:",
                    idAudioActual
                );


                audioActivo =
                    false;


                idAudioActual =
                    null;



                /*
                 * NO desactivamos usuarioEscuchando.
                 *
                 * Firebase será quien indique cuál
                 * es la siguiente marcha.
                 */

                if (
                    usuarioEscuchando
                ) {

                    botonEscuchar.textContent =
                        "⏳ Esperando siguiente marcha...";

                } else {

                    botonEscuchar.textContent =
                        "🎧 Escuchar radio";

                }

            }

        );



        // =====================================================
        // ERROR DEL AUDIO
        // =====================================================


        audioRadio.addEventListener(

            "error",

            function() {


                console.error(
                    "❌ ERROR DEL ELEMENTO AUDIO:",
                    audioRadio.error
                );


                /*
                 * No cambiamos de marcha aquí.
                 *
                 * El cambio de marcha pertenece
                 * exclusivamente a Firebase/index.html.
                 */

                audioActivo =
                    false;


                idAudioActual =
                    null;


                transicionEnCurso =
                    false;


                botonEscuchar.disabled =
                    false;


                botonEscuchar.textContent =
                    "🎧 Escuchar radio";

            }

        );


    </script>


</body>

</html>
