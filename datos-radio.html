```html
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Datos Radio Marchas</title>

    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;
        }


        #radioInfo {

            position: relative;

            width: 100%;

            aspect-ratio: 1908 / 412;

            min-height: 250px;

            overflow: hidden;

            background-size: cover;

            background-position: center center;

            background-repeat: no-repeat;

            display: flex;

            align-items: flex-end;

            box-sizing: border-box;
        }


        #filtro {

            position: absolute;

            inset: 0;

            background: rgba(0, 0, 0, 0.25);

            z-index: 1;
        }


        #texto {

            position: relative;

            z-index: 2;

            width: 100%;

            box-sizing: border-box;

            padding: 30px;

            color: white;

            text-shadow:
                2px 2px 5px black,
                -1px -1px 3px black;
        }


        #enEmision {

            font-size: 20px;

            font-weight: bold;

            margin-bottom: 10px;
        }


        #titulo {

            margin: 0 0 8px 0;

            font-size: clamp(24px, 3vw, 48px);

            font-weight: bold;
        }


        #compositor,
        #interpreta {

            margin: 4px 0;

            font-size: clamp(15px, 1.5vw, 24px);

            font-weight: 500;
        }


        #escucharRadio {

            margin-top: 15px;

            padding: 12px 20px;

            border: none;

            border-radius: 8px;

            background: white;

            color: black;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }


        #escucharRadio:hover {

            opacity: 0.9;
        }


        #escucharRadio:disabled {

            opacity: 0.6;

            cursor: not-allowed;
        }


        #cargando {

            position: absolute;

            z-index: 3;

            top: 50%;

            left: 50%;

            transform: translate(-50%, -50%);

            color: white;

            font-size: 20px;

            text-shadow:
                2px 2px 4px black;
        }

    </style>

</head>


<body>


    <div id="radioInfo">


        <div id="filtro"></div>


        <div id="cargando">

            Cargando...

        </div>


        <div id="texto">


            <div id="enEmision">

                🔴 EN EMISIÓN

            </div>


            <h1 id="titulo">

                Radio Marchas

            </h1>


            <p id="compositor"></p>


            <p id="interpreta"></p>


            <button id="escucharRadio">

                🎧 Escuchar radio

            </button>


        </div>


    </div>



    <script type="module">


        // =====================================================
        // FIREBASE
        // =====================================================


        import {

            initializeApp

        }

        from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


        import {

            getDatabase,
            ref,
            onValue

        }

        from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";



        // =====================================================
        // CONFIGURACIÓN
        // =====================================================


        const firebaseConfig = {

            apiKey:
                "AIzaSyBCKrD4b9-LyokCtvxmj1r8_J35O6w9AQ",

            authDomain:
                "radio-marchas.firebaseapp.com",

            databaseURL:
                "https://radio-marchas-default-rtdb.firebaseio.com",

            projectId:
                "radio-marchas",

            storageBucket:
                "radio-marchas.firebasestorage.app",

            messagingSenderId:
                "190263587385",

            appId:
                "1:190263587385:web:1c6a77e370c0103da913e8"

        };


        const app =
            initializeApp(firebaseConfig);


        const db =
            getDatabase(app);



        // =====================================================
        // REFERENCIAS
        // =====================================================


        const radioRef =
            ref(db, "radio");


        const cancionesRef =
            ref(db, "canciones");



        // =====================================================
        // ELEMENTOS
        // =====================================================


        const radioInfo =
            document.getElementById("radioInfo");


        const titulo =
            document.getElementById("titulo");


        const compositor =
            document.getElementById("compositor");


        const interpreta =
            document.getElementById("interpreta");


        const cargando =
            document.getElementById("cargando");


        const enEmision =
            document.getElementById("enEmision");


        const botonEscuchar =
            document.getElementById("escucharRadio");



        // =====================================================
        // AUDIO
        // =====================================================


        const audioRadio =
            new Audio();


        audioRadio.preload =
            "auto";


        let audioActivo =
            false;


        let idAudioActual =
            null;


        let usuarioEscuchando =
            false;


        let numeroCargaAudio =
            0;


        let cambioAutomatico =
            false;



        // =====================================================
        // DATOS
        // =====================================================


        let radio =
            {};


        let canciones =
            {};


        let radioCargado =
            false;


        let cancionesCargadas =
            false;



        // =====================================================
        // LIMPIAR PANTALLA
        // =====================================================


        function limpiarPantalla() {

            radioInfo.style.backgroundImage =
                "none";


            titulo.textContent =
                "";


            compositor.textContent =
                "";


            interpreta.textContent =
                "";


            enEmision.style.display =
                "none";


            botonEscuchar.style.display =
                "none";


            botonEscuchar.textContent =
                "🎧 Escuchar radio";


            botonEscuchar.disabled =
                false;


            cargando.style.display =
                "none";

        }



        // =====================================================
        // DETENER AUDIO COMPLETAMENTE
        // =====================================================


        function detenerAudioCompleto() {

            numeroCargaAudio++;


            audioRadio.pause();


            audioRadio.removeAttribute("src");


            audioRadio.load();


            audioActivo =
                false;


            idAudioActual =
                null;


            usuarioEscuchando =
                false;


            cambioAutomatico =
                false;


            botonEscuchar.disabled =
                false;


            botonEscuchar.textContent =
                "🎧 Escuchar radio";

        }



        // =====================================================
        // ACTUALIZAR PANTALLA
        // =====================================================


        function actualizarPantalla() {


            if (

                !radioCargado ||

                !cancionesCargadas

            ) {

                radioInfo.style.display =
                    "flex";

                cargando.style.display =
                    "block";

                return;

            }


            const estado =
                String(
                    radio.estado || ""
                ).trim();



            // =================================================
            // STOPPED
            // =================================================


            if (

                estado === "stopped"

            ) {

                detenerAudioCompleto();

                limpiarPantalla();

                radioInfo.style.display =
                    "none";

                return;

            }



            // =================================================
            // OTROS ESTADOS
            // =================================================


            if (

                estado !== "playing" &&

                estado !== "En emisión"

            ) {

                detenerAudioCompleto();

                limpiarPantalla();

                radioInfo.style.display =
                    "none";

                return;

            }



            // =================================================
            // EN EMISIÓN
            // =================================================


            radioInfo.style.display =
                "flex";


            enEmision.style.display =
                "block";


            botonEscuchar.style.display =
                "inline-block";



            const id =
                radio.cancionActual;



            if (!id) {

                titulo.textContent =
                    "";

                compositor.textContent =
                    "";

                interpreta.textContent =
                    "";

                radioInfo.style.backgroundImage =
                    "none";

                cargando.style.display =
                    "none";

                return;

            }



            const cancion =
                canciones[id];


            if (!cancion) {

                titulo.textContent =
                    "";

                compositor.textContent =
                    "";

                interpreta.textContent =
                    "";

                radioInfo.style.backgroundImage =
                    "none";

                cargando.style.display =
                    "none";

                return;

            }



            titulo.textContent =
                cancion.titulo || "";


            compositor.textContent =
                cancion.compositor
                    ? "Compositor: " +
                      cancion.compositor
                    : "";


            interpreta.textContent =
                cancion.interpreta
                    ? "Interpreta: " +
                      cancion.interpreta
                    : "";



            if (cancion.imagen) {

                radioInfo.style.backgroundImage =
                    `url("${cancion.imagen}")`;

            } else {

                radioInfo.style.backgroundImage =
                    "none";

            }



            const x =
                cancion.posicionX !== undefined
                    ? Number(cancion.posicionX)
                    : 50;


            const y =
                cancion.posicionY !== undefined
                    ? Number(cancion.posicionY)
                    : 50;


            radioInfo.style.backgroundPosition =
                `${x}% ${y}%`;


            cargando.style.display =
                "none";

        }



        // =====================================================
        // REPRODUCIR AUDIO
        // =====================================================


        function reproducirAudio(sincronizar) {


            const id =
                radio.cancionActual;


            if (!id) {

                if (sincronizar) {

                    alert(
                        "No hay ninguna marcha en emisión."
                    );

                }

                return;

            }


            const cancion =
                canciones[id];


            if (!cancion) {

                if (sincronizar) {

                    alert(
                        "No se encontró la marcha."
                    );

                }

                return;

            }


            if (!cancion.audio) {

                if (sincronizar) {

                    alert(
                        "Esta marcha no tiene audio."
                    );

                }

                return;

            }



            // =================================================
            // NUEVA CARGA
            // =================================================


            const numeroActual =
                ++numeroCargaAudio;


            idAudioActual =
                id;


            botonEscuchar.disabled =
                true;


            botonEscuchar.textContent =
                "⏳ Cargando radio...";


            console.log(
                "🎵 Cargando:",
                cancion.titulo
            );



            // =================================================
            // PAUSAR AUDIO ANTERIOR
            // =================================================


            audioRadio.pause();



            // =================================================
            // FUNCIÓN DE CARGA
            // =================================================


            const iniciarCuandoEsteListo =
                function() {


                    audioRadio.removeEventListener(
                        "canplay",
                        iniciarCuandoEsteListo
                    );


                    if (
                        numeroActual !==
                        numeroCargaAudio
                    ) {

                        return;

                    }



                    if (
                        radio.cancionActual !== id
                    ) {

                        return;

                    }



                    // -----------------------------------------
                    // POSICIÓN
                    // -----------------------------------------


                    let posicion =
                        0;



                    // -----------------------------------------
                    // SOLO EL BOTÓN SINCRONIZA
                    // -----------------------------------------


                    if (sincronizar) {


                        const inicio =
                            Number(
                                radio.inicioEmision
                            );


                        if (
                            Number.isFinite(inicio) &&
                            inicio > 0
                        ) {

                            posicion =
                                (
                                    Date.now() -
                                    inicio
                                ) / 1000;

                        }

                    }



                    if (
                        posicion < 0
                    ) {

                        posicion =
                            0;

                    }



                    // -----------------------------------------
                    // COMPROBAR DURACIÓN
                    // -----------------------------------------


                    if (
                        !Number.isFinite(
                            audioRadio.duration
                        )
                    ) {

                        console.error(
                            "Duración no válida."
                        );

                        botonEscuchar.disabled =
                            false;

                        botonEscuchar.textContent =
                            "🎧 Escuchar radio";

                        return;

                    }



                    // -----------------------------------------
                    // SI YA TERMINÓ
                    // -----------------------------------------


                    if (
                        posicion >=
                        audioRadio.duration
                    ) {

                        console.warn(
                            "La marcha ya terminó."
                        );

                        botonEscuchar.disabled =
                            false;

                        botonEscuchar.textContent =
                            "🎧 Escuchar radio";

                        return;

                    }



                    // -----------------------------------------
                    // COLOCAR POSICIÓN
                    // -----------------------------------------


                    try {

                        audioRadio.currentTime =
                            posicion;

                    }

                    catch (error) {

                        console.error(
                            "Error currentTime:",
                            error
                        );

                        botonEscuchar.disabled =
                            false;

                        botonEscuchar.textContent =
                            "🎧 Escuchar radio";

                        return;

                    }



                    // -----------------------------------------
                    // REPRODUCIR
                    // -----------------------------------------


                    audioRadio.play()

                        .then(function() {


                            if (
                                numeroActual !==
                                numeroCargaAudio
                            ) {

                                audioRadio.pause();

                                return;

                            }


                            if (
                                radio.cancionActual !== id
                            ) {

                                audioRadio.pause();

                                return;

                            }



                            audioActivo =
                                true;


                            idAudioActual =
                                id;


                            cambioAutomatico =
                                false;


                            botonEscuchar.disabled =
                                false;


                            botonEscuchar.textContent =
                                "⏸️ Pausar radio";


                            console.log(
                                "🔊 REPRODUCIENDO:",
                                cancion.titulo
                            );


                            console.log(
                                "⏱️ Desde:",
                                posicion
                            );

                        })


                        .catch(function(error) {


                            console.error(
                                "❌ No se pudo reproducir:",
                                error
                            );


                            audioActivo =
                                false;


                            idAudioActual =
                                null;


                            botonEscuchar.disabled =
                                false;


                            botonEscuchar.textContent =
                                "🎧 Escuchar radio";

                        });

                };



            // =================================================
            // IMPORTANTE:
            // REGISTRAR EL EVENTO ANTES DE load()
            // =================================================


            audioRadio.addEventListener(
                "canplay",
                iniciarCuandoEsteListo
            );



            // =================================================
            // CAMBIAR ARCHIVO
            // =================================================


            audioRadio.src =
                cancion.audio;


            audioRadio.load();

        }



        // =====================================================
        // FIREBASE - RADIO
        // =====================================================


        onValue(

            radioRef,

            function(snapshot) {


                const radioAnterior =
                    radio;


                const idAnterior =
                    radioAnterior.cancionActual;


                const estabaEscuchando =
                    usuarioEscuchando;



                radio =
                    snapshot.val() || {};


                radioCargado =
                    true;



                actualizarPantalla();



                const nuevoId =
                    radio.cancionActual;



                const marchaCambio =
                    idAnterior !== nuevoId;



                const estado =
                    String(
                        radio.estado || ""
                    ).trim();



                // =================================================
                // STOPPED
                // =================================================


                if (
                    estado === "stopped"
                ) {

                    detenerAudioCompleto();

                    return;

                }



                // =================================================
                // ESTADO INACTIVO
                // =================================================


                if (

                    estado !== "playing" &&

                    estado !== "En emisión"

                ) {

                    detenerAudioCompleto();

                    return;

                }



                // =================================================
                // CAMBIO DE MARCHA
                // =================================================


                if (

                    marchaCambio &&

                    nuevoId

                ) {


                    console.log(
                        "🔄 CAMBIO:",
                        idAnterior,
                        "→",
                        nuevoId
                    );



                    if (
                        estabaEscuchando
                    ) {


                        /*
                         * Marcamos que es un cambio
                         * automático.
                         */


                        cambioAutomatico =
                            true;


                        audioActivo =
                            false;


                        idAudioActual =
                            null;



                        /*
                         * IMPORTANTE:
                         *
                         * No quitamos el src.
                         *
                         * Simplemente reproducimos
                         * el nuevo archivo.
                         */


                        audioRadio.pause();



                        botonEscuchar.disabled =
                            true;


                        botonEscuchar.textContent =
                            "⏳ Cargando radio...";



                        /*
                         * Damos un pequeño tiempo para
                         * que Firebase y la pantalla
                         * terminen de actualizarse.
                         */


                        setTimeout(
                            function() {


                                if (
                                    radio.cancionActual !==
                                    nuevoId
                                ) {

                                    return;

                                }



                                const estadoActual =
                                    String(
                                        radio.estado || ""
                                    ).trim();



                                if (

                                    estadoActual !==
                                        "playing" &&

                                    estadoActual !==
                                        "En emisión"

                                ) {

                                    return;

                                }



                                /*
                                 * FALSE:
                                 *
                                 * La nueva marcha
                                 * empieza en 0:00.
                                 */


                                reproducirAudio(false);


                            },
                            150
                        );

                    }

                }

            }

        );



        // =====================================================
        // FIREBASE - CANCIONES
        // =====================================================


        onValue(

            cancionesRef,

            function(snapshot) {


                canciones =
                    snapshot.val() || {};


                cancionesCargadas =
                    true;


                actualizarPantalla();

            }

        );



        // =====================================================
        // BOTÓN ESCUCHAR
        // =====================================================


        botonEscuchar.addEventListener(

            "click",

            function() {


                // =================================================
                // PAUSAR
                // =================================================


                if (audioActivo) {


                    audioRadio.pause();


                    audioActivo =
                        false;


                    usuarioEscuchando =
                        false;


                    botonEscuchar.textContent =
                        "🎧 Escuchar radio";


                    console.log(
                        "⏸️ Radio pausada."
                    );


                    return;

                }



                // =================================================
                // ESCUCHAR
                // =================================================


                usuarioEscuchando =
                    true;



                reproducirAudio(true);

            }

        );



        // =====================================================
        // AUDIO TERMINADO
        // =====================================================


        audioRadio.addEventListener(

            "ended",

            function() {


                console.log(
                    "⏹️ Terminó:",
                    idAudioActual
                );


                audioActivo =
                    false;


                idAudioActual =
                    null;



                /*
                 * NO desactivamos usuarioEscuchando.
                 *
                 * Esto permite que la siguiente
                 * marcha se reproduzca automáticamente.
                 */


                if (
                    usuarioEscuchando
                ) {

                    botonEscuchar.textContent =
                        "⏳ Esperando siguiente marcha...";

                } else {

                    botonEscuchar.textContent =
                        "🎧 Escuchar radio";

                }

            }

        );



        // =====================================================
        // ERROR DE AUDIO
        // =====================================================


        audioRadio.addEventListener(

            "error",

            function() {


                console.error(
                    "❌ Error de audio:",
                    audioRadio.error
                );


                audioActivo =
                    false;


                idAudioActual =
                    null;


                botonEscuchar.disabled =
                    false;


                botonEscuchar.textContent =
                    "🎧 Escuchar radio";

            }

        );


    </script>


</body>

</html>
