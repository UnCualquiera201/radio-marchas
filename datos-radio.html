<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Radio Marchas</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;

            font-family: Arial, Helvetica, sans-serif;

            background: transparent;
        }


        /* =========================================
           SECCIÓN RADIO
           PROPORCIÓN: 1908 x 412
        ========================================= */

        #radioInfo {

            position: relative;

            width: 100%;

            /*
                1908 / 412 = 4.63
            */

            aspect-ratio: 1908 / 412;

            min-height: 250px;

            overflow: hidden;

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            display: flex;

            align-items: flex-end;

            transition:
                background-image 0.5s ease;
        }


        /* =========================================
           CAPA OSCURA
        ========================================= */

        #oscuro {

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    to top,
                    rgba(0, 0, 0, 0.85),
                    rgba(0, 0, 0, 0.35),
                    rgba(0, 0, 0, 0.05)
                );

            pointer-events: none;
        }


        /* =========================================
           DATOS
        ========================================= */

        #datos {

            position: relative;

            z-index: 2;

            width: 100%;

            padding: 35px 55px;

            color: white;

            text-shadow:
                0 2px 5px rgba(0, 0, 0, 0.9);
        }


        /* =========================================
           ESTADO
        ========================================= */

        #estado {

            display: inline-block;

            padding: 6px 13px;

            margin-bottom: 8px;

            border-radius: 20px;

            background:
                rgba(0, 0, 0, 0.60);

            color: white;

            font-size: 13px;

            font-weight: bold;
        }


        /* =========================================
           TITULO DE LA MARCHA
        ========================================= */

        #titulo {

            margin: 0 0 10px 0;

            color: white;

            font-size: 32px;

            line-height: 1.15;

            font-weight: bold;

            text-shadow:
                0 2px 6px rgba(0, 0, 0, 1);
        }


        /* =========================================
           DATOS
        ========================================= */

        .dato {

            margin: 3px 0;

            color: white;

            font-size: 17px;

            line-height: 1.3;

            text-shadow:
                0 2px 5px rgba(0, 0, 0, 0.9);
        }


        .dato strong {

            font-weight: bold;
        }


        /* =========================================
           TABLET
        ========================================= */

        @media (max-width: 1000px) {

            #datos {

                padding: 25px 35px;
            }

            #titulo {

                font-size: 27px;
            }

            .dato {

                font-size: 15px;
            }
        }


        /* =========================================
           CELULAR
        ========================================= */

        @media (max-width: 600px) {

            #radioInfo {

                min-height: 300px;

                aspect-ratio: auto;
            }

            #datos {

                padding: 20px;
            }

            #titulo {

                font-size: 23px;
            }

            .dato {

                font-size: 14px;
            }
        }

    </style>
</head>


<body>


    <!-- =========================================
         BLOQUE RADIO
    ========================================== -->

    <div id="radioInfo">


        <!-- OSCURECIMIENTO DE LA IMAGEN -->

        <div id="oscuro"></div>


        <!-- =====================================
             INFORMACIÓN
        ====================================== -->

        <div id="datos">


            <!-- ESTADO -->

            <div id="estado">
                Conectando...
            </div>


            <!-- TITULO -->

            <h1 id="titulo">
                Cargando...
            </h1>


            <!-- COMPOSITOR -->

            <p
                class="dato"
                id="lineaCompositor"
            >

                <strong>
                    Compositor:
                </strong>

                <span id="compositor"></span>

            </p>


            <!-- ADAPTACIÓN -->

            <p
                class="dato"
                id="lineaAdaptacion"
            >

                <strong>
                    Adaptación:
                </strong>

                <span id="adaptacion"></span>

            </p>


            <!-- ARREGLO -->

            <p
                class="dato"
                id="lineaArreglo"
            >

                <strong>
                    Arreglo:
                </strong>

                <span id="arreglo"></span>

            </p>


            <!-- REARMONIZACIÓN -->

            <p
                class="dato"
                id="lineaRearmonizacion"
            >

                <strong>
                    Rearmonización:
                </strong>

                <span id="rearmonizacion"></span>

            </p>


            <!-- INTERPRETA -->

            <p
                class="dato"
                id="lineaInterpreta"
            >

                <strong>
                    Interpreta:
                </strong>

                <span id="interpreta"></span>

            </p>


        </div>

    </div>



    <!-- =========================================
         FIREBASE
    ========================================== -->

    <script type="module">


        import {
            initializeApp
        }
        from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


        import {
            getDatabase,
            ref,
            onValue
        }
        from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";



        // =========================================
        // CONFIGURACIÓN FIREBASE
        // =========================================

        const firebaseConfig = {

            apiKey:
                "AIzaSyBCKrD4b9-LyokfCtvxm1j18_J35O6w9AQ",

            authDomain:
                "radio-marchas.firebaseapp.com",

            databaseURL:
                "https://radio-marchas-default-rtdb.firebaseio.com",

            projectId:
                "radio-marchas",

            storageBucket:
                "radio-marchas.firebasestorage.app",

            messagingSenderId:
                "190263587385",

            appId:
                "1:190263587385:web:1c6a77e370c0103da913e8"
        };



        // =========================================
        // CONECTAR FIREBASE
        // =========================================

        const app =
            initializeApp(firebaseConfig);


        const db =
            getDatabase(app);



        // =========================================
        // REFERENCIAS
        // =========================================

        const radioRef =
            ref(db, "radio");


        const cancionesRef =
            ref(db, "canciones");



        // =========================================
        // VARIABLES
        // =========================================

        let radioData = {};

        let cancionesData = {};



        // =========================================
        // ELEMENTOS
        // =========================================

        const radioInfo =
            document.getElementById("radioInfo");


        const estado =
            document.getElementById("estado");


        const titulo =
            document.getElementById("titulo");


        const compositor =
            document.getElementById("compositor");


        const adaptacion =
            document.getElementById("adaptacion");


        const arreglo =
            document.getElementById("arreglo");


        const rearmonizacion =
            document.getElementById("rearmonizacion");


        const interpreta =
            document.getElementById("interpreta");



        const lineaCompositor =
            document.getElementById("lineaCompositor");


        const lineaAdaptacion =
            document.getElementById("lineaAdaptacion");


        const lineaArreglo =
            document.getElementById("lineaArreglo");


        const lineaRearmonizacion =
            document.getElementById("lineaRearmonizacion");


        const lineaInterpreta =
            document.getElementById("lineaInterpreta");



        // =========================================
        // MOSTRAR U OCULTAR DATO
        // =========================================

        function mostrarDato(
            linea,
            elemento,
            valor
        ) {

            if (
                valor !== undefined &&
                valor !== null &&
                String(valor).trim() !== ""
            ) {

                elemento.textContent =
                    valor;

                linea.style.display =
                    "block";

            }

            else {

                elemento.textContent =
                    "";

                linea.style.display =
                    "none";
            }

        }



        // =========================================
        // ACTUALIZAR PANTALLA
        // =========================================

        function actualizarPantalla() {


            const id =
                radioData.cancionActual;



            // =====================================
            // SIN MARCHA
            // =====================================

            if (!id) {

                titulo.textContent =
                    "No hay una marcha seleccionada";


                radioInfo.style.backgroundImage =
                    "none";


                mostrarDato(
                    lineaCompositor,
                    compositor,
                    ""
                );


                mostrarDato(
                    lineaAdaptacion,
                    adaptacion,
                    ""
                );


                mostrarDato(
                    lineaArreglo,
                    arreglo,
                    ""
                );


                mostrarDato(
                    lineaRearmonizacion,
                    rearmonizacion,
                    ""
                );


                mostrarDato(
                    lineaInterpreta,
                    interpreta,
                    ""
                );


                estado.textContent =
                    "⏹ SIN EMISIÓN";


                return;
            }



            // =====================================
            // BUSCAR MARCHA
            // =====================================

            const cancion =
                cancionesData[id];



            if (!cancion) {

                titulo.textContent =
                    "Marcha no encontrada";

                return;
            }



            // =====================================
            // IMAGEN
            // =====================================

            if (cancion.imagen) {

                radioInfo.style.backgroundImage =
                    `url("${cancion.imagen}")`;

            }

            else {

                radioInfo.style.backgroundImage =
                    "none";
            }



            // =====================================
            // TITULO
            // =====================================

            titulo.textContent =
                cancion.titulo ||
                "Sin título";



            // =====================================
            // INFORMACIÓN
            // =====================================

            mostrarDato(
                lineaCompositor,
                compositor,
                cancion.compositor
            );


            mostrarDato(
                lineaAdaptacion,
                adaptacion,
                cancion.adaptacion
            );


            mostrarDato(
                lineaArreglo,
                arreglo,
                cancion.arreglo
            );


            mostrarDato(
                lineaRearmonizacion,
                rearmonizacion,
                cancion.rearmonizacion
            );


            mostrarDato(
                lineaInterpreta,
                interpreta,
                cancion.interpreta
            );



            // =====================================
            // ESTADO
            // =====================================

            const estadoActual =
                radioData.estado ||
                "stopped";



            if (
                estadoActual === "playing" ||
                estadoActual === "En emisión"
            ) {

                estado.textContent =
                    "🔴 EN EMISIÓN";

                estado.style.background =
                    "rgba(190, 0, 0, 0.75)";
            }


            else if (
                estadoActual === "paused" ||
                estadoActual === "Pausado"
            ) {

                estado.textContent =
                    "⏸ PAUSADO";

                estado.style.background =
                    "rgba(190, 100, 0, 0.75)";
            }


            else {

                estado.textContent =
                    "⏹ DETENIDO";

                estado.style.background =
                    "rgba(0, 0, 0, 0.65)";
            }

        }



        // =========================================
        // ESCUCHAR RADIO
        // =========================================

        onValue(
            radioRef,
            function(snapshot) {

                radioData =
                    snapshot.val() || {};

                actualizarPantalla();

            }
        );



        // =========================================
        // ESCUCHAR CANCIONES
        // =========================================

        onValue(
            cancionesRef,
            function(snapshot) {

                cancionesData =
                    snapshot.val() || {};

                actualizarPantalla();

            }
        );


    </script>

</body>
</html>
