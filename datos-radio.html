        function actualizarPantalla() {


            // -----------------------------------------------

            if (

                !cancionesCargadas

            // -----------------------------------------------

                if (audioActivo) {

                    idAudioActual =

                        null;

                radioInfo.style.display =

            // -----------------------------------------------

                    "";

                    "none";


                cargando.style.display =

                    "none";


                return;

            // -----------------------------------------------

                canciones[id];

                titulo.textContent =

                    "";


                compositor.textContent =

                    "";


                interpreta.textContent =

                    "";


                radioInfo.style.backgroundImage =

                    "none";


                cargando.style.display =

            // -----------------------------------------------
            // TÍTULO

            if (cancion.imagen) {


                radioInfo.style.backgroundImage =

                radioInfo.style.backgroundImage =

            const x =

            radioInfo.style.backgroundPosition =

                    "La emisión todavía no tiene una hora de inicio válida."

                );


                return;

            if (cargandoAudio) {

            cargandoAudio =

                true;


            idAudioActual =

                id;


            botonEscuchar.disabled =

                true;


            botonEscuchar.textContent =

                "⏳ Cargando radio...";



            console.log(

                "Preparando audio:",

                cancion.titulo

            );



            // -----------------------------------------------
            // EVENTO DE CARGA
            // -----------------------------------------------


            const cuandoCargue =

                function () {


                    audioRadio.removeEventListener(

                        "loadedmetadata",

                        cuandoCargue

                    );


                    cargandoAudio =

                        false;


                    botonEscuchar.disabled =

                        false;



                    // ---------------------------------------
                    // VERIFICAR QUE SIGUE LA MISMA CANCIÓN
                    // ---------------------------------------


                    if (

                        radio.cancionActual !== id

                    ) {


                        botonEscuchar.textContent =

                            "🎧 Escuchar radio";


                        return;

                    // ---------------------------------------

                        Date.now();

                        "Duración:",

                        audioRadio.duration

                    );



                    // ---------------------------------------
                    // COMPROBAR DURACIÓN
                    // ---------------------------------------


                    if (

                        !Number.isFinite(

                            audioRadio.duration

                        )

                    ) {


                        botonEscuchar.textContent =

                            "🎧 Escuchar radio";


                        return;

                    }



                    // ---------------------------------------

                    if (

                        tiempoTranscurrido >=

                    // ---------------------------------------

                    ) {


                        botonEscuchar.textContent =

                            "🎧 Escuchar radio";

                    // ---------------------------------------
                    // POSICIONAR AUDIO
                    // ---------------------------------------


                    try {


                        audioRadio.currentTime =

                            tiempoTranscurrido;


                    }

                    catch (error) {


                        console.error(

                            "Error al cambiar currentTime:",

                            error

                        );


                        botonEscuchar.textContent =

                            "🎧 Escuchar radio";

                    // ---------------------------------------

                    audioRadio.play()

                            if (

                            ) {

            // -----------------------------------------------


            audioRadio.pause();


            audioRadio.src =

            audioRadio.load();
