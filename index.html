```html
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Marchas</title>

    <style>
        #radioFondo {
            width: 100%;
            min-height: 300px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            padding: 30px;
            box-sizing: border-box;
        }

        #editor {
            margin-top: 25px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 12px;
            max-width: 600px;
        }

        #editor select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
        }

        #editor button {
            padding: 10px 15px;
            margin: 4px;
            cursor: pointer;
        }

        .posicion {
            margin: 10px 0;
            font-weight: bold;
        }

        #mensajeGuardado {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div id="radioFondo">
        <h1>Radio Marchas</h1>
    </div>

    <p id="estado">Conectando con Firebase...</p>

    <h2 id="titulo">Cargando canción...</h2>

    <p id="compositor"></p>
    <p id="arreglo"></p>
    <p id="rearmonizacion"></p>
    <p id="interpreta"></p>

    <button id="play">▶️ Play</button>
    <button id="pause">⏸️ Pausa</button>
    <button id="stop">⏹️ Stop</button>
    <button id="previous">⏮️ Anterior</button>
    <button id="next">⏭️ Siguiente</button>

    <audio id="audio"></audio>

    <div id="cola"></div>


    <!-- ========================= -->
    <!-- EDITOR DE POSICIÓN -->
    <!-- ========================= -->

    <div id="editor">

        <h2>🖼️ Editor de imagen</h2>

        <p>Selecciona una marcha:</p>

        <select id="selectorCancion">
            <option value="">Seleccionar marcha...</option>
        </select>

        <div class="posicion">
            Posición X:
            <span id="valorX">50</span>%
        </div>

        <button id="izquierda">⬅️ Izquierda</button>
        <button id="derecha">➡️ Derecha</button>

        <div class="posicion">
            Posición Y:
            <span id="valorY">50</span>%
        </div>

        <button id="arriba">⬆️ Arriba</button>
        <button id="abajo">⬇️ Abajo</button>

        <br><br>

        <button id="guardar">
            💾 Guardar posición
        </button>

        <p id="mensajeGuardado"></p>

    </div>


    <script type="module">

        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

        import {
            getDatabase,
            ref,
            onValue,
            update
        } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


        const firebaseConfig = {
            apiKey: "AIzaSyBCKrD4b9-LyokfCtvxm1j18_J35O6w9AQ",
            authDomain: "radio-marchas.firebaseapp.com",
            databaseURL: "https://radio-marchas-default-rtdb.firebaseio.com",
            projectId: "radio-marchas",
            storageBucket: "radio-marchas.firebasestorage.app",
            messagingSenderId: "190263587385",
            appId: "1:190263587385:web:1c6a77e370c0103da913e8"
        };


        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);


        const radioRef = ref(db, "radio");
        const cancionRef = ref(db, "canciones/marcha1");
        const cancionesRef = ref(db, "canciones");


        const audioElement =
            document.getElementById("audio");


        let listaCanciones = [];
        let indiceActual = 0;
        let datosCanciones = {};

        let cancionEditando = "";

        let posicionX = 50;
        let posicionY = 50;


        // =========================
        // FONDO
        // =========================

        function actualizarFondo(cancion) {

            const radioFondo =
                document.getElementById("radioFondo");

            if (!cancion || !cancion.imagen) {

                radioFondo.style.backgroundImage = "none";

                return;
            }


            radioFondo.style.backgroundImage =
                `url("${cancion.imagen}")`;


            const x =
                cancion.posicionX !== undefined
                    ? cancion.posicionX
                    : 50;


            const y =
                cancion.posicionY !== undefined
                    ? cancion.posicionY
                    : 50;


            radioFondo.style.backgroundPosition =
                `${x}% ${y}%`;

        }


        // =========================
        // EDITOR
        // =========================

        function cargarEditor(id) {

            const cancion =
                datosCanciones[id];

            if (!cancion) return;


            cancionEditando = id;


            posicionX =
                cancion.posicionX !== undefined
                    ? Number(cancion.posicionX)
                    : 50;


            posicionY =
                cancion.posicionY !== undefined
                    ? Number(cancion.posicionY)
                    : 50;


            document.getElementById("valorX")
                .textContent = posicionX;


            document.getElementById("valorY")
                .textContent = posicionY;


            actualizarVistaEditor();

        }


        // =========================
        // ACTUALIZAR VISTA
        // =========================

        function actualizarVistaEditor() {

            const cancion =
                datosCanciones[cancionEditando];

            if (!cancion) return;


            const radioFondo =
                document.getElementById("radioFondo");


            if (cancion.imagen) {

                radioFondo.style.backgroundImage =
                    `url("${cancion.imagen}")`;

            }


            radioFondo.style.backgroundPosition =
                `${posicionX}% ${posicionY}%`;


            document.getElementById("valorX")
                .textContent = posicionX;


            document.getElementById("valorY")
                .textContent = posicionY;

        }


        // =========================
        // SELECTOR
        // =========================

        const selector =
            document.getElementById("selectorCancion");


        selector.addEventListener("change", () => {

            const id = selector.value;

            if (!id) return;

            cargarEditor(id);

        });


        // =========================
        // MOVER IZQUIERDA
        // =========================

        document.getElementById("izquierda")
            .addEventListener("click", () => {

                posicionX -= 5;

                if (posicionX < 0)
                    posicionX = 0;

                actualizarVistaEditor();

            });


        // =========================
        // MOVER DERECHA
        // =========================

        document.getElementById("derecha")
            .addEventListener("click", () => {

                posicionX += 5;

                if (posicionX > 100)
                    posicionX = 100;

                actualizarVistaEditor();

            });


        // =========================
        // MOVER ARRIBA
        // =========================

        document.getElementById("arriba")
            .addEventListener("click", () => {

                posicionY -= 5;

                if (posicionY < 0)
                    posicionY = 0;

                actualizarVistaEditor();

            });


        // =========================
        // MOVER ABAJO
        // =========================

        document.getElementById("abajo")
            .addEventListener("click", () => {

                posicionY += 5;

                if (posicionY > 100)
                    posicionY = 100;

                actualizarVistaEditor();

            });


        // =========================
        // GUARDAR
        // =========================

        document.getElementById("guardar")
            .addEventListener("click", async () => {

                if (!cancionEditando) {

                    alert("Selecciona una marcha primero.");

                    return;
                }


                try {

                    const cancionRefEditor =
                        ref(
                            db,
                            "canciones/" +
                            cancionEditando
                        );


                    await update(
                        cancionRefEditor,
                        {
                            posicionX: posicionX,
                            posicionY: posicionY
                        }
                    );


                    datosCanciones[cancionEditando]
                        .posicionX = posicionX;


                    datosCanciones[cancionEditando]
                        .posicionY = posicionY;


                    document.getElementById(
                        "mensajeGuardado"
                    ).textContent =
                        "✅ Posición guardada correctamente.";


                } catch (error) {

                    console.error(error);


                    document.getElementById(
                        "mensajeGuardado"
                    ).textContent =
                        "❌ No se pudo guardar.";

                }

            });


        // =========================
        // MOSTRAR COLA
        // =========================

        function mostrarCola(canciones) {

            const cola =
                document.getElementById("cola");

            cola.innerHTML = "";


            for (
                let i = indiceActual + 1;
                i < listaCanciones.length;
                i++
            ) {

                const idCancion =
                    listaCanciones[i];

                const datosCancion =
                    canciones[idCancion];


                const tarjeta =
                    document.createElement("div");


                tarjeta.style.border =
                    "1px solid #ccc";

                tarjeta.style.padding =
                    "15px";

                tarjeta.style.marginTop =
                    "10px";

                tarjeta.style.borderRadius =
                    "10px";


                tarjeta.innerHTML = `

                    <strong>
                        ${datosCancion.titulo || ""}
                    </strong>

                    ${
                        datosCancion.compositor
                            ? "<br>Compositor: " +
                              datosCancion.compositor
                            : ""
                    }

                    ${
                        datosCancion.arreglo
                            ? "<br>Arreglo: " +
                              datosCancion.arreglo
                            : ""
                    }

                    ${
                        datosCancion.rearmonizacion
                            ? "<br>Rearmonización: " +
                              datosCancion.rearmonizacion
                            : ""
                    }

                    ${
                        datosCancion.interpreta
                            ? "<br>Interpreta: " +
                              datosCancion.interpreta
                            : ""
                    }

                `;


                cola.appendChild(tarjeta);

            }

        }


        // =========================
        // CARGAR CANCIÓN
        // =========================

        function cargarCancion(indice) {

            if (listaCanciones.length === 0)
                return;


            indiceActual = indice;


            mostrarCola(datosCanciones);


            const ruta =
                "canciones/" +
                listaCanciones[indiceActual];


            const nuevaCancionRef =
                ref(db, ruta);


            onValue(
                nuevaCancionRef,
                (snapshot) => {

                    const cancion =
                        snapshot.val();


                    if (!cancion)
                        return;


                    document.getElementById(
                        "titulo"
                    ).textContent =
                        cancion.titulo || "";


                    document.getElementById(
                        "compositor"
                    ).textContent =
                        cancion.compositor
                            ? "Compositor: " +
                              cancion.compositor
                            : "";


                    document.getElementById(
                        "arreglo"
                    ).textContent =
                        cancion.arreglo
                            ? "Arreglo: " +
                              cancion.arreglo
                            : "";


                    document.getElementById(
                        "rearmonizacion"
                    ).textContent =
                        cancion.rearmonizacion
                            ? "Rearmonización: " +
                              cancion.rearmonizacion
                            : "";


                    document.getElementById(
                        "interpreta"
                    ).textContent =
                        cancion.interpreta
                            ? "Interpreta: " +
                              cancion.interpreta
                            : "";


                    actualizarFondo(cancion);


                    if (cancion.audio) {

                        audioElement.src =
                            cancion.audio;

                    }

                }
            );

        }


        // =========================
        // CARGAR CANCIONES
        // =========================

        onValue(
            cancionesRef,
            (snapshot) => {

                const canciones =
                    snapshot.val();


                datosCanciones =
                    canciones || {};


                if (canciones) {

                    listaCanciones =
                        Object.keys(canciones);


                    console.log(
                        "Canciones:",
                        listaCanciones
                    );


                    mostrarCola(canciones);


                    // CREAR SELECTOR

                    selector.innerHTML =
                        `<option value="">
                            Seleccionar marcha...
                         </option>`;


                    listaCanciones.forEach(
                        (id) => {

                            const option =
                                document.createElement(
                                    "option"
                                );


                            option.value = id;


                            option.textContent =
                                canciones[id].titulo ||
                                id;


                            selector.appendChild(
                                option
                            );

                        }
                    );

                }

            }
        );


        // =========================
        // ESTADO
        // =========================

        onValue(
            radioRef,
            (snapshot) => {

                const radio =
                    snapshot.val();


                if (radio) {

                    document.getElementById(
                        "estado"
                    ).textContent =
                        "Estado: " +
                        radio.estado;

                }

            }
        );


        // =========================
        // CANCIÓN ACTUAL
        // =========================

        onValue(
            cancionRef,
            (snapshot) => {

                const cancion =
                    snapshot.val();


                if (!cancion)
                    return;


                document.getElementById(
                    "titulo"
                ).textContent =
                    cancion.titulo || "";


                document.getElementById(
                    "compositor"
                ).textContent =
                    cancion.compositor
                        ? "Compositor: " +
                          cancion.compositor
                        : "";


                document.getElementById(
                    "arreglo"
                ).textContent =
                    cancion.arreglo
                        ? "Arreglo: " +
                          cancion.arreglo
                        : "";


                document.getElementById(
                    "rearmonizacion"
                ).textContent =
                    cancion.rearmonizacion
                        ? "Rearmonización: " +
                          cancion.rearmonizacion
                        : "";


                document.getElementById(
                    "interpreta"
                ).textContent =
                    cancion.interpreta
                        ? "Interpreta: " +
                          cancion.interpreta
                        : "";


                actualizarFondo(cancion);

            }
        );


        // =========================
        // AUDIO
        // =========================

        onValue(
            cancionRef,
            (snapshot) => {

                const cancion =
                    snapshot.val();


                if (
                    cancion &&
                    cancion.audio
                ) {

                    audioElement.src =
                        cancion.audio;

                }

            }
        );


        // =========================
        // AUTO AVANCE
        // =========================

        audioElement.addEventListener(
            "ended",
            () => {

                if (
                    indiceActual <
                    listaCanciones.length - 1
                ) {

                    cargarCancion(
                        indiceActual + 1
                    );

                    audioElement.play();

                }

            }
        );


        // =========================
        // BOTONES
        // =========================

        document.getElementById("play")
            .addEventListener(
                "click",
                () => {

                    audioElement.play();

                }
            );


        document.getElementById("pause")
            .addEventListener(
                "click",
                () => {

                    audioElement.pause();

                }
            );


        document.getElementById("stop")
            .addEventListener(
                "click",
                () => {

                    audioElement.pause();

                    audioElement.currentTime = 0;

                }
            );


        document.getElementById("next")
            .addEventListener(
                "click",
                () => {

                    if (
                        indiceActual <
                        listaCanciones.length - 1
                    ) {

                        cargarCancion(
                            indiceActual + 1
                        );

                        audioElement.play();

                    }

                }
            );


        document.getElementById("previous")
            .addEventListener(
                "click",
                () => {

                    if (indiceActual > 0) {

                        cargarCancion(
                            indiceActual - 1
                        );

                        audioElement.play();

                    }

                }
            );

    </script>

</body>
</html>
```
