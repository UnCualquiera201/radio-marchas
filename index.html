<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Radio Marchas</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        #radioFondo {
            width: 100%;
            min-height: 300px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            padding: 30px;
            box-sizing: border-box;
            border-radius: 12px;
        }

        #editor,
        #editorOrden {
            margin-top: 25px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 12px;
            max-width: 600px;
            box-sizing: border-box;
        }

        #editor select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
        }

        #editor button,
        #editorOrden button {
            padding: 10px 15px;
            margin: 4px;
            cursor: pointer;
        }

        .posicion {
            margin: 10px 0;
            font-weight: bold;
        }

        #mensajeGuardado,
        #mensajeOrden {
            margin-top: 10px;
            font-weight: bold;
        }

        /* ========================= */
        /* BLOQUES ARRASTRABLES */
        /* ========================= */

        #listaOrden {
            margin-top: 15px;
        }

        .bloqueMarcha {
            display: flex;
            align-items: center;
            gap: 12px;

            padding: 14px;
            margin: 8px 0;

            background: #f5f5f5;
            border: 1px solid #ccc;
            border-radius: 10px;

            cursor: grab;

            user-select: none;

            transition:
                opacity 0.15s,
                transform 0.15s;
        }

        .bloqueMarcha:active {
            cursor: grabbing;
        }

        .bloqueMarcha.arrastrando {
            opacity: 0.45;
        }

        .numeroMarcha {
            min-width: 32px;
            height: 32px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #222;
            color: white;

            font-weight: bold;
        }

        .nombreMarcha {
            font-weight: bold;
            flex: 1;
        }

        .iconoArrastre {
            font-size: 20px;
            opacity: 0.6;
        }

        .zonaArrastre {
            height: 6px;
            margin: 4px 0;
            border-radius: 5px;
        }

        .zonaArrastre.activa {
            background: #777;
        }

    </style>

</head>


<body>


    <!-- ========================= -->
    <!-- RADIO -->
    <!-- ========================= -->

    <div id="radioFondo">

        <h1>Radio Marchas</h1>

    </div>


    <p id="estado">
        Conectando con Firebase...
    </p>


    <h2 id="titulo">
        Cargando canción...
    </h2>


    <p id="compositor"></p>

    <p id="adaptacion"></p>

    <p id="arreglo"></p>

    <p id="rearmonizacion"></p>

    <p id="interpreta"></p>


    <!-- ========================= -->
    <!-- CONTROLES -->
    <!-- ========================= -->

    <button id="play">
        ▶️ Play
    </button>

    <button id="pause">
        ⏸️ Pausa
    </button>

    <button id="stop">
        ⏹️ Stop
    </button>

    <button id="previous">
        ⏮️ Anterior
    </button>

    <button id="next">
        ⏭️ Siguiente
    </button>


    <audio id="audio"></audio>


    <!-- ========================= -->
    <!-- COLA -->
    <!-- ========================= -->

    <div id="cola"></div>


    <!-- ================================================= -->
    <!-- EDITOR DE ORDEN -->
    <!-- ================================================= -->

    <div id="editorOrden">

        <h2>
            🎵 Orden de las marchas
        </h2>

        <p>
            Arrastra las marchas para cambiar el orden:
        </p>

        <div id="listaOrden"></div>

        <button id="guardarOrden">
            💾 Guardar orden
        </button>

        <p id="mensajeOrden"></p>

    </div>


    <!-- ================================================= -->
    <!-- EDITOR DE IMAGEN -->
    <!-- ================================================= -->

    <div id="editor">

        <h2>
            🖼️ Editor de imagen
        </h2>

        <p>
            Selecciona una marcha:
        </p>


        <select id="selectorCancion">

            <option value="">
                Seleccionar marcha...
            </option>

        </select>


        <div class="posicion">

            Posición X:

            <span id="valorX">
                50
            </span>%

        </div>


        <button id="izquierda">
            ⬅️ Izquierda
        </button>

        <button id="derecha">
            ➡️ Derecha
        </button>


        <div class="posicion">

            Posición Y:

            <span id="valorY">
                50
            </span>%

        </div>


        <button id="arriba">
            ⬆️ Arriba
        </button>

        <button id="abajo">
            ⬇️ Abajo
        </button>


        <br>
        <br>


        <button id="guardar">
            💾 Guardar posición
        </button>


        <p id="mensajeGuardado"></p>

    </div>


    <!-- ================================================= -->
    <!-- FIREBASE -->
    <!-- ================================================= -->

    <script type="module">


        import {
            initializeApp
        }
        from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


        import {
            getDatabase,
            ref,
            onValue,
            update,
            get
        }
        from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


        // =================================================
        // CONFIGURACIÓN FIREBASE
        // =================================================


        const firebaseConfig = {

            apiKey:
                "AIzaSyBCKrD4b9-LyokfCtvxm1j18_J35O6w9AQ",

            authDomain:
                "radio-marchas.firebaseapp.com",

            databaseURL:
                "https://radio-marchas-default-rtdb.firebaseio.com",

            projectId:
                "radio-marchas",

            storageBucket:
                "radio-marchas.firebasestorage.app",

            messagingSenderId:
                "190263587385",

            appId:
                "1:190263587385:web:1c6a77e370c0103da913e8"

        };


        const app =
            initializeApp(firebaseConfig);


        const db =
            getDatabase(app);


        // =================================================
        // REFERENCIAS
        // =================================================


        const radioRef =
            ref(db, "radio");


        const cancionActualRef =
            ref(db, "radio/cancionActual");


        const cancionesRef =
            ref(db, "canciones");


        const audioElement =
            document.getElementById("audio");


        // =================================================
        // VARIABLES
        // =================================================


        let listaCanciones = [];

        let indiceActual = 0;

        let cancionActualId = "marcha1";

        let datosCanciones = {};

        let cancionEditando = "";

        let posicionX = 50;

        let posicionY = 50;

        let marchaArrastrada = null;


        // =================================================
        // FONDO DE LA RADIO
        // =================================================


        function actualizarFondo(cancion) {

            const radioFondo =
                document.getElementById("radioFondo");


            if (!cancion || !cancion.imagen) {

                radioFondo.style.backgroundImage =
                    "none";

                return;

            }


            radioFondo.style.backgroundImage =
                `url("${cancion.imagen}")`;


            const x =
                cancion.posicionX !== undefined
                    ? Number(cancion.posicionX)
                    : 50;


            const y =
                cancion.posicionY !== undefined
                    ? Number(cancion.posicionY)
                    : 50;


            radioFondo.style.backgroundPosition =
                `${x}% ${y}%`;

        }


        // =================================================
        // EDITOR DE IMAGEN
        // =================================================


        function cargarEditor(id) {

            const cancion =
                datosCanciones[id];


            if (!cancion) {

                console.log(
                    "No se encontró la canción:",
                    id
                );

                return;

            }


            cancionEditando =
                id;


            posicionX =
                cancion.posicionX !== undefined
                    ? Number(cancion.posicionX)
                    : 50;


            posicionY =
                cancion.posicionY !== undefined
                    ? Number(cancion.posicionY)
                    : 50;


            actualizarVistaEditor();

        }


        function actualizarVistaEditor() {

            if (!cancionEditando)
                return;


            const cancion =
                datosCanciones[cancionEditando];


            if (!cancion)
                return;


            const radioFondo =
                document.getElementById("radioFondo");


            if (cancion.imagen) {

                radioFondo.style.backgroundImage =
                    `url("${cancion.imagen}")`;

            }


            radioFondo.style.backgroundPosition =
                `${posicionX}% ${posicionY}%`;


            document.getElementById("valorX")
                .textContent = posicionX;


            document.getElementById("valorY")
                .textContent = posicionY;

        }


        // =================================================
        // SELECTOR
        // =================================================


        const selector =
            document.getElementById(
                "selectorCancion"
            );


        selector.addEventListener(
            "change",
            function () {

                const id =
                    selector.value;


                if (!id) {

                    cancionEditando = "";

                    return;

                }


                cargarEditor(id);

            }
        );


        // =================================================
        // MOVIMIENTO X
        // =================================================


        document.getElementById("izquierda")
            .addEventListener(
                "click",
                function () {

                    if (!cancionEditando) {

                        alert(
                            "Primero selecciona una marcha."
                        );

                        return;

                    }


                    posicionX -= 5;


                    if (posicionX < 0)
                        posicionX = 0;


                    actualizarVistaEditor();

                }
            );


        document.getElementById("derecha")
            .addEventListener(
                "click",
                function () {

                    if (!cancionEditando) {

                        alert(
                            "Primero selecciona una marcha."
                        );

                        return;

                    }


                    posicionX += 5;


                    if (posicionX > 100)
                        posicionX = 100;


                    actualizarVistaEditor();

                }
            );


        // =================================================
        // MOVIMIENTO Y
        // =================================================


        document.getElementById("arriba")
            .addEventListener(
                "click",
                function () {

                    if (!cancionEditando) {

                        alert(
                            "Primero selecciona una marcha."
                        );

                        return;

                    }


                    posicionY -= 5;


                    if (posicionY < 0)
                        posicionY = 0;


                    actualizarVistaEditor();

                }
            );


        document.getElementById("abajo")
            .addEventListener(
                "click",
                function () {

                    if (!cancionEditando) {

                        alert(
                            "Primero selecciona una marcha."
                        );

                        return;

                    }


                    posicionY += 5;


                    if (posicionY > 100)
                        posicionY = 100;


                    actualizarVistaEditor();

                }
            );


        // =================================================
        // GUARDAR POSICIÓN
        // =================================================


        document.getElementById("guardar")
            .addEventListener(
                "click",
                async function () {

                    if (!cancionEditando) {

                        alert(
                            "Primero selecciona una marcha."
                        );

                        return;

                    }


                    try {

                        const ruta =
                            "canciones/" +
                            cancionEditando;


                        await update(
                            ref(db, ruta),
                            {
                                posicionX:
                                    posicionX,

                                posicionY:
                                    posicionY
                            }
                        );


                        datosCanciones[
                            cancionEditando
                        ].posicionX =
                            posicionX;


                        datosCanciones[
                            cancionEditando
                        ].posicionY =
                            posicionY;


                        document.getElementById(
                            "mensajeGuardado"
                        ).textContent =
                            "✅ Posición guardada correctamente.";


                    } catch (error) {

                        console.error(
                            "Error al guardar:",
                            error
                        );


                        document.getElementById(
                            "mensajeGuardado"
                        ).textContent =
                            "❌ No se pudo guardar.";

                    }

                }
            );


        // =================================================
        // MOSTRAR COLA
        // =================================================


        function mostrarCola(canciones) {

            const cola =
                document.getElementById("cola");


            cola.innerHTML = "";


            for (
                let i = indiceActual + 1;
                i < listaCanciones.length;
                i++
            ) {

                const idCancion =
                    listaCanciones[i];


                const datosCancion =
                    canciones[idCancion];


                if (!datosCancion)
                    continue;


                const tarjeta =
                    document.createElement("div");


                tarjeta.style.border =
                    "1px solid #ccc";


                tarjeta.style.padding =
                    "15px";


                tarjeta.style.marginTop =
                    "10px";


                tarjeta.style.borderRadius =
                    "10px";


                tarjeta.innerHTML = `

                    <strong>
                        ${datosCancion.titulo || ""}
                    </strong>

                    ${
                        datosCancion.compositor
                            ? "<br>Compositor: " +
                              datosCancion.compositor
                            : ""
                    }

                    ${
                        datosCancion.adaptacion
                            ? "<br>Adaptación: " +
                              datosCancion.adaptacion
                            : ""
                    }

                    ${
                        datosCancion.arreglo
                            ? "<br>Arreglo: " +
                              datosCancion.arreglo
                            : ""
                    }

                    ${
                        datosCancion.rearmonizacion
                            ? "<br>Rearmonización: " +
                              datosCancion.rearmonizacion
                            : ""
                    }

                    ${
                        datosCancion.interpreta
                            ? "<br>Interpreta: " +
                              datosCancion.interpreta
                            : ""
                    }

                `;


                cola.appendChild(tarjeta);

            }

        }


        // =================================================
        // CREAR BLOQUES ARRASTRABLES
        // =================================================


        function mostrarEditorOrden() {

            const contenedor =
                document.getElementById("listaOrden");


            contenedor.innerHTML = "";


            listaCanciones.forEach(
                function (id, indice) {

                    const cancion =
                        datosCanciones[id];


                    if (!cancion)
                        return;


                    const bloque =
                        document.createElement("div");


                    bloque.className =
                        "bloqueMarcha";


                    bloque.draggable =
                        true;


                    bloque.dataset.id =
                        id;


                    bloque.innerHTML = `

                        <div class="numeroMarcha">
                            ${indice + 1}
                        </div>

                        <div class="nombreMarcha">
                            ${cancion.titulo || id}
                        </div>

                        <div class="iconoArrastre">
                            ☰
                        </div>

                    `;


                    // ==============================
                    // EMPEZAR A ARRASTRAR
                    // ==============================


                    bloque.addEventListener(
                        "dragstart",
                        function () {

                            marchaArrastrada =
                                id;


                            bloque.classList.add(
                                "arrastrando"
                            );

                        }
                    );


                    // ==============================
                    // TERMINAR ARRASTRE
                    // ==============================


                    bloque.addEventListener(
                        "dragend",
                        function () {

                            bloque.classList.remove(
                                "arrastrando"
                            );


                            marchaArrastrada =
                                null;


                            actualizarNumeros();

                        }
                    );


                    // ==============================
                    // PASAR POR ENCIMA
                    // ==============================


                    bloque.addEventListener(
                        "dragover",
                        function (event) {

                            event.preventDefault();


                            if (!marchaArrastrada)
                                return;


                            if (
                                marchaArrastrada === id
                            )
                                return;


                            const indiceOrigen =
                                listaCanciones.indexOf(
                                    marchaArrastrada
                                );


                            const indiceDestino =
                                listaCanciones.indexOf(
                                    id
                                );


                            if (
                                indiceOrigen === -1 ||
                                indiceDestino === -1
                            )
                                return;


                            listaCanciones.splice(
                                indiceOrigen,
                                1
                            );


                            const nuevoIndice =
                                listaCanciones.indexOf(
                                    id
                                );


                            listaCanciones.splice(
                                nuevoIndice,
                                0,
                                marchaArrastrada
                            );


                            mostrarEditorOrden();

                        }
                    );


                    contenedor.appendChild(
                        bloque
                    );

                }
            );

        }


        // =================================================
        // ACTUALIZAR NÚMEROS
        // =================================================


        function actualizarNumeros() {

            const bloques =
                document.querySelectorAll(
                    ".bloqueMarcha"
                );


            bloques.forEach(
                function (bloque, indice) {

                    const numero =
                        bloque.querySelector(
                            ".numeroMarcha"
                        );


                    if (numero) {

                        numero.textContent =
                            indice + 1;

                    }

                }
            );

        }


        // =================================================
        // GUARDAR ORDEN EN FIREBASE
        // =================================================


        document.getElementById("guardarOrden")
            .addEventListener(
                "click",
                async function () {

                    const mensaje =
                        document.getElementById(
                            "mensajeOrden"
                        );


                    if (
                        listaCanciones.length === 0
                    ) {

                        mensaje.textContent =
                            "❌ No hay marchas para guardar.";

                        return;

                    }


                    try {

                        await update(
                            radioRef,
                            {
                                orden:
                                    listaCanciones
                            }
                        );


                        mensaje.textContent =
                            "✅ Orden guardado correctamente.";


                        setTimeout(
                            function () {

                                mensaje.textContent =
                                    "";

                            },
                            3000
                        );


                    } catch (error) {

                        console.error(
                            "Error guardando orden:",
                            error
                        );


                        mensaje.textContent =
                            "❌ No se pudo guardar el orden.";

                    }

                }
            );


        // =================================================
        // CARGAR ORDEN GUARDADO
        // =================================================


        async function cargarOrdenGuardado() {

            try {

                const snapshot =
                    await get(
                        ref(db, "radio/orden")
                    );


                const ordenGuardado =
                    snapshot.val();


            if (
                Array.isArray(
                    ordenGuardado
                )
            ) {

                    const ordenValido =
                        ordenGuardado.filter(
                            function (id) {

                                return datosCanciones[id];

                            }
                        );


                    // Agregar automáticamente
                    // canciones nuevas que todavía
                    // no estén en el orden.


                    Object.keys(
                        datosCanciones
                    ).forEach(
                        function (id) {

                            if (
                                !ordenValido.includes(id)
                            ) {

                                ordenValido.push(id);

                            }

                        }
                    );


                    listaCanciones =
                        ordenValido;

                }


                mostrarEditorOrden();

                mostrarCola(
                    datosCanciones
                );


            } catch (error) {

                console.error(
                    "No se pudo cargar el orden:",
                    error
                );


                mostrarEditorOrden();

            }

        }


        // =================================================
        // CARGAR CANCIÓN
        // =================================================


        async function cargarCancion(
            indice,
            reproducir = false
        ) {

            if (
                listaCanciones.length === 0
            )
                return;


            if (
                indice < 0 ||
                indice >= listaCanciones.length
            )
                return;


            indiceActual =
                indice;


            cancionActualId =
                listaCanciones[
                    indiceActual
                ];


            mostrarCola(
                datosCanciones
            );


            await mostrarCancionPorId(
                cancionActualId,
                reproducir
            );

        }


        // =================================================
        // MOSTRAR CANCIÓN ACTUAL
        // =================================================


        async function mostrarCancionPorId(
            id,
            reproducir = false
        ) {

            if (!id)
                return;


            try {

                const snapshot =
                    await get(
                        ref(
                            db,
                            "canciones/" + id
                        )
                    );


                const cancion =
                    snapshot.val();


                if (!cancion)
                    return;


                cancionActualId =
                    id;


                const nuevoIndice =
                    listaCanciones.indexOf(id);


                if (
                    nuevoIndice !== -1
                ) {

                    indiceActual =
                        nuevoIndice;

                }


                document.getElementById(
                    "titulo"
                ).textContent =
                    cancion.titulo || "";


                document.getElementById(
                    "compositor"
                ).textContent =
                    cancion.compositor
                        ? "Compositor: " +
                          cancion.compositor
                        : "";


                document.getElementById(
                    "adaptacion"
                ).textContent =
                    cancion.adaptacion
                        ? "Adaptación: " +
                          cancion.adaptacion
                        : "";


                document.getElementById(
                    "arreglo"
                ).textContent =
                    cancion.arreglo
                        ? "Arreglo: " +
                          cancion.arreglo
                        : "";


                document.getElementById(
                    "rearmonizacion"
                ).textContent =
                    cancion.rearmonizacion
                        ? "Rearmonización: " +
                          cancion.rearmonizacion
                        : "";


                document.getElementById(
                    "interpreta"
                ).textContent =
                    cancion.interpreta
                        ? "Interpreta: " +
                          cancion.interpreta
                        : "";


                actualizarFondo(
                    cancion
                );


                if (cancion.audio) {

                    audioElement.src =
                        cancion.audio;

                }


                if (reproducir) {

                    try {

                        await audioElement.play();

                    } catch (error) {

                        console.log(
                            "El navegador necesita que el visitante pulse Play:",
                            error
                        );

                    }

                }

            } catch (error) {

                console.error(
                    "Error al cargar la marcha:",
                    error
                );

            }

        }


        // =================================================
        // CARGAR TODAS LAS CANCIONES
        // =================================================


        onValue(
            cancionesRef,
            async function (snapshot) {

                const canciones =
                    snapshot.val();


                datosCanciones =
                    canciones || {};


                if (!canciones) {

                    listaCanciones = [];

                    mostrarEditorOrden();

                    return;

                }


                // Si todavía no existe un orden
                // guardado, usamos el orden original.


                const ordenSnapshot =
                    await get(
                        ref(
                            db,
                            "radio/orden"
                        )
                    );


                const ordenGuardado =
                    ordenSnapshot.val();


                if (
                    Array.isArray(
                        ordenGuardado
                    )
                {

                    const ordenNuevo =
                        [];


                    // Mantener primero las
                    // canciones del orden guardado.


                    ordenGuardado.forEach(
                        function (id) {

                            if (
                                canciones[id] &&
                                !ordenNuevo.includes(id)
                            ) {

                                ordenNuevo.push(id);

                            }

                        }
                    );


                    // Agregar canciones nuevas.


                    Object.keys(
                        canciones
                    ).forEach(
                        function (id) {

                            if (
                                !ordenNuevo.includes(id)
                            ) {

                                ordenNuevo.push(id);

                            }

                        }
                    );


                    listaCanciones =
                        ordenNuevo;

                } else {

                    listaCanciones =
                        Object.keys(
                            canciones
                        );

                }


                console.log(
                    "Orden de canciones:",
                    listaCanciones
                );


                mostrarCola(
                    canciones
                );


                mostrarEditorOrden();


                // =================================================
                // SELECTOR DE MARCHAS
                // =================================================


                selector.innerHTML =
                    "";


                const opcionInicial =
                    document.createElement(
                        "option"
                    );


                opcionInicial.value =
                    "";


                opcionInicial.textContent =
                    "Seleccionar marcha...";


                selector.appendChild(
                    opcionInicial
                );


                listaCanciones.forEach(
                    function (id) {

                        const option =
                            document.createElement(
                                "option"
                            );


                        option.value =
                            id;


                        option.textContent =
                            canciones[id].titulo ||
                            id;


                        selector.appendChild(
                            option
                        );

                    }
                );


            }
        );


        // =================================================
        // EMISIÓN CENTRAL
        // =================================================


        onValue(
            radioRef,
            async function (snapshot) {

                const radio =
                    snapshot.val();


                if (!radio)
                    return;


                document.getElementById(
                    "estado"
                ).textContent =
                    "Estado: " +
                    (
                        radio.estado ||
                        "Fuera del aire"
                    );


                // La marcha actual es central
                // para todos los visitantes.


                if (
                    radio.cancionActual &&
                    radio.cancionActual !==
                    cancionActualId
                ) {

                    await mostrarCancionPorId(
                        radio.cancionActual,
                        false
                    );

                }

            }
        );


        // =================================================
        // INICIAR EMISIÓN
        // =================================================


        async function iniciarEmision(id) {

            if (!id)
                return;


            try {

                await update(
                    radioRef,
                    {

                        estado:
                            "En emisión",

                        cancionActual:
                            id

                    }
                );


                await mostrarCancionPorId(
                    id,
                    true
                );


            } catch (error) {

                console.error(
                    "No se pudo iniciar la emisión:",
                    error
                );

            }

        }


        // =================================================
        // CANCIÓN INICIAL
        // =================================================


        get(cancionActualRef)
            .then(
                function (snapshot) {

                    const id =
                        snapshot.val();


                    if (id) {

                        mostrarCancionPorId(
                            id,
                            false
                        );

                    } else {

                        mostrarCancionPorId(
                            "marcha1",
                            false
                        );

                    }

                }
            )
            .catch(
                function (error) {

                    console.error(
                        "No se pudo leer la emisión:",
                        error
                    );


                    mostrarCancionPorId(
                        "marcha1",
                        false
                    );

                }
            );


        // =================================================
        // AUTO AVANCE
        // =================================================


        audioElement.addEventListener(
            "ended",
            async function () {

                if (
                    indiceActual <
                    listaCanciones.length - 1
                ) {

                    const siguienteId =
                        listaCanciones[
                            indiceActual + 1
                        ];


                    try {

                        await update(
                            radioRef,
                            {

                                estado:
                                    "En emisión",

                                cancionActual:
                                    siguienteId

                            }
                        );


                    } catch (error) {

                        console.error(
                            "No se pudo cambiar la emisión:",
                            error
                        );

                    }

                } else {

                    await update(
                        radioRef,
                        {

                            estado:
                                "Fin de emisión"

                        }
                    );

                }

            }
        );


        // =================================================
        // PLAY
        // =================================================


        document.getElementById("play")
            .addEventListener(
                "click",
                function () {

                    audioElement
                        .play()
                        .catch(
                            function (error) {

                                console.log(
                                    "El navegador necesita una interacción:",
                                    error
                                );

                            }
                        );

                }
            );


        // =================================================
        // PAUSA
        // =================================================


        document.getElementById("pause")
            .addEventListener(
                "click",
                function () {

                    audioElement.pause();

                }
            );


        // =================================================
        // STOP
        // =================================================


        document.getElementById("stop")
            .addEventListener(
                "click",
                function () {

                    audioElement.pause();

                    audioElement.currentTime =
                        0;

                }
            );


        // =================================================
        // SIGUIENTE
        // =================================================


        document.getElementById("next")
            .addEventListener(
                "click",
                async function () {

                    if (
                        indiceActual <
                        listaCanciones.length - 1
                    ) {

                        const siguienteId =
                            listaCanciones[
                                indiceActual + 1
                            ];


                        try {

                            await update(
                                radioRef,
                                {

                                    estado:
                                        "En emisión",

                                    cancionActual:
                                        siguienteId

                                }
                            );


                        } catch (error) {

                            console.error(
                                "No se pudo cambiar la marcha:",
                                error
                            );

                        }

                    }

                }
            );


        // =================================================
        // ANTERIOR
        // =================================================


        document.getElementById("previous")
            .addEventListener(
                "click",
                async function () {

                    if (
                        indiceActual > 0
                    ) {

                        const anteriorId =
                            listaCanciones[
                                indiceActual - 1
                            ];


                        try {

                            await update(
                                radioRef,
                                {

                                    estado:
                                        "En emisión",

                                    cancionActual:
                                        anteriorId

                                }
                            );


                        } catch (error) {

                            console.error(
                                "No se pudo cambiar la marcha:",
                                error
                            );

                        }

                    }

                }
            );


    </script>

</body>

</html>
