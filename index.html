<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue,
    get,
    update,
    set
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {
    apiKey: "AIzaSyBCKrD4b9-LyokCtvxmj1r8_J35O6w9AQ",
    authDomain: "radio-marchas.firebaseapp.com",
    databaseURL: "https://radio-marchas-default-rtdb.firebaseio.com",
    projectId: "radio-marchas",
    storageBucket: "radio-marchas.firebasestorage.app",
    messagingSenderId: "190263587385",
    appId: "1:190263587385:web:1c6a77e370c0103da913e8"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const radioRef = ref(db, "radio");
const cancionesRef = ref(db, "canciones");
const ordenRef = ref(db, "radio/orden");


/* =========================================================
   VARIABLES
========================================================= */

let radio = {};
let canciones = {};
let listaCanciones = [];
let indiceActual = 0;
let cancionActualId = "marcha1";
let datosCanciones = {};
let ordenGuardado = [];

let posicionX = 50;
let posicionY = 50;


/*
 * Número de operación de audio.
 */

let operacionAudio = 0;


/*
 * Posición donde quedó pausada la marcha.
 */

let posicionPausada = 0;


/*
 * Indica si actualmente estamos reanudando
 * una marcha que fue pausada.
 */

let audioPausado = false;


/* =========================================================
   ELEMENTOS
========================================================= */

const audioElement =
    document.getElementById("audio");

const estadoElement =
    document.getElementById("estado");

const tituloElement =
    document.getElementById("titulo");

const compositorElement =
    document.getElementById("compositor");

const adaptacionElement =
    document.getElementById("adaptacion");

const arregloElement =
    document.getElementById("arreglo");

const rearmonizacionElement =
    document.getElementById("rearmonizacion");

const interpretaElement =
    document.getElementById("interpreta");

const radioFondo =
    document.getElementById("radioFondo");

const listaCola =
    document.getElementById("listaCola");

const listaOrdenElement =
    document.getElementById("listaOrden");

const selectorCancion =
    document.getElementById("selectorCancion");

const imagenEditor =
    document.getElementById("imagenEditor");

const mensajeOrden =
    document.getElementById("mensajeOrden");

const mensaje =
    document.getElementById("mensaje");


/* =========================================================
   CARGAR DATOS VISUALES DE UNA MARCHA
========================================================= */

async function cargarDatosCancion(id) {

    if (!id) {
        return;
    }

    const cancionRef =
        ref(db, "canciones/" + id);

    try {

        const snapshot =
            await get(cancionRef);

        if (!snapshot.exists()) {

            console.log(
                "No existe la canción:",
                id
            );

            return;

        }

        const cancion =
            snapshot.val();

        datosCanciones[id] =
            cancion;

        cancionActualId =
            id;


        const posicion =
            listaCanciones.indexOf(id);

        if (posicion !== -1) {

            indiceActual =
                posicion;

        }


        tituloElement.value =
            cancion.titulo || "";

        compositorElement.value =
            cancion.compositor || "";

        adaptacionElement.value =
            cancion.adaptacion || "";

        arregloElement.value =
            cancion.arreglo || "";

        rearmonizacionElement.value =
            cancion.rearmonizacion || "";

        interpretaElement.value =
            cancion.interpreta || "";


        if (cancion.imagen) {

            radioFondo.style.backgroundImage =
                `url("${cancion.imagen}")`;

            imagenEditor.src =
                cancion.imagen;

        } else {

            radioFondo.style.backgroundImage =
                "none";

            imagenEditor.src =
                "";

        }


        posicionX =
            Number(cancion.posicionX ?? 50);

        posicionY =
            Number(cancion.posicionY ?? 50);

        aplicarPosicionImagen();

        actualizarCola();

    } catch (error) {

        console.error(
            "Error cargando la marcha:",
            error
        );

    }

}


/* =========================================================
   REPRODUCIR AUDIO DEL PANEL
========================================================= */

async function reproducirAudio(id, sincronizar = false) {

    const cancion =
        canciones[id];

    if (!cancion || !cancion.audio) {

        console.log(
            "La marcha no tiene audio:",
            id
        );

        return;

    }


    operacionAudio++;

    const miOperacion =
        operacionAudio;


    console.log(
        "🎵 CARGANDO AUDIO:",
        id
    );


    audioElement.pause();

    audioElement.removeAttribute("src");

    audioElement.load();


    await new Promise(function(resolve) {

        setTimeout(
            resolve,
            50
        );

    });


    if (
        miOperacion !== operacionAudio
    ) {

        return;

    }


    audioElement.src =
        cancion.audio;

    audioElement.load();


    await new Promise(function(resolve, reject) {

        let terminado = false;


        function limpiar() {

            audioElement.removeEventListener(
                "canplay",
                listo
            );

            audioElement.removeEventListener(
                "error",
                error
            );

        }


        function listo() {

            if (terminado) {
                return;
            }

            terminado = true;

            limpiar();

            resolve();

        }


        function error(event) {

            if (terminado) {
                return;
            }

            terminado = true;

            limpiar();

            reject(event);

        }


        audioElement.addEventListener(
            "canplay",
            listo,
            {
                once: true
            }
        );

        audioElement.addEventListener(
            "error",
            error,
            {
                once: true
            }
        );

    }).catch(function(error) {

        if (
            miOperacion === operacionAudio
        ) {

            console.error(
                "❌ Error cargando audio:",
                error
            );

        }

        return;

    });


    if (
        miOperacion !== operacionAudio
    ) {

        return;

    }


    if (
        sincronizar &&
        radio.cancionActual === id &&
        radio.inicioEmision
    ) {

        const segundos =
            Math.max(
                0,
                (Date.now() -
                    radio.inicioEmision) /
                1000
            );


        if (
            Number.isFinite(
                audioElement.duration
            ) &&
            segundos <
                audioElement.duration
        ) {

            audioElement.currentTime =
                segundos;

        }

    } else {

        audioElement.currentTime =
            0;

    }


    try {

        await audioElement.play();

        if (
            miOperacion !== operacionAudio
        ) {

            audioElement.pause();

            return;

        }


        console.log(
            "🔊 REPRODUCIENDO:",
            id
        );

    } catch (error) {

        if (
            miOperacion !== operacionAudio
        ) {

            return;

        }


        console.error(
            "❌ Error al reproducir:",
            error
        );

    }

}


/* =========================================================
   POSICIÓN DE IMAGEN
========================================================= */

function aplicarPosicionImagen() {

    radioFondo.style.backgroundPosition =
        `${posicionX}% ${posicionY}%`;

    imagenEditor.style.objectPosition =
        `${posicionX}% ${posicionY}%`;

}


/* =========================================================
   CARGAR CANCIONES
========================================================= */

onValue(
    cancionesRef,
    async function(snapshot) {

        canciones =
            snapshot.val() || {};

        datosCanciones =
            canciones;


        try {

            const ordenSnapshot =
                await get(ordenRef);

            ordenGuardado =
                ordenSnapshot.exists()
                    ? ordenSnapshot.val()
                    : [];

        } catch (error) {

            console.error(
                "Error cargando orden:",
                error
            );

            ordenGuardado = [];

        }


        listaCanciones = [];


        if (
            Array.isArray(
                ordenGuardado
            )
        ) {

            ordenGuardado.forEach(
                function(id) {

                    if (
                        canciones[id] &&
                        !listaCanciones.includes(id)
                    ) {

                        listaCanciones.push(id);

                    }

                }
            );

        }


        Object.keys(canciones).forEach(
            function(id) {

                if (
                    !listaCanciones.includes(id)
                ) {

                    listaCanciones.push(id);

                }

            }
        );


        console.log(
            "LISTA FINAL DE MARCHAS:",
            listaCanciones
        );


        selectorCancion.innerHTML =
            '<option value="">Seleccionar marcha</option>';


        listaCanciones.forEach(
            function(id) {

                const cancion =
                    canciones[id];

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    id;

                option.textContent =
                    cancion.titulo || id;

                selectorCancion.appendChild(
                    option
                );

            }
        );


        const indice =
            listaCanciones.indexOf(
                cancionActualId
            );

        if (indice !== -1) {

            indiceActual =
                indice;

        }


        actualizarEditorOrden();
        actualizarCola();

    }
);


/* =========================================================
   RADIO
========================================================= */

onValue(
    radioRef,
    async function(snapshot) {

        radio =
            snapshot.val() || {};


        estadoElement.textContent =
            radio.estado ||
            "Sin emisión";


        /*
         * Aquí NO reproducimos audio.
         */

        if (
            radio.cancionActual
        ) {

            const nuevoId =
                radio.cancionActual;


            if (
                nuevoId !==
                cancionActualId
            ) {

                await cargarDatosCancion(
                    nuevoId
                );

            }

        }


        if (
            radio.estado ===
                "En emisión" ||
            radio.estado ===
                "playing"
        ) {

            estadoElement.textContent =
                "🔴 EN EMISIÓN";

        }


        if (
            radio.estado ===
                "Pausado"
        ) {

            estadoElement.textContent =
                "⏸️ PAUSADO";

        }


        if (
            radio.estado ===
                "stopped"
        ) {

            estadoElement.textContent =
                "⏹️ DETENIDO";

        }


        actualizarCola();

    }
);


/* =========================================================
   COLA
========================================================= */

function actualizarCola() {

    listaCola.innerHTML = "";

    if (
        !Array.isArray(listaCanciones)
    ) {

        return;

    }


    const indice =
        listaCanciones.indexOf(
            cancionActualId
        );


    if (indice === -1) {

        return;

    }


    for (
        let i = indice + 1;
        i < listaCanciones.length;
        i++
    ) {

        const id =
            listaCanciones[i];

        const cancion =
            canciones[id];

        if (!cancion) {

            continue;

        }


        const div =
            document.createElement(
                "div"
            );

        div.textContent =
            cancion.titulo || id;

        div.style.padding =
            "8px 0";

        listaCola.appendChild(
            div
        );

    }

}


/* =========================================================
   REPRODUCIR
========================================================= */

document
    .getElementById("play")
    .addEventListener(
        "click",
        async function() {

            if (!cancionActualId) {
                return;
            }


            const cancion =
                canciones[
                    cancionActualId
                ];


            if (
                !cancion ||
                !cancion.audio
            ) {

                console.log(
                    "La marcha no tiene audio."
                );

                return;

            }


            /*
             * SI ESTABA PAUSADA:
             *
             * NO llamamos reproducirAudio().
             *
             * Simplemente continuamos desde
             * la posición guardada.
             */

            if (
                audioPausado &&
                posicionPausada > 0
            ) {

                try {

                    operacionAudio++;

                    const miOperacion =
                        operacionAudio;


                    audioElement.currentTime =
                        posicionPausada;


                    /*
                     * Actualizar inicioEmision para
                     * que la posición también quede
                     * correctamente sincronizada.
                     */

                    await update(
                        radioRef,
                        {
                            estado:
                                "En emisión",

                            cancionActual:
                                cancionActualId,

                            inicioEmision:
                                Date.now() -
                                (
                                    posicionPausada *
                                    1000
                                )
                        }
                    );


                    await audioElement.play();


                    if (
                        miOperacion !==
                        operacionAudio
                    ) {

                        audioElement.pause();

                        return;

                    }


                    console.log(
                        "▶️ CONTINUANDO DESDE:",
                        posicionPausada
                    );


                    audioPausado =
                        false;

                    posicionPausada =
                        0;


                } catch (error) {

                    console.error(
                        "Error al continuar:",
                        error
                    );

                }

                return;

            }


            /*
             * REPRODUCCIÓN NORMAL.
             *
             * Aquí sí usamos reproducirAudio()
             * porque es una marcha nueva.
             */

            try {

                posicionPausada =
                    0;

                audioPausado =
                    false;


                await update(
                    radioRef,
                    {
                        estado:
                            "En emisión",

                        cancionActual:
                            cancionActualId,

                        inicioEmision:
                            Date.now()
                    }
                );


                await reproducirAudio(
                    cancionActualId,
                    false
                );


            } catch (error) {

                console.error(
                    "Error al reproducir:",
                    error
                );

            }

        }
    );


/* =========================================================
   PAUSAR
========================================================= */

document
    .getElementById("pause")
    .addEventListener(
        "click",
        async function() {

            /*
             * Guardar exactamente dónde quedó.
             */

            posicionPausada =
                Number(
                    audioElement.currentTime
                ) || 0;


            audioPausado =
                true;


            operacionAudio++;

            audioElement.pause();


            console.log(
                "⏸️ PAUSADO EN:",
                posicionPausada
            );


            try {

                await update(
                    radioRef,
                    {
                        estado:
                            "Pausado"
                    }
                );

            } catch (error) {

                console.error(
                    error
                );

            }

        }
    );


/* =========================================================
   DETENER
========================================================= */

document
    .getElementById("stop")
    .addEventListener(
        "click",
        async function() {

            operacionAudio++;

            audioElement.pause();

            audioElement.currentTime =
                0;


            /*
             * Detener elimina la posición guardada.
             */

            posicionPausada =
                0;

            audioPausado =
                false;


            try {

                await update(
                    radioRef,
                    {
                        estado:
                            "stopped"
                    }
                );

            } catch (error) {

                console.error(
                    error
                );

            }

        }
    );


/* =========================================================
   SIGUIENTE
========================================================= */

document
    .getElementById("next")
    .addEventListener(
        "click",
        async function() {

            console.log(
                "BOTÓN SIGUIENTE PRESIONADO"
            );


            if (
                !Array.isArray(
                    listaCanciones
                ) ||
                listaCanciones.length === 0
            ) {

                alert(
                    "Las marchas todavía se están cargando."
                );

                return;

            }


            let indiceReal =
                listaCanciones.indexOf(
                    cancionActualId
                );


            console.log(
                "Canción actual:",
                cancionActualId
            );

            console.log(
                "Índice actual:",
                indiceReal
            );

            console.log(
                "Lista:",
                listaCanciones
            );


            if (
                indiceReal === -1 &&
                radio.cancionActual
            ) {

                indiceReal =
                    listaCanciones.indexOf(
                        radio.cancionActual
                    );

                if (
                    indiceReal !== -1
                ) {

                    cancionActualId =
                        radio.cancionActual;

                }

            }


            if (
                indiceReal === -1
            ) {

                alert(
                    "No se encontró la marcha actual en el orden."
                );

                return;

            }


            indiceActual =
                indiceReal;


            if (
                indiceReal >=
                listaCanciones.length - 1
            ) {

                alert(
                    "Ya estás en la última marcha."
                );

                return;

            }


            const siguienteId =
                listaCanciones[
                    indiceReal + 1
                ];


            console.log(
                "CAMBIANDO A:",
                siguienteId
            );


            try {

                /*
                 * La nueva marcha empieza desde 0.
                 */

                posicionPausada =
                    0;

                audioPausado =
                    false;


                operacionAudio++;

                audioElement.pause();


                await update(
                    radioRef,
                    {
                        estado:
                            "En emisión",

                        cancionActual:
                            siguienteId,

                        inicioEmision:
                            Date.now()
                    }
                );


                cancionActualId =
                    siguienteId;

                indiceActual =
                    indiceReal + 1;


                await cargarDatosCancion(
                    siguienteId
                );


                await reproducirAudio(
                    siguienteId,
                    false
                );


            } catch (error) {

                console.error(
                    "No se pudo cambiar de marcha:",
                    error
                );

            }

        }
    );


/* =========================================================
   ANTERIOR
========================================================= */

document
    .getElementById("previous")
    .addEventListener(
        "click",
        async function() {

            console.log(
                "BOTÓN ANTERIOR PRESIONADO"
            );


            if (
                !Array.isArray(
                    listaCanciones
                ) ||
                listaCanciones.length === 0
            ) {

                alert(
                    "Las marchas todavía se están cargando."
                );

                return;

            }


            let indiceReal =
                listaCanciones.indexOf(
                    cancionActualId
                );


            console.log(
                "Canción actual:",
                cancionActualId
            );

            console.log(
                "Índice actual:",
                indiceReal
            );


            if (
                indiceReal === -1 &&
                radio.cancionActual
            ) {

                indiceReal =
                    listaCanciones.indexOf(
                        radio.cancionActual
                    );

                if (
                    indiceReal !== -1
                ) {

                    cancionActualId =
                        radio.cancionActual;

                }

            }


            if (
                indiceReal === -1
            ) {

                alert(
                    "No se encontró la marcha actual en el orden."
                );

                return;

            }


            indiceActual =
                indiceReal;


            if (
                indiceReal <= 0
            ) {

                alert(
                    "Ya estás en la primera marcha."
                );

                return;

            }


            const anteriorId =
                listaCanciones[
                    indiceReal - 1
                ];


            console.log(
                "CAMBIANDO A:",
                anteriorId
            );


            try {

                /*
                 * La nueva marcha empieza desde 0.
                 */

                posicionPausada =
                    0;

                audioPausado =
                    false;


                operacionAudio++;

                audioElement.pause();


                await update(
                    radioRef,
                    {
                        estado:
                            "En emisión",

                        cancionActual:
                            anteriorId,

                        inicioEmision:
                            Date.now()
                    }
                );


                cancionActualId =
                    anteriorId;

                indiceActual =
                    indiceReal - 1;


                await cargarDatosCancion(
                    anteriorId
                );


                await reproducirAudio(
                    anteriorId,
                    false
                );


            } catch (error) {

                console.error(
                    "No se pudo cambiar de marcha:",
                    error
                );

            }

        }
    );


/* =========================================================
   CUANDO TERMINA UNA MARCHA
========================================================= */

audioElement.addEventListener(

    async function() {

        console.log(
            "🎵 TERMINÓ:",

        );


        /*

        posicionPausada =

            listaCanciones.indexOf(

        ) {

            const siguienteId =

                ];

            );

);


/* =========================================================
   EDITOR DE ORDEN
========================================================= */

function actualizarEditorOrden() {

    listaOrdenElement.innerHTML = "";


    listaCanciones.forEach(
        function(id, indice) {

            const cancion =
                canciones[id];

            if (!cancion) {
                return;
            }


            const bloque =
                document.createElement(
                    "div"
                );

            bloque.className =
                "bloqueMarcha";

            bloque.draggable =
                true;

            bloque.dataset.id =
                id;

            bloque.textContent =
                `${indice + 1}. ${
                    cancion.titulo || id
                }`;


            bloque.addEventListener(
                "dragstart",
                function(event) {

                    event.dataTransfer.setData(
                        "text/plain",
                        id
                    );

                }
            );


            bloque.addEventListener(
                "dragover",
                function(event) {

                    event.preventDefault();

                }
            );


            bloque.addEventListener(
                "drop",
                function(event) {

                    event.preventDefault();


                    const idArrastrado =
                        event.dataTransfer.getData(
                            "text/plain"
                        );


                    const idDestino =
                        bloque.dataset.id;


                    if (
                        !idArrastrado ||
                        !idDestino ||
                        idArrastrado ===
                            idDestino
                    ) {

                        return;

                    }


                    const indiceOrigen =
                        listaCanciones.indexOf(
                            idArrastrado
                        );

                    const indiceDestino =
                        listaCanciones.indexOf(
                            idDestino
                        );


                    if (
                        indiceOrigen === -1 ||
                        indiceDestino === -1
                    ) {

                        return;

                    }


                    const movido =
                        listaCanciones.splice(
                            indiceOrigen,
                            1
                        )[0];


                    listaCanciones.splice(
                        indiceDestino,
                        0,
                        movido
                    );


                    actualizarEditorOrden();

                }
            );


            listaOrdenElement.appendChild(
                bloque
            );

        }
    );

}
