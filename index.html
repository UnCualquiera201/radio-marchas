```html
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Marchas</title>

    <style>
        #radioFondo {
            width: 100%;
            min-height: 300px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            padding: 30px;
            box-sizing: border-box;
        }

        #editor {
            margin-top: 25px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 12px;
            max-width: 600px;
        }

        #editor select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
        }

        #editor button {
            padding: 10px 15px;
            margin: 4px;
            cursor: pointer;
        }

        .posicion {
            margin: 10px 0;
            font-weight: bold;
        }

        #mensajeGuardado {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div id="radioFondo">
        <h1>Radio Marchas</h1>
    </div>

    <p id="estado">Conectando con Firebase...</p>

    <h2 id="titulo">Cargando canción...</h2>

    <p id="compositor"></p>
    <p id="adaptacion"></p>
    <p id="arreglo"></p>
    <p id="rearmonizacion"></p>
    <p id="interpreta"></p>

    <button id="play">▶️ Play</button>
    <button id="pause">⏸️ Pausa</button>
    <button id="stop">⏹️ Stop</button>
    <button id="previous">⏮️ Anterior</button>
    <button id="next">⏭️ Siguiente</button>

    <audio id="audio"></audio>

    <div id="cola"></div>


    <!-- ========================= -->
    <!-- EDITOR DE POSICIÓN -->
    <!-- ========================= -->

    <div id="editor">

        <h2>🖼️ Editor de imagen</h2>

        <p>Selecciona una marcha:</p>

        <select id="selectorCancion">
            <option value="">Seleccionar marcha...</option>
        </select>

        <div class="posicion">
            Posición X:
            <span id="valorX">50</span>%
        </div>

        <button id="izquierda">⬅️ Izquierda</button>
        <button id="derecha">➡️ Derecha</button>

        <div class="posicion">
            Posición Y:
            <span id="valorY">50</span>%
        </div>

        <button id="arriba">⬆️ Arriba</button>
        <button id="abajo">⬇️ Abajo</button>

        <br><br>

        <button id="guardar">
            💾 Guardar posición
        </button>

        <p id="mensajeGuardado"></p>

    </div>


    <script type="module">

        import { initializeApp }
            from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

        import {
            getDatabase,
            ref,
            onValue,
            update,
            get
        } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


        // =========================
        // FIREBASE
        // =========================

        const firebaseConfig = {
            apiKey: "AIzaSyBCKrD4b9-LyokfCtvxm1j18_J35O6w9AQ",
            authDomain: "radio-marchas.firebaseapp.com",
            databaseURL: "https://radio-marchas-default-rtdb.firebaseio.com",
            projectId: "radio-marchas",
            storageBucket: "radio-marchas.firebasestorage.app",
            messagingSenderId: "190263587385",
            appId: "1:190263587385:web:1c6a77e370c0103da913e8"
        };


        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);


        const radioRef =
            ref(db, "radio");

        const cancionActualRef =
            ref(db, "radio/cancionActual");

        const cancionInicialRef =
            ref(db, "canciones/marcha1");

        const cancionesRef =
            ref(db, "canciones");


        const audioElement =
            document.getElementById("audio");


        // =========================
        // VARIABLES
        // =========================

        let listaCanciones = [];

        let indiceActual = 0;

        let cancionActualId = "marcha1";

        let datosCanciones = {};

        let cancionEditando = "";

        let posicionX = 50;

        let posicionY = 50;


        // =========================
        // FONDO DE LA RADIO
        // =========================

        function actualizarFondo(cancion) {

            const radioFondo =
                document.getElementById("radioFondo");


            if (!cancion || !cancion.imagen) {

                radioFondo.style.backgroundImage =
                    "none";

                return;
            }


            radioFondo.style.backgroundImage =
                `url("${cancion.imagen}")`;


            const x =
                cancion.posicionX !== undefined
                    ? Number(cancion.posicionX)
                    : 50;


            const y =
                cancion.posicionY !== undefined
                    ? Number(cancion.posicionY)
                    : 50;


            radioFondo.style.backgroundPosition =
                `${x}% ${y}%`;

        }


        // =========================
        // CARGAR EDITOR
        // =========================

        function cargarEditor(id) {

            const cancion =
                datosCanciones[id];


            if (!cancion) {

                console.log(
                    "No se encontró la canción:",
                    id
                );

                return;
            }


            cancionEditando = id;


            posicionX =
                cancion.posicionX !== undefined
                    ? Number(cancion.posicionX)
                    : 50;


            posicionY =
                cancion.posicionY !== undefined
                    ? Number(cancion.posicionY)
                    : 50;


            console.log(
                "Editando:",
                id,
                "X:",
                posicionX,
                "Y:",
                posicionY
            );


            actualizarVistaEditor();

        }


        // =========================
        // ACTUALIZAR VISTA DEL EDITOR
        // =========================

        function actualizarVistaEditor() {

            if (!cancionEditando) {

                console.log(
                    "No hay ninguna marcha seleccionada."
                );

                return;
            }


            const cancion =
                datosCanciones[cancionEditando];


            if (!cancion) {

                console.log(
                    "No hay datos para:",
                    cancionEditando
                );

                return;
            }


            const radioFondo =
                document.getElementById("radioFondo");


            if (cancion.imagen) {

                radioFondo.style.backgroundImage =
                    `url("${cancion.imagen}")`;

            }


            radioFondo.style.backgroundPosition =
                `${posicionX}% ${posicionY}%`;


            document.getElementById("valorX")
                .textContent = posicionX;


            document.getElementById("valorY")
                .textContent = posicionY;

        }


        // =========================
        // SELECTOR DE MARCHAS
        // =========================

        const selector =
            document.getElementById(
                "selectorCancion"
            );


        selector.addEventListener(
            "change",
            function () {

                const id =
                    selector.value;


                if (!id) {

                    cancionEditando = "";

                    return;
                }


                cargarEditor(id);

            }
        );


        // =========================
        // IZQUIERDA
        // =========================

        document.getElementById("izquierda")
            .addEventListener(
                "click",
                function () {

                    if (!cancionEditando) {

                        alert(
                            "Primero selecciona una marcha."
                        );

                        return;
                    }


                    posicionX -= 5;


                    if (posicionX < 0) {

                        posicionX = 0;

                    }


                    actualizarVistaEditor();

                }
            );


        // =========================
        // DERECHA
        // =========================

        document.getElementById("derecha")
            .addEventListener(
                "click",
                function () {

                    if (!cancionEditando) {

                        alert(
                            "Primero selecciona una marcha."
                        );

                        return;
                    }


                    posicionX += 5;


                    if (posicionX > 100) {

                        posicionX = 100;

                    }


                    actualizarVistaEditor();

                }
            );


        // =========================
        // ARRIBA
        // =========================

        document.getElementById("arriba")
            .addEventListener(
                "click",
                function () {

                    if (!cancionEditando) {

                        alert(
                            "Primero selecciona una marcha."
                        );

                        return;
                    }


                    posicionY -= 5;


                    if (posicionY < 0) {

                        posicionY = 0;

                    }


                    actualizarVistaEditor();

                }
            );


        // =========================
        // ABAJO
        // =========================

        document.getElementById("abajo")
            .addEventListener(
                "click",
                function () {

                    if (!cancionEditando) {

                        alert(
                            "Primero selecciona una marcha."
                        );

                        return;
                    }


                    posicionY += 5;


                    if (posicionY > 100) {

                        posicionY = 100;

                    }


                    actualizarVistaEditor();

                }
            );


        // =========================
        // GUARDAR
        // =========================

        document.getElementById("guardar")
            .addEventListener(
                "click",
                async function () {

                    if (!cancionEditando) {

                        alert(
                            "Primero selecciona una marcha."
                        );

                        return;
                    }


                    try {

                        const ruta =
                            "canciones/" +
                            cancionEditando;


                        const cancionRefEditor =
                            ref(db, ruta);


                        await update(
                            cancionRefEditor,
                            {
                                posicionX: posicionX,
                                posicionY: posicionY
                            }
                        );


                        datosCanciones[
                            cancionEditando
                        ].posicionX =
                            posicionX;


                        datosCanciones[
                            cancionEditando
                        ].posicionY =
                            posicionY;


                        document.getElementById(
                            "mensajeGuardado"
                        ).textContent =
                            "✅ Posición guardada correctamente.";


                    } catch (error) {

                        console.error(
                            "Error al guardar:",
                            error
                        );


                        document.getElementById(
                            "mensajeGuardado"
                        ).textContent =
                            "❌ No se pudo guardar. Revisa las reglas de Firebase.";

                    }

                }
            );


        // =========================
        // MOSTRAR COLA
        // =========================

        function mostrarCola(canciones) {

            const cola =
                document.getElementById("cola");


            cola.innerHTML = "";


            for (
                let i = indiceActual + 1;
                i < listaCanciones.length;
                i++
            ) {

                const idCancion =
                    listaCanciones[i];


                const datosCancion =
                    canciones[idCancion];


                const tarjeta =
                    document.createElement("div");


                tarjeta.style.border =
                    "1px solid #ccc";

                tarjeta.style.padding =
                    "15px";

                tarjeta.style.marginTop =
                    "10px";

                tarjeta.style.borderRadius =
                    "10px";


                tarjeta.innerHTML = `

                    <strong>
                        ${datosCancion.titulo || ""}
                    </strong>

                    ${
                        datosCancion.compositor
                            ? "<br>Compositor: " +
                              datosCancion.compositor
                            : ""
                    }

                    ${
                        datosCancion.adaptacion
                            ? "<br>Adaptación: " +
                              datosCancion.adaptacion
                            : ""
                    }

                    ${
                        datosCancion.arreglo
                            ? "<br>Arreglo: " +
                              datosCancion.arreglo
                            : ""
                    }

                    ${
                        datosCancion.rearmonizacion
                            ? "<br>Rearmonización: " +
                              datosCancion.rearmonizacion
                            : ""
                    }

                    ${
                        datosCancion.interpreta
                            ? "<br>Interpreta: " +
                              datosCancion.interpreta
                            : ""
                    }

                `;


                cola.appendChild(tarjeta);

            }

        }


        // =========================
        // CARGAR CANCIÓN
        // =========================

        async function cargarCancion(indice, reproducir = false) {

            if (listaCanciones.length === 0) {
                return;
            }

            if (indice < 0 || indice >= listaCanciones.length) {
                return;
            }

            indiceActual = indice;
            cancionActualId = listaCanciones[indiceActual];

            mostrarCola(datosCanciones);

            await mostrarCancionPorId(cancionActualId, reproducir);
        }


        // =========================
        // MOSTRAR CANCIÓN ACTUAL
        // =========================

        async function mostrarCancionPorId(id, reproducir = false) {

            if (!id) {
                return;
            }

            const cancionRefActual =
                ref(db, "canciones/" + id);

            try {

                const snapshot =
                    await get(cancionRefActual);

                const cancion =
                    snapshot.val();

                if (!cancion) {
                    return;
                }

                cancionActualId = id;

                const nuevoIndice =
                    listaCanciones.indexOf(id);

                if (nuevoIndice !== -1) {
                    indiceActual = nuevoIndice;
                }

                document.getElementById("titulo").textContent =
                    cancion.titulo || "";

                document.getElementById("compositor").textContent =
                    cancion.compositor
                        ? "Compositor: " + cancion.compositor
                        : "";

                document.getElementById("adaptacion").textContent =
                    cancion.adaptacion
                        ? "Adaptación: " + cancion.adaptacion
                        : "";

                document.getElementById("arreglo").textContent =
                    cancion.arreglo
                        ? "Arreglo: " + cancion.arreglo
                        : "";

                document.getElementById("rearmonizacion").textContent =
                    cancion.rearmonizacion
                        ? "Rearmonización: " + cancion.rearmonizacion
                        : "";

                document.getElementById("interpreta").textContent =
                    cancion.interpreta
                        ? "Interpreta: " + cancion.interpreta
                        : "";

                actualizarFondo(cancion);

                if (cancion.audio) {
                    audioElement.src = cancion.audio;
                }

                if (reproducir) {
                    try {
                        await audioElement.play();
                    } catch (error) {
                        console.log(
                            "El navegador necesita que el visitante pulse Play:",
                            error
                        );
                    }
                }

            } catch (error) {

                console.error(
                    "Error al cargar la marcha:",
                    error
                );

            }
        }


        // =========================
        // CARGAR TODAS LAS CANCIONES
        // =========================

        onValue(
            cancionesRef,
            function (snapshot) {

                const canciones =
                    snapshot.val();


                datosCanciones =
                    canciones || {};


                if (!canciones)
                    return;


                listaCanciones =
                    Object.keys(
                        canciones
                    );


                console.log(
                    "Canciones:",
                    listaCanciones
                );


                mostrarCola(
                    canciones
                );


                // LIMPIAR SELECTOR

                selector.innerHTML =
                    "";


                const opcionInicial =
                    document.createElement(
                        "option"
                    );


                opcionInicial.value =
                    "";


                opcionInicial.textContent =
                    "Seleccionar marcha...";


                selector.appendChild(
                    opcionInicial
                );


                // AGREGAR MARCHAS

                listaCanciones.forEach(
                    function (id) {

                        const option =
                            document.createElement(
                                "option"
                            );


                        option.value =
                            id;


                        option.textContent =
                            canciones[id].titulo ||
                            id;


                        selector.appendChild(
                            option
                        );

                    }
                );

            }
        );


        // =========================
        // EMISIÓN CENTRAL
        // =========================

        onValue(
            radioRef,
            async function (snapshot) {

                const radio = snapshot.val();

                if (!radio)
                    return;

                document.getElementById("estado").textContent =
                    "Estado: " +
                    (radio.estado || "Fuera del aire");

                // Todos los visitantes reciben la misma marcha.
                if (
                    radio.cancionActual &&
                    radio.cancionActual !== cancionActualId
                ) {

                    await mostrarCancionPorId(
                        radio.cancionActual,
                        false
                    );

                }

            }
        );


        // =========================
        // INICIAR EMISIÓN
        // =========================

        async function iniciarEmision(id) {

            if (!id)
                return;

            try {

                await update(
                    radioRef,
                    {
                        estado: "En emisión",
                        cancionActual: id
                    }
                );

                await mostrarCancionPorId(id, true);

            } catch (error) {

                console.error(
                    "No se pudo iniciar la emisión:",
                    error
                );

            }

        }


        // =========================
        // CANCIÓN INICIAL
        // =========================

        get(cancionActualRef)
            .then(function(snapshot) {

                const id = snapshot.val();

                if (id) {

                    mostrarCancionPorId(id, false);

                } else {

                    mostrarCancionPorId("marcha1", false);

                }

            })
            .catch(function(error) {

                console.error(
                    "No se pudo leer la emisión:",
                    error
                );

                mostrarCancionPorId("marcha1", false);

            });


        // =========================
        // AUTO AVANCE
        // =========================

        audioElement.addEventListener(
            "ended",
            async function () {

                if (
                    indiceActual <
                    listaCanciones.length - 1
                ) {

                    const siguienteId =
                        listaCanciones[indiceActual + 1];

                    try {

                        await update(
                            radioRef,
                            {
                                estado: "En emisión",
                                cancionActual: siguienteId
                            }
                        );

                    } catch (error) {

                        console.error(
                            "No se pudo cambiar la emisión:",
                            error
                        );

                    }

                } else {

                    await update(
                        radioRef,
                        {
                            estado: "Fin de emisión"
                        }
                    );

                }

            }
        );


        // =========================
        // PLAY
        // =========================

        document.getElementById("play")
            .addEventListener(
                "click",
                function () {

                    audioElement.play()
                        .catch(function(error) {
                            console.log(
                                "El navegador necesita una interacción para reproducir audio:",
                                error
                            );
                        });

                }
            );


        // =========================
        // PAUSA
        // =========================

        document.getElementById("pause")
            .addEventListener(
                "click",
                function () {

                    audioElement.pause();

                }
            );


        // =========================
        // STOP
        // =========================

        document.getElementById("stop")
            .addEventListener(
                "click",
                function () {

                    audioElement.pause();
                    audioElement.currentTime = 0;

                }
            );


        // =========================
        // SIGUIENTE - CAMBIO CENTRAL
        // =========================

        document.getElementById("next")
            .addEventListener(
                "click",
                async function () {

                    if (
                        indiceActual <
                        listaCanciones.length - 1
                    ) {

                        const siguienteId =
                            listaCanciones[indiceActual + 1];

                        try {

                            await update(
                                radioRef,
                                {
                                    estado: "En emisión",
                                    cancionActual: siguienteId
                                }
                            );

                        } catch (error) {

                            console.error(
                                "No se pudo cambiar la marcha:",
                                error
                            );

                        }

                    }

                }
            );


        // =========================
        // ANTERIOR - CAMBIO CENTRAL
        // =========================

        document.getElementById("previous")
            .addEventListener(
                "click",
                async function () {

                    if (indiceActual > 0) {

                        const anteriorId =
                            listaCanciones[indiceActual - 1];

                        try {

                            await update(
                                radioRef,
                                {
                                    estado: "En emisión",
                                    cancionActual: anteriorId
                                }
                            );

                        } catch (error) {

                            console.error(
                                "No se pudo cambiar la marcha:",
                                error
                            );

                        }

                    }

                }
            );


    </script>

</body>

</html>
```
