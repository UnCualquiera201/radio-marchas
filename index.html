<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue,
    get,
    update,
    set
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {
    apiKey: "AIzaSyBCKrD4b9-LyokCtvxmj1r8_J35O6w9AQ",
    authDomain: "radio-marchas.firebaseapp.com",
    databaseURL: "https://radio-marchas-default-rtdb.firebaseio.com",
    projectId: "radio-marchas",
    storageBucket: "radio-marchas.firebasestorage.app",
    messagingSenderId: "190263587385",
    appId: "1:190263587385:web:1c6a77e370c0103da913e8"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const radioRef = ref(db, "radio");
const cancionesRef = ref(db, "canciones");
const ordenRef = ref(db, "radio/orden");


/* =========================================================
   VARIABLES
========================================================= */

let radio = {};

let canciones = {};

let listaCanciones = [];

let indiceActual = 0;

let cancionActualId = "marcha1";

let datosCanciones = {};

let ordenGuardado = [];

let posicionX = 50;

let posicionY = 50;


/* =========================================================
   ELEMENTOS
========================================================= */

const audioElement = document.getElementById("audio");

const estadoElement =
    document.getElementById("estado");

const tituloElement =
    document.getElementById("titulo");

const compositorElement =
    document.getElementById("compositor");

const adaptacionElement =
    document.getElementById("adaptacion");

const arregloElement =
    document.getElementById("arreglo");

const rearmonizacionElement =
    document.getElementById("rearmonizacion");

const interpretaElement =
    document.getElementById("interpreta");

const radioFondo =
    document.getElementById("radioFondo");

const listaCola =
    document.getElementById("listaCola");

const listaOrdenElement =
    document.getElementById("listaOrden");

const selectorCancion =
    document.getElementById("selectorCancion");

const imagenEditor =
    document.getElementById("imagenEditor");

const mensajeOrden =
    document.getElementById("mensajeOrden");

const mensaje =
    document.getElementById("mensaje");


/* =========================================================
   MOSTRAR DATOS DE LA MARCHA
========================================================= */

async function mostrarCancionPorId(id, reproducir = false) {

    if (!id) {
        return;
    }

    const cancionRef =
        ref(db, "canciones/" + id);

    try {

        const snapshot =
            await get(cancionRef);

        if (!snapshot.exists()) {

            console.log(
                "No existe la canción:",
                id
            );

            return;
        }

        const cancion =
            snapshot.val();

        datosCanciones[id] = cancion;

        cancionActualId = id;

        const posicion =
            listaCanciones.indexOf(id);

        if (posicion !== -1) {
            indiceActual = posicion;
        }


        tituloElement.value =
            cancion.titulo || "";

        compositorElement.value =
            cancion.compositor || "";

        adaptacionElement.value =
            cancion.adaptacion || "";

        arregloElement.value =
            cancion.arreglo || "";

        rearmonizacionElement.value =
            cancion.rearmonizacion || "";

        interpretaElement.value =
            cancion.interpreta || "";


        if (cancion.imagen) {

            radioFondo.style.backgroundImage =
                `url("${cancion.imagen}")`;

            imagenEditor.src =
                cancion.imagen;

        } else {

            radioFondo.style.backgroundImage =
                "none";

            imagenEditor.src = "";
        }


        posicionX =
            Number(cancion.posicionX ?? 50);

        posicionY =
            Number(cancion.posicionY ?? 50);

        aplicarPosicionImagen();


        if (reproducir && cancion.audio) {

            audioElement.src =
                cancion.audio;

            audioElement.currentTime = 0;

            try {
                await audioElement.play();
            } catch (error) {
                console.log(
                    "No se pudo reproducir automáticamente:",
                    error
                );
            }
        }

        actualizarCola();

    } catch (error) {

        console.error(
            "Error cargando la marcha:",
            error
        );
    }
}


/* =========================================================
   POSICIÓN DE IMAGEN
========================================================= */

function aplicarPosicionImagen() {

    radioFondo.style.backgroundPosition =
        `${posicionX}% ${posicionY}%`;

    imagenEditor.style.objectPosition =
        `${posicionX}% ${posicionY}%`;
}


/* =========================================================
   CARGAR CANCIONES
========================================================= */

onValue(
    cancionesRef,
    async function(snapshot) {

        canciones =
            snapshot.val() || {};

        datosCanciones =
            canciones;


        /*
         * Primero intentamos utilizar el orden
         * guardado en Firebase.
         */

        try {

            const ordenSnapshot =
                await get(ordenRef);

            ordenGuardado =
                ordenSnapshot.exists()
                    ? ordenSnapshot.val()
                    : [];

        } catch (error) {

            console.error(
                "Error cargando orden:",
                error
            );

            ordenGuardado = [];
        }


        /*
         * Crear lista nueva
         */

        listaCanciones = [];


        /*
         * Agregar primero las canciones
         * que están en el orden guardado.
         */

        if (Array.isArray(ordenGuardado)) {

            ordenGuardado.forEach(function(id) {

                if (
                    canciones[id] &&
                    !listaCanciones.includes(id)
                ) {

                    listaCanciones.push(id);
                }

            });
        }


        /*
         * Agregar cualquier canción que
         * no estuviera en el orden.
         */

        Object.keys(canciones).forEach(function(id) {

            if (!listaCanciones.includes(id)) {

                listaCanciones.push(id);
            }

        });


        console.log(
            "LISTA FINAL DE MARCHAS:",
            listaCanciones
        );


        /*
         * Crear selector del editor
         */

        selectorCancion.innerHTML =
            '<option value="">Seleccionar marcha</option>';


        listaCanciones.forEach(function(id) {

            const cancion =
                canciones[id];

            const option =
                document.createElement("option");

            option.value = id;

            option.textContent =
                cancion.titulo || id;

            selectorCancion.appendChild(option);

        });


        /*
         * Si ya tenemos una canción actual,
         * actualizar su índice.
         */

        const indice =
            listaCanciones.indexOf(cancionActualId);

        if (indice !== -1) {

            indiceActual = indice;

        }


        actualizarEditorOrden();

        actualizarCola();

    }
);


/* =========================================================
   RADIO
========================================================= */

onValue(
    radioRef,
    async function(snapshot) {

        radio =
            snapshot.val() || {};


        estadoElement.textContent =
            radio.estado || "Sin emisión";


        /*
         * Si Firebase indica una canción
         * diferente, cargarla.
         */

        if (
            radio.cancionActual &&
            radio.cancionActual !== cancionActualId
        ) {

            await mostrarCancionPorId(
                radio.cancionActual,
                false
            );

        }


        /*
         * Actualizar el estado visual
         */

        if (
            radio.estado === "En emisión" ||
            radio.estado === "playing"
        ) {

            estadoElement.textContent =
                "🔴 EN EMISIÓN";

        }


        actualizarCola();

    }
);


/* =========================================================
   COLA
========================================================= */

function actualizarCola() {

    listaCola.innerHTML = "";

    if (!Array.isArray(listaCanciones)) {
        return;
    }

    const indice =
        listaCanciones.indexOf(cancionActualId);

    if (indice === -1) {
        return;
    }


    for (
        let i = indice + 1;
        i < listaCanciones.length;
        i++
    ) {

        const id =
            listaCanciones[i];

        const cancion =
            canciones[id];

        if (!cancion) {
            continue;
        }

        const div =
            document.createElement("div");

        div.textContent =
            cancion.titulo || id;

        div.style.padding =
            "8px 0";

        listaCola.appendChild(div);
    }
}


/* =========================================================
   REPRODUCIR
========================================================= */

document
    .getElementById("play")
    .addEventListener(
        "click",
        async function() {

            if (!cancionActualId) {
                return;
            }


            const cancion =
                canciones[cancionActualId];

            if (!cancion || !cancion.audio) {

                console.log(
                    "La marcha no tiene audio."
                );

                return;
            }


            const posicionActual =
                Number(audioElement.currentTime) || 0;


            const nuevoInicio =
                Date.now() -
                (posicionActual * 1000);


            try {

                await update(
                    radioRef,
                    {
                        estado: "En emisión",
                        cancionActual:
                            cancionActualId,
                        inicioEmision:
                            nuevoInicio
                    }
                );


                audioElement.src =
                    cancion.audio;


                audioElement.currentTime =
                    posicionActual;


                await audioElement.play();

            } catch (error) {

                console.error(
                    "Error al reproducir:",
                    error
                );
            }

        }
    );


/* =========================================================
   PAUSAR
========================================================= */

document
    .getElementById("pause")
    .addEventListener(
        "click",
        async function() {

            audioElement.pause();

            try {

                await update(
                    radioRef,
                    {
                        estado: "Pausado"
                    }
                );

            } catch (error) {

                console.error(error);

            }

        }
    );


/* =========================================================
   DETENER
========================================================= */

document
    .getElementById("stop")
    .addEventListener(
        "click",
        async function() {

            audioElement.pause();

            audioElement.currentTime = 0;

            try {

                await update(
                    radioRef,
                    {
                        estado:
                            "Fin de emisión"
                    }
                );

            } catch (error) {

                console.error(error);

            }

        }
    );


/* =========================================================
   SIGUIENTE
========================================================= */

document
    .getElementById("next")
    .addEventListener(
        "click",
        async function() {

            console.log(
                "BOTÓN SIGUIENTE PRESIONADO"
            );


            /*
             * Verificar que la lista exista.
             */

            if (
                !Array.isArray(listaCanciones) ||
                listaCanciones.length === 0
            ) {

                alert(
                    "Las marchas todavía se están cargando."
                );

                return;
            }


            /*
             * IMPORTANTE:
             * buscar nuevamente la posición real.
             */

            let indiceReal =
                listaCanciones.indexOf(
                    cancionActualId
                );


            console.log(
                "Canción actual:",
                cancionActualId
            );

            console.log(
                "Índice actual:",
                indiceReal
            );

            console.log(
                "Lista:",
                listaCanciones
            );


            if (indiceReal === -1) {

                /*
                 * Intento adicional usando
                 * el valor de Firebase.
                 */

                if (radio.cancionActual) {

                    indiceReal =
                        listaCanciones.indexOf(
                            radio.cancionActual
                        );

                    if (indiceReal !== -1) {

                        cancionActualId =
                            radio.cancionActual;

                    }
                }
            }


            if (indiceReal === -1) {

                alert(
                    "No se encontró la marcha actual en el orden."
                );

                return;
            }


            indiceActual =
                indiceReal;


            /*
             * Comprobar última marcha.
             */

            if (
                indiceReal >=
                listaCanciones.length - 1
            ) {

                alert(
                    "Ya estás en la última marcha."
                );

                return;
            }


            const siguienteId =
                listaCanciones[
                    indiceReal + 1
                ];


            console.log(
                "CAMBIANDO A:",
                siguienteId
            );


            try {

                await update(
                    radioRef,
                    {
                        estado: "En emisión",
                        cancionActual:
                            siguienteId,
                        inicioEmision:
                            Date.now()
                    }
                );


                /*
                 * También actualizamos localmente
                 * para que el botón responda inmediatamente.
                 */

                cancionActualId =
                    siguienteId;

                indiceActual =
                    indiceReal + 1;


                await mostrarCancionPorId(
                    siguienteId,
                    true
                );


            } catch (error) {

                console.error(
                    "No se pudo cambiar la marcha:",
                    error
                );

                alert(
                    "Error al cambiar de marcha. Revisa la consola."
                );
            }

        }
    );

document

            }


            /*

             */

            let indiceReal =
                listaCanciones.indexOf(

                );


            console.log(
                "Canción actual:",
                cancionActualId
            );

            console.log(
                "Índice actual:",
                indiceReal
            );


            if (indiceReal === -1) {

                if (radio.cancionActual) {

                    indiceReal =
                        listaCanciones.indexOf(
                            radio.cancionActual
                        );

                    if (indiceReal !== -1) {

            }

                    }

                );

/* =========================================================
   CUANDO TERMINA UNA MARCHA
========================================================= */

audioElement.addEventListener(
    "ended",
    async function() {

        const indice =
            listaCanciones.indexOf(
                cancionActualId
            );


        if (
            indice !== -1 &&
            indice <
            listaCanciones.length - 1
        ) {

            const siguienteId =
                listaCanciones[
                    indice + 1
                ];


            try {

                await update(
                    radioRef,
                    {

                        cancionActual:

                    }

                    }
                );

            } catch (error) {

/* =========================================================
   EDITOR DE ORDEN
========================================================= */

function actualizarEditorOrden() {

    listaOrdenElement.innerHTML = "";


    listaCanciones.forEach(
        function(id, indice) {

            const cancion =
                canciones[id];

            if (!cancion) {
                return;
            }


            const bloque =
                document.createElement("div");

            bloque.className =
                "bloqueMarcha";

            bloque.draggable = true;

            bloque.dataset.id = id;

            bloque.textContent =
                `${indice + 1}. ${
                    cancion.titulo || id
                }`;


            bloque.addEventListener(
                "dragstart",
                function(event) {

                    event.dataTransfer.setData(
                        "text/plain",
                        id
                    );

                }
            );


            bloque.addEventListener(
                "dragover",
                function(event) {

                    event.preventDefault();

                }
            );


            bloque.addEventListener(
                "drop",
                function(event) {

                    event.preventDefault();


                    const idArrastrado =
                        event.dataTransfer.getData(
                            "text/plain"
                        );


                    const idDestino =
                        bloque.dataset.id;


                    if (
                        !idArrastrado ||
                        !idDestino ||
                        idArrastrado === idDestino
                    ) {

                        return;
                    }


                    const indiceOrigen =
                        listaCanciones.indexOf(
                            idArrastrado
                        );

                    const indiceDestino =
                        listaCanciones.indexOf(
                            idDestino
                        );


                    if (
                        indiceOrigen === -1 ||
                        indiceDestino === -1
                    ) {

                        return;
                    }


                    const movido =
                        listaCanciones.splice(
                            indiceOrigen,
                            1
                        )[0];


                    listaCanciones.splice(
                        indiceDestino,
                        0,
                        movido
                    );


                    actualizarEditorOrden();

                }
            );


            listaOrdenElement.appendChild(
                bloque
            );

        }
    );
}

document

        async function() {

                await set(

                setTimeout(
                    function() {

                        mensajeOrden.textContent =

                    3000
                );


            } catch (error) {

                console.error(error);

                mensajeOrden.textContent =
                    "❌ Error al guardar el orden.";

            }

        }
    );

document

    .addEventListener(
        "click",
        async function() {

            const id =
                selectorCancion.value;

            if (!id) {

                mensaje.textContent =
                    "Selecciona una marcha.";

                return;
            }


            try {

                await update(
                    ref(
                        db,
                        "canciones/" + id
                    ),
                    {
                        posicionX:
                            posicionX,

                        posicionY:
                            posicionY
                    }
                );


                mensaje.textContent =
                    "✅ Posición guardada.";


                setTimeout(
                    function() {

                        mensaje.textContent =
                            "";

                    },
                    3000
                );


            } catch (error) {

                console.error(error);

                mensaje.textContent =
                    "❌ Error al guardar.";

            }

        }
    );
