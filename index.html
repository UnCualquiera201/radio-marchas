<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Marchas</title>
</head>

<body>

    <h1>Radio Marchas</h1>

    <p id="estado">Conectando con Firebase...</p>

    <h2 id="titulo">Cargando canción...</h2>

    <p id="compositor"></p>
    <p id="arreglo"></p>
    <p id="rearmonizacion"></p>
    <p id="interpreta"></p>
<button id="play">▶️ Play</button>
<button id="pause">⏸️ Pausa</button>
<button id="stop">⏹️ Stop</button>
<button id="previous">⏮️ Anterior</button>
    
<audio id="audio"></audio>
<div id="cola"></div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBCKrD4b9-LyokfCtvxm1j18_J35O6w9AQ",
            authDomain: "radio-marchas.firebaseapp.com",
            databaseURL: "https://radio-marchas-default-rtdb.firebaseio.com",
            projectId: "radio-marchas",
            storageBucket: "radio-marchas.firebasestorage.app",
            messagingSenderId: "190263587385",
            appId: "1:190263587385:web:1c6a77e370c0103da913e8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const radioRef = ref(db, "radio");
        const cancionRef = ref(db, "canciones/marcha1");
        const cancionesRef = ref(db, "canciones");
        let listaCanciones = [];
        let indiceActual = 0;
        function mostrarCola(canciones) {
    const cola = document.getElementById("cola");
    cola.innerHTML = "";

    for (let i = indiceActual + 1; i < listaCanciones.length; i++) {
        const idCancion = listaCanciones[i];
        const datosCancion = canciones[idCancion];

        const tarjeta = document.createElement("div");

        tarjeta.style.border = "1px solid #ccc";
        tarjeta.style.padding = "15px";
        tarjeta.style.marginTop = "10px";
        tarjeta.style.borderRadius = "10px";

        tarjeta.innerHTML = `
            <strong>${datosCancion.titulo || ""}</strong>
            ${datosCancion.compositor ? "<br>Compositor: " + datosCancion.compositor : ""}
            ${datosCancion.arreglo ? "<br>Arreglo: " + datosCancion.arreglo : ""}
            ${datosCancion.rearmonizacion ? "<br>Rearmonización: " + datosCancion.rearmonizacion : ""}
            ${datosCancion.interpreta ? "<br>Interpreta: " + datosCancion.interpreta : ""}
        `;

        cola.appendChild(tarjeta);
    }
}

        function cargarCancion(indice) {
    if (listaCanciones.length === 0) return;

    indiceActual = indice;

    const ruta = "canciones/" + listaCanciones[indiceActual];
    const nuevaCancionRef = ref(db, ruta);

    onValue(nuevaCancionRef, (snapshot) => {
        const cancion = snapshot.val();

        if (!cancion) return;

        document.getElementById("titulo").textContent =
            cancion.titulo || "";

        document.getElementById("compositor").textContent =
            cancion.compositor ? "Compositor: " + cancion.compositor : "";

        document.getElementById("arreglo").textContent =
            cancion.arreglo ? "Arreglo: " + cancion.arreglo : "";

        document.getElementById("rearmonizacion").textContent =
            cancion.rearmonizacion ? "Rearmonización: " + cancion.rearmonizacion : "";

        document.getElementById("interpreta").textContent =
            cancion.interpreta ? "Interpreta: " + cancion.interpreta : "";

        if (cancion.audio) {
            audioElement.src = cancion.audio;
        }
    });
}
onValue(cancionesRef, (snapshot) => {
    const canciones = snapshot.val();

    if (canciones) {
        listaCanciones = Object.keys(canciones);
        console.log("Canciones:", listaCanciones);

        mostrarCola(canciones);
    }
});
        onValue(radioRef, (snapshot) => {
            const radio = snapshot.val();

            if (radio) {
                document.getElementById("estado").textContent =
                    "Estado: " + radio.estado;
            }
        });

        onValue(cancionRef, (snapshot) => {
            const cancion = snapshot.val();

            if (cancion) {
                document.getElementById("titulo").textContent =
                    cancion.titulo || "";

                document.getElementById("compositor").textContent =
                    cancion.compositor ? "Compositor: " + cancion.compositor : "";

                document.getElementById("arreglo").textContent =
                    cancion.arreglo ? "Arreglo: " + cancion.arreglo : "";

                document.getElementById("rearmonizacion").textContent =
                    cancion.rearmonizacion ? "Rearmonización: " + cancion.rearmonizacion : "";

                document.getElementById("interpreta").textContent =
                    cancion.interpreta ? "Interpreta: " + cancion.interpreta : "";
            }
        });
        // Cargar el audio de la canción
const audioElement = document.getElementById("audio");
const playButton = document.getElementById("play");
const previousButton = document.getElementById("previous");

previousButton.addEventListener("click", () => {
    if (indiceActual > 0) {
        cargarCancion(indiceActual - 1);
        audioElement.play();
    }
});

onValue(cancionRef, (snapshot) => {
    const cancion = snapshot.val();

    if (cancion && cancion.audio) {
        audioElement.src = cancion.audio;
    }
});

// Botón Play
playButton.addEventListener("click", () => {
    audioElement.play();
});
// Botón Pausa
const pauseButton = document.getElementById("pause");

pauseButton.addEventListener("click", () => {
    audioElement.pause();
});
const stopButton = document.getElementById("stop");

stopButton.addEventListener("click", () => {
    audioElement.pause();
    audioElement.currentTime = 0;
});
    </script>

</body>
</html>
